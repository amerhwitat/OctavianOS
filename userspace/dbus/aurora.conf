<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="live">
    <allow own="org.chimera.Aurora.Session"/>
    <allow own="org.chimera.Aurora.VoiceConnect"/>
    <allow send_destination="org.chimera.Aurora.Session"/>
    <allow send_destination="org.chimera.Aurora.VoiceConnect"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.resolve1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.chimera.Aurora.Session"/>
    <allow send_destination="org.chimera.Aurora.VoiceConnect"/>
  </policy>
</busconfig>
