name: Desktop artwork and layout contracts

on:
  push:
    paths:
      - 'desktop/**'
      - 'tests/desktop/**'
      - '.github/workflows/desktop-artwork.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/desktop/**'
      - '.github/workflows/desktop-artwork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate artwork and layout contracts
        run: python -m unittest discover -s tests/desktop -v
