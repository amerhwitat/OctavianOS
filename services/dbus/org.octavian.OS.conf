<!-- Install at /etc/dbus-1/system.d/org.octavian.OS.conf on hosted Linux. -->
<busconfig>
  <policy user="root"><allow own="org.octavian.OS"/></policy>
  <policy context="default">
    <allow send_destination="org.octavian.OS" send_interface="org.octavian.OS" send_member="Ping"/>
    <allow send_destination="org.octavian.OS" send_interface="org.octavian.OS" send_member="GetStatus"/>
    <allow send_destination="org.octavian.OS" send_interface="org.octavian.OS" send_member="ListServices"/>
  </policy>
</busconfig>
