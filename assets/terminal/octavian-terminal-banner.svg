<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">OCTAVIANOS terminal banner</title><desc id="desc">Marine blue glass terminal banner for OctavianOS with a modern dual-OS command identity.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071c33"/><stop offset=".55" stop-color="#0d4260"/><stop offset="1" stop-color="#122c4c"/></linearGradient><linearGradient id="marine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ce0ff" stop-opacity=".65"/><stop offset=".5" stop-color="#55b7a5" stop-opacity=".32"/><stop offset="1" stop-color="#a2e7ff" stop-opacity=".06"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1ffff" stop-opacity=".18"/><stop offset="1" stop-color="#f1ffff" stop-opacity=".035"/></linearGradient></defs>
<rect width="1600" height="520" rx="34" fill="url(#bg)"/><path d="M0 250 Q260 430 560 240 T1120 270 T1600 110 V520 H0Z" fill="url(#marine)"/><path d="M0 320 Q300 470 620 320 T1180 330 T1600 215" fill="none" stroke="#8feaff" stroke-opacity=".4" stroke-width="3"/>
<g fill="#eafaff" opacity=".7"><circle cx="1330" cy="68" r="2"/><circle cx="1450" cy="120" r="2.5"/><circle cx="1210" cy="175" r="2"/><circle cx="1510" cy="260" r="2"/><circle cx="1090" cy="85" r="2"/></g>
<g transform="translate(84 82)"><rect width="82" height="82" rx="22" fill="url(#glass)" stroke="#a8eaff" stroke-opacity=".75"/><path d="M20 24 L40 41 L20 58 M47 59 H64" fill="none" stroke="#a8eaff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="192" y="112" fill="#effaff" font-family="Inter,Segoe UI,sans-serif" font-size="22" letter-spacing="5">MARINE DESKTOP</text><text x="188" y="190" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-weight="700" font-size="76">OCTAVIANOS</text><text x="192" y="235" fill="#a8eaff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="25">A familiar command line. A carefully gated platform.</text>
<rect x="84" y="290" width="1432" height="152" rx="22" fill="url(#glass)" stroke="#c9f4ff" stroke-opacity=".38"/><circle cx="119" cy="325" r="7" fill="#ff7b8c"/><circle cx="144" cy="325" r="7" fill="#ffd166"/><circle cx="169" cy="325" r="7" fill="#61e6b5"/><text x="112" y="370" fill="#a8eaff" font-family="ui-monospace,monospace" font-size="24">octavian@marine</text><text x="337" y="370" fill="#ffffff" font-family="ui-monospace,monospace" font-size="24">:~$</text><text x="397" y="370" fill="#dcefff" font-family="ui-monospace,monospace" font-size="24">shell --list  |  terminal --catalog</text><text x="112" y="414" fill="#d2edff" font-family="ui-monospace,monospace" font-size="18">bash · zsh · fish · nushell · PowerShell · kitty · WezTerm · foot · xterm</text><text x="1510" y="482" text-anchor="end" fill="#d5f0ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" letter-spacing="3">NATIVE • COMPATIBILITY • EMULATION • NOT TESTED</text></svg>