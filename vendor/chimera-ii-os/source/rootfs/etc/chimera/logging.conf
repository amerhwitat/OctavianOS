# Chimera II Logging Configuration

[global]
level=INFO
format=structured
persistent=true
journaling=true

[rotation]
enabled=true
max_size=10M
max_files=10
rotate=daily
compress=true

[kernel]
level=INFO
max_size=20M
max_files=20

[boot]
level=INFO
max_size=10M
max_files=10

[services]
level=INFO
max_size=20M
max_files=15

[security]
level=NOTICE
max_size=50M
max_files=50

[audit]
enabled=true
max_size=50M
max_files=50

[panic]
enabled=true
persistent=true
max_files=20
