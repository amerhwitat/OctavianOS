# Gates policy menu shared by native Koronos and Linux Live ISO builds.
# It is a GRUB2 configuration layer, not a separate firmware loader.
insmod all_video
insmod normal
insmod gfxterm
insmod jpeg
insmod png
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
set timeout=8
set default=0
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; elif [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; fi
echo "[GATES] Policy menu loaded; Jasper owns target selection."
if [ -s /boot/spitfire/Init.mp4 ]; then echo "[GATES] Init.mp4 staged; playback begins after Linux/Openbox handoff."; fi
menuentry "Gates — Continue to Jasper target manager" --id gates-to-jasper {
  if [ -s /boot/jasper/live-image.cfg ]; then
    configfile /boot/jasper/live-image.cfg
  elif [ -s /boot/jasper/jasper.cfg ]; then
    configfile /boot/jasper/jasper.cfg
  else
    echo "[BLOCKED] No Jasper target menu is present in this ISO."
    sleep 10
  fi
}
menuentry "Gates — Native Koronos Jasper manager" --id gates-native-jasper {
  if [ -s /boot/jasper/jasper.cfg ]; then
    configfile /boot/jasper/jasper.cfg
  else
    echo "[INFO] Native Jasper manager is not included; use the Live target manager."
    sleep 5
  fi
}
menuentry "Gates — Return to Spit Fire menu" --id gates-to-spitfire {
  configfile /boot/spitfire/spitfire-menu.cfg
}
menuentry "Gates — UEFI firmware setup" --id gates-firmware {
  if [ "${grub_platform}" = efi ]; then fwsetup; else echo "Firmware setup is available only in UEFI mode."; sleep 5; fi
}
menuentry "Gates — Boot diagnostics" --id gates-diagnostics {
  echo "[GATES] platform=${grub_platform} root=${root} cmdpath=${cmdpath} gfxmode=${gfxmode}"
  ls /boot; ls /boot/candidates; ls /live; sleep 12
}
menuentry "GRUB 2 command line" --id gates-shell { commandline; }
menuentry "Reboot" --id gates-reboot { reboot; }
menuentry "Power off" --id gates-poweroff { halt; }
