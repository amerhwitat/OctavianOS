# Prefer highest advertised GOP/VBE mode and preserve framebuffer handoff.
set gfxmode=5120x2880,4096x2160,3840x2160,3440x1440,3200x1800,2880x1800,2560x1600,2560x1440,2560x1080,2048x1536,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x800,1280x720,1152x864,1024x768,800x600,640x480,auto
set gfxpayload=keep

set timeout=3
menuentry 'Chimera II OS Enterprise Service Selection' {
  multiboot2 /boot/koronos/koronos.elf
  module2 /install/installer/installation.img chimera-install-image
  module2 /install/installer/installation-manifest.json chimera-install-manifest
  module2 /system/installer/services/service-selection.json chimera-service-selection
  boot
}
