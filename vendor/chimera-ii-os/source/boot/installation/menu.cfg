set timeout=120
set timeout_style=menu
# Chimera II OS installation menu contract.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg
elif [ -f /boot/jasper/background.jpg ]; then
  background_image --mode stretch /boot/jasper/background.jpg
elif [ -f /boot/jasper/background.png ]; then
  background_image --mode stretch /boot/jasper/background.png
fi

menuentry "Install Chimera II OS — Guided" --id install-guided {
  # GRUB's parser requires separate tests; do not chain test commands with &&.
  set chimera_installer_media_complete=1
  if [ ! -f /install/installer/installation.img ]; then
    set chimera_installer_media_complete=0
  fi
  if [ ! -f /install/installer/installation-manifest.json ]; then
    set chimera_installer_media_complete=0
  fi
  if [ ! -f /install/installer/installer-contract.json ]; then
    set chimera_installer_media_complete=0
  fi
  if [ ! -f /install/installer/installation_phases.json ]; then
    set chimera_installer_media_complete=0
  fi
  if [ ! -f /install/installer/installer_profiles.json ]; then
    set chimera_installer_media_complete=0
  fi
  if [ "$chimera_installer_media_complete" = "1" ]; then
    configfile /boot/jasper/install.cfg
  else
    echo "ERROR: Chimera installation media contracts are incomplete."
    echo "Required: installation.img, installation-manifest.json, installer-contract.json,"
    echo "installation_phases.json and installer_profiles.json."
    echo "Rebuild the ISO with the native installation media stage enabled."
    sleep 8
  fi
}
menuentry "Install Chimera II OS — Recovery / Repair" --id install-recovery {
  configfile /boot/jasper/recovery.cfg
}
menuentry "Run Aurora Live First" --id install-live {
  configfile /boot/jasper/live.cfg
}
