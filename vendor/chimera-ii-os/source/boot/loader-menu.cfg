# Chimera II universal boot menu
# Canonical path: Spit Fire -> Jasper/Gates -> Koronos -> Aurora.
# Firmware-specific adapters may translate these entries to native syntax.

echo "[--------------------]  0%  Chimera II OS universal boot menu"
echo "[#####---------------] 25%  Spit Fire / Jasper"
echo "[##########----------] 50%  GRUB / hardware discovery"
echo "[###############-----] 75%  Koronos / drivers"
echo "[####################] 100% Aurora menu ready"

menuentry "Chimera II OS — Aurora Live / Desktop" {
  configfile /boot/jasper/live.cfg
}

menuentry "Chimera II OS — Safe Graphics" {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initrd safe-graphics
  module2 /boot/live/live-manifest.json live-manifest
  module2 /boot/visual/aurora-wayland-glass.jpg aurora-background
}

menuentry "Chimera II OS — Diagnostics" {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/chimera-recovery.elf diagnostics
  module2 /boot/visual/aurora-wayland-glass.jpg aurora-background
}

menuentry "Chimera II OS — Native Spit Fire" {
  chainloader /boot/spitfire/native-loader
}

menuentry "Linux — installed system" {
  chainloader /EFI/linux/grubx64.efi
}

menuentry "Windows Boot Manager" {
  chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Chimera II OS Setup" {
  configfile /boot/jasper/install.cfg
}

menuentry "Hardware Diagnostics / Recovery" {
  configfile /boot/jasper/recovery.cfg
}
