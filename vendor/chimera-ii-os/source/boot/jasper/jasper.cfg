# Jasper Boot Manager — Chimera II OS
# Canonical high-level boot selection; GRUB/Spit Fire adapters consume the same IDs.
# Progress shows verified menu/handoff steps; kernel/userspace must report real runtime events.
set timeout=8
set default=0
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
# GRUB reports menu/handoff progress; runtime percentages require emitted events.
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
if [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; elif [ -f /boot/jasper/aurora-boot.png ]; then background_image --mode stretch /boot/jasper/aurora-boot.png; elif [ -f /boot/jasper/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/jasper/aurora-wayland-glass.jpg; elif [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; fi
if [ -f /boot/jasper/boot-artwork-manifest.json ]; then echo "JASPER artwork contract: ready"; fi
if [ -f /boot/jasper/Init.mp4 ]; then echo "JASPER intro media: ready"; fi
echo "[#####---------------] 25%  JASPER boot policy manager"
echo "[########------------] 40%  Selecting boot profile"
menuentry "Chimera II OS — Live Aurora / Koronos" --id chimera-live { echo "[##########----------] 50%  Loading Aurora Live"; configfile /boot/jasper/live.cfg }
menuentry "Chimera II OS — Install Chimera II OS" --id chimera-install { echo "[#############-------] 65%  Loading Installer"; configfile /boot/jasper/install.cfg }
menuentry "Chimera II OS — Recovery" --id chimera-recovery { echo "[###############-----] 75%  Loading Recovery"; configfile /boot/jasper/recovery.cfg }
menuentry "Chimera II OS — Diagnostics" --id chimera-diagnostics { echo "[################----] 80%  Loading Diagnostics"; configfile /boot/jasper/diagnostics.cfg }
menuentry "Chimera II OS — Spit Fire Native Path" --id spitfire { configfile /boot/spitfire/spitfire-menu.cfg }
menuentry "Chimera II OS — Retro Computer Center" --id retro { configfile /boot/jasper/retro.cfg }
menuentry "Chimera II OS — Firmware Setup" --id firmware { fwsetup }
menuentry "Reboot" { reboot }
menuentry "Power Off" { halt }
