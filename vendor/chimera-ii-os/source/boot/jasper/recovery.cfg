# Jasper native Recovery path. BusyBox/Linux recovery prototypes are kept
# under /boot/candidates and are not executable by Koronos. A certified native
# runtime marker and its own image are required before this handoff can run.
insmod normal
insmod gfxterm
insmod multiboot2
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm
set timeout=8
set default=0
if [ -f /boot/visual/aurora-recovery.png ]; then background_image --mode stretch /boot/visual/aurora-recovery.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
menuentry "Chimera II OS — Native Koronos Recovery (acceptance-gated)" --id recovery-native {
  if [ -s /boot/koronos/koronos.elf -a -s /boot/candidates/recovery/native-recovery-runtime.ready -a -s /boot/candidates/recovery/chimera-recovery-initramfs.img -a -s /boot/candidates/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery chm.log=verbose chm.progress=events
    module2 /boot/candidates/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/candidates/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "[BLOCKED] Native Koronos Recovery runtime incomplete or not acceptance-certified."
    echo "The BusyBox/Linux prototype is not a native Koronos runtime."
    sleep 12
  fi
}
menuentry "Return to Jasper / GRUB 2" --id recovery-return { configfile /boot/jasper/jasper.cfg }
menuentry "GRUB 2 command line" { commandline; }
menuentry "Reboot" { reboot; }
menuentry "Power Off" { halt; }
