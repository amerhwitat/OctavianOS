# Jasper recovery path — dedicated Koronos recovery initramfs.
insmod normal
insmod gfxterm
# Prefer the highest firmware/adapter-supported mode; fall back through HD and VGA/SVGA.
set gfxmode=3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm
# Runtime progress must come from real completed events, not menu labels.
# These are observed boot-menu/handoff checkpoints, not fabricated runtime percentages.
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
insmod jpeg
insmod png
insmod search
insmod multiboot2
terminal_output gfxterm
set timeout=5
set default=0
if [ -f /boot/visual/aurora-recovery.png ]; then background_image --mode stretch /boot/visual/aurora-recovery.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
menuentry "Chimera II OS — Recovery Terminal" --id recovery-terminal {
  echo "Starting Koronos recovery console..."
  echo "Commands: help status disks mount-root check-root repair-root verify rollback boot-normal"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  boot_log "Staging module: /boot/recovery/chimera-recovery-initramfs.img"
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  boot_log "Staging module: /boot/recovery/recovery-manifest.json"
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Chimera II OS — Recovery / Koronos (legacy)" --id recovery-koronos {
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  boot_log "Staging module: /boot/recovery/recovery-manifest.json"
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Chimera II OS — Safe Graphics Recovery" --id recovery-safe {
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  boot_log "Staging module: /boot/recovery/chimera-recovery-initramfs.img"
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  boot_log "Staging module: /boot/recovery/recovery-manifest.json"
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}
menuentry "Chimera II OS — GRUB Command Line" --id recovery-grub { commandline }
menuentry "Return to Main Boot Menu" --id recovery-return { configfile /boot/grub/grub.cfg }
menuentry "Reboot" { reboot }
menuentry "Power Off" { halt }
