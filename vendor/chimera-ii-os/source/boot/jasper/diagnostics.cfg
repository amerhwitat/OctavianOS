# Jasper diagnostics path — same Koronos kernel, diagnostics selected by payload.
insmod gfxterm
# Prefer the highest firmware/adapter-supported mode; fall back through HD and VGA/SVGA.
set gfxmode=3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm
# Runtime progress must come from real completed events, not menu labels.
# These are observed boot-menu/handoff checkpoints, not fabricated runtime percentages.
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-diagnostics.png ]; then background_image --mode stretch /boot/visual/aurora-diagnostics.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
menuentry "Chimera II OS — Hardware / Kernel Diagnostics" --id diagnostics {
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  boot_log "Staging module: /boot/diagnostics/diagnostics-manifest.json"
  module2 /boot/diagnostics/diagnostics-manifest.json chimera-diagnostics-manifest
  boot_log "Staging module: /boot/visual/aurora-diagnostics.png"
  module2 /boot/visual/aurora-diagnostics.png aurora-background
  boot
}
menuentry "Return to Live Aurora" { configfile /boot/jasper/live.cfg }
