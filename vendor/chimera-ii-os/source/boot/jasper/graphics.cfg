# Shared Jasper/GRUB graphics policy for BIOS and UEFI.
# Requested modes are tried in descending size; firmware/backend support is authoritative.
if [ "$grub_platform" = efi ]; then
    insmod efi_gop
else
    insmod vbe
fi
insmod all_video
insmod gfxterm
set gfxmode=3840x2160x32,2560x1440x32,1920x1200x32,1920x1080x32,1680x1050x32,1600x1200x32,1600x900x32,1440x900x32,1366x768x32,1280x1024x32,1280x720x32,1024x768x32,800x600x32,640x480x32,auto
set gfxpayload=keep
terminal_output gfxterm
if [ -f /boot/jasper/artwork/jasper-gates-boot.png ]; then
    background_image --mode stretch /boot/jasper/artwork/jasper-gates-boot.png
fi
