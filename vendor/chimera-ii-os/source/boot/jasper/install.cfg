# Jasper native Installer path. This target remains disabled until a native
# Koronos initramfs, native init, filesystem/process services and acceptance marker exist.
insmod normal
insmod gfxterm
insmod multiboot2
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm
set timeout=8
set default=0
menuentry "Chimera II OS — Native Koronos Installer (acceptance-gated)" --id installer {
  if [ -s /boot/koronos/koronos.elf -a -s /boot/candidates/installer/native-installer-runtime.ready -a -s /boot/candidates/installer/installer-initrd.img -a -s /boot/candidates/installer/installation.img -a -s /boot/candidates/installer/installation-manifest.json -a -s /boot/candidates/installer/installer-contract.json -a -s /boot/candidates/installer/installation_phases.json -a -s /boot/candidates/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer chm.log=verbose chm.progress=events
    module2 /boot/candidates/installer/installer-initrd.img chimera-installer-initrd
    module2 /boot/candidates/installer/installation.img chimera-installation-image
    module2 /boot/candidates/installer/installation-manifest.json chimera-installation-manifest
    module2 /boot/candidates/installer/installer-contract.json chimera-installer-contract
    module2 /boot/candidates/installer/installation_phases.json chimera-install-phases
    module2 /boot/candidates/installer/installer_profiles.json chimera-installer-profiles
    boot
  else
    echo "[BLOCKED] Native Koronos Installer runtime incomplete or not acceptance-certified."
    echo "No Linux fallback is substituted; no disk changes were made."
    sleep 12
  fi
}
menuentry "Return to Jasper / GRUB 2" --id installer-return { configfile /boot/jasper/jasper.cfg }
menuentry "GRUB 2 command line" { commandline; }
menuentry "Reboot" { reboot; }
menuentry "Power Off" { halt; }
