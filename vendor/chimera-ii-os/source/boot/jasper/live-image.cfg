# Jasper target manager for the combined Linux Live + experimental Koronos ISO.
# Linux Live/Rescue are distinct from native Koronos Installer/Recovery.
insmod all_video
insmod video
if [ "${grub_platform}" = pc ]; then insmod video_bochs; insmod video_cirrus; fi
if [ "${grub_platform}" = efi ]; then insmod efi_gop; fi
insmod gfxterm
insmod font
insmod normal
insmod multiboot2
insmod reboot
insmod halt
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
set timeout=8
set default=0
echo "[JASPER] Target menu loaded; Init.mp4 plays in Linux userspace after Openbox."
menuentry "Live — Aurora Desktop (Linux Live)" --id live-linux {
  if [ -s /live/vmlinuz -a -s /live/initrd.img ]; then
    linux /live/vmlinuz boot=live components hostname=live username=live console=tty0 console=ttyS0,115200n8 earlycon=uart,io,0x3f8,115200 loglevel=7 ignore_loglevel printk.time=1 log_buf_len=4M initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 rd.systemd.show_status=1 rd.debug
    initrd /live/initrd.img
  else
    echo "[BLOCKED] Linux Live kernel/initrd missing; no native fallback is substituted."
    sleep 12
  fi
}
menuentry "Live — Safe Graphics" --id live-safe {
  if [ -s /live/vmlinuz -a -s /live/initrd.img ]; then
    linux /live/vmlinuz boot=live components hostname=live username=live nomodeset console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 log_buf_len=4M
    initrd /live/initrd.img
  else
    echo "[BLOCKED] Linux Live kernel/initrd missing."
    sleep 12
  fi
}
menuentry "Recovery — Linux Rescue Shell (separate Linux runtime)" --id linux-rescue {
  if [ -s /live/vmlinuz -a -s /live/initrd.img ]; then
    linux /live/vmlinuz boot=live components hostname=recovery username=live chimera.mode=recovery systemd.unit=multi-user.target console=tty0 console=ttyS0,115200n8 earlycon=uart,io,0x3f8,115200 loglevel=7 ignore_loglevel printk.time=1 log_buf_len=4M initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 rd.systemd.show_status=1 rd.debug
    initrd /live/initrd.img
  else
    echo "[BLOCKED] Linux Rescue kernel/initrd missing; native Koronos Recovery is a separate gated target."
    sleep 12
  fi
}
menuentry "Installer — Native Koronos Installer (complete runtime required)" --id native-installer {
  configfile /boot/jasper/install.cfg
}
menuentry "Recovery — Native Koronos Recovery (complete runtime required)" --id native-recovery {
  configfile /boot/jasper/recovery.cfg
}
menuentry "Koronos — Native kernel diagnostics (experimental)" --id koronos-diagnostics {
  if [ -s /boot/koronos/koronos.elf ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    boot
  else
    echo "[BLOCKED] Koronos ELF is missing."
    sleep 10
  fi
}
menuentry "Classic X / Openbox session" --id classic-x {
  if [ -s /live/vmlinuz -a -s /live/initrd.img ]; then
    linux /live/vmlinuz boot=live components hostname=live username=live session=classic console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1
    initrd /live/initrd.img
  else
    echo "[BLOCKED] Linux Live kernel/initrd missing."
    sleep 12
  fi
}
menuentry "Jasper / Spit Fire boot diagnostics" --id jasper-diagnostics {
  echo "platform=${grub_platform} root=${root} cmdpath=${cmdpath} gfxmode=${gfxmode}"
  ls /boot; ls /boot/candidates; ls /live; sleep 12
}
menuentry "Return to Gates policy menu" --id return-gates { configfile /boot/gates/gates-menu.cfg }
menuentry "UEFI firmware setup" --id firmware { if [ "${grub_platform}" = efi ]; then fwsetup; else echo "UEFI setup unavailable in BIOS mode."; sleep 5; fi }
menuentry "GRUB 2 command line" { commandline; }
menuentry "Reboot" { reboot; }
menuentry "Power Off" { halt; }
