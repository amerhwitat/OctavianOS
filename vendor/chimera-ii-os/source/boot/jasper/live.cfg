# Jasper -> Koronos live handoff. No Linux vmlinuz is used.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -z "${CHIMERA_EMULATOR_ID}" ]; then set CHIMERA_EMULATOR_ID=; fi
if [ -f /boot/visual/aurora-live.png ]; then background_image --mode stretch /boot/visual/aurora-live.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi
menuentry "Chimera II OS — Aurora Live (Koronos)" --id aurora-live {
  multiboot2 /boot/koronos/koronos.elf chm.emulator=${CHIMERA_EMULATOR_ID}
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  module2 /boot/visual/aurora-live.png aurora-background
  boot
}
menuentry "Chimera II OS — Safe Graphics (Koronos)" --id aurora-safe {
  multiboot2 /boot/koronos/koronos.elf chm.emulator=${CHIMERA_EMULATOR_ID} safe-graphics
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs safe-graphics
  module2 /boot/live/live-manifest.json chimera-live-manifest
  module2 /boot/visual/aurora-live.png aurora-background
  boot
}
