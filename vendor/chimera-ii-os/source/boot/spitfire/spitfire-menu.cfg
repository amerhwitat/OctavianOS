# Spit Fire native boot menu contract.
# Menu logs report only observed configuration and payload checks; kernel/userspace readiness is separate.
insmod gfxterm
# Prefer the highest firmware/adapter-supported graphics mode, falling back through VGA/SVGA modes.
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
function boot_log { echo "[BOOT] $1"; }
echo "[BOOT] Menu loaded; checking the selected target payload"
insmod jpeg
insmod png
insmod multiboot2
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; elif [ -f /boot/spitfire/background.png ]; then background_image --mode stretch /boot/spitfire/background.png; elif [ -f /boot/spitfire/aurora-boot.png ]; then background_image --mode stretch /boot/spitfire/aurora-boot.png; elif [ -f /boot/spitfire/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/spitfire/aurora-wayland-glass.jpg; elif [ -f /boot/visual/spitfire_background.svg ]; then echo "SPIT FIRE artwork staged"; fi
if [ -f /boot/spitfire/boot-artwork-manifest.json ]; then echo "SPIT FIRE artwork manifest found"; fi
if [ -f /boot/spitfire/Init.mp4 ]; then echo "SPIT FIRE Init.mp4 staged; GRUB does not decode MP4"; fi
menuentry "Spit Fire — Continue to Jasper / GRUB 2" --id spitfire-to-jasper {
  configfile /boot/jasper/jasper.cfg
}
menuentry "Spit Fire — Koronos native kernel diagnostics (experimental)" --id spitfire-koronos {
  if [ -s /boot/koronos/koronos.elf ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics chm.log=verbose chm.progress=events
    boot
  else
    echo "[BLOCKED] Koronos ELF is missing."
    sleep 10
  fi
}
menuentry "Spit Fire — Native Installer (acceptance-gated)" --id spitfire-installer {
  if [ -s /boot/candidates/installer/native-installer-runtime.ready -a -s /boot/candidates/installer/installer-initrd.img -a -s /boot/candidates/installer/installation.img -a -s /boot/candidates/installer/installation-manifest.json -a -s /boot/candidates/installer/installer-contract.json -a -s /boot/candidates/installer/installation_phases.json -a -s /boot/candidates/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer chm.log=verbose chm.progress=events
    module2 /boot/candidates/installer/installer-initrd.img chimera-installer-initrd
    module2 /boot/candidates/installer/installation.img chimera-installation-image
    module2 /boot/candidates/installer/installation-manifest.json chimera-installation-manifest
    module2 /boot/candidates/installer/installer-contract.json chimera-installer-contract
    module2 /boot/candidates/installer/installation_phases.json chimera-install-phases
    module2 /boot/candidates/installer/installer_profiles.json chimera-installer-profiles
    boot
  else
    echo "[BLOCKED] Native Koronos Installer runtime incomplete or not acceptance-certified."
    sleep 12
  fi
}
menuentry "Spit Fire — Dedicated Native Recovery (acceptance-gated)" --id spitfire-recovery {
  if [ -s /boot/candidates/recovery/native-recovery-runtime.ready -a -s /boot/candidates/recovery/chimera-recovery-initramfs.img -a -s /boot/candidates/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery chm.log=verbose chm.progress=events
    module2 /boot/candidates/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/candidates/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "[BLOCKED] Native Koronos Recovery runtime incomplete or not acceptance-certified."
    sleep 12
  fi
}
menuentry "Spit Fire — Return to Jasper / GRUB 2" --id spitfire-return { configfile /boot/jasper/jasper.cfg }
