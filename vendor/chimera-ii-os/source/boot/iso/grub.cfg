# Chimera II OS boot menu. Primary paths are self-contained and expose
# normal, Live CD, installation, recovery, diagnostics and mobile targets.
# Progress shows verified menu/handoff steps; kernel/userspace must report real runtime events.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod gfxmenu
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
if terminal_output gfxterm; then
  set gfxpayload=keep
else
  # Keep a usable boot menu when firmware exposes no compatible graphics mode.
  terminal_output console
  set gfxmode=auto
  set gfxpayload=text
  echo "[WARN] Graphics terminal unavailable; falling back to VGA text console."
fi
# GRUB reports menu/handoff progress; runtime percentages require emitted events.
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
# Ignore stale one-shot GRUB selections inherited from firmware/environment state.
unset next_entry
set timeout=8
set default=0
set boot_progress_width=20
function chimera_progress {
  echo "[--------------------]  0%  $1"
}
function chimera_progress_25 {
  echo "[#####---------------] 25%  $1"
}
function chimera_progress_50 {
  echo "[##########----------] 50%  $1"
}
function chimera_progress_75 {
  echo "[###############-----] 75%  $1"
}
function chimera_progress_100 {
  echo "[####################] 100% $1"
}

echo "[--------------------]  0%  GRUB / Aurora boot menu"
if [ -f /boot/grub/aurora-theme.txt ]; then
  set theme=/boot/grub/aurora-theme.txt
  export theme
elif [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.png
elif [ -f /boot/visual/aurora-menu.png ]; then
  background_image --mode stretch /boot/visual/aurora-menu.png
elif [ -f /boot/visual/aurora-boot.png ]; then
  background_image --mode stretch /boot/visual/aurora-boot.png
elif [ -f /boot/grub/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.jpg
fi
if [ -f /boot/grub/boot-artwork-manifest.json ]; then echo "[#####---------------] 25%  GRUB artwork contract ready"; fi
if [ -f /boot/grub/Init.mp4 ]; then echo "[######--------------] 30%  GRUB intro media ready"; fi
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "Chimera II OS — Live Aurora / Koronos" --id aurora-live {
  chimera_progress "Aurora Live CD"
  chimera_progress_25 "Hardware discovery"
  chimera_progress_50 "Koronos kernel"
  chimera_progress_75 "Aurora services"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Normal Boot [system progress]" --id normal {
  chimera_progress "Starting Koronos"
  chimera_progress_25 "Memory / interrupts"
  chimera_progress_50 "Drivers / storage"
  chimera_progress_75 "Services / Aurora"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Install / Installer Environment [progress UI]" --id install {
  echo "[####----------------]  0%  Installer menu"
  echo "[#####---------------░░] 25%  Checking installation media"
  if [ -f /install/installer/installation.img ] && [ -f /install/installer/installation-manifest.json ] && [ -f /install/installer/installer-contract.json ] && [ -f /install/installer/installation_phases.json ] && [ -f /install/installer/installer_profiles.json ]; then
    echo "[##########----------] 50%  Installation payload verified"
    echo "[###############-----] 75%  Handing off to Jasper installer"
    configfile /boot/installation/menu.cfg
  else
    echo "[##------------------] ERROR: installer media is incomplete"
    echo "Required installation.img and installer contract manifests are missing."
    read
  fi
}

menuentry "Chimera II OS — Live CD Hardware / Driver Progress" --id live-progress {
  echo "[####----------------]  0%  Hardware probe"
  echo "[#####---------------░░] 25%  PCI / USB / storage"
  echo "[##########----------] 50%  GPU / display / audio"
  echo "[###############-----] 75%  Network / power / input"
  chimera_progress_100 "Live handoff"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Enterprise Service Environment [progress]" --id services {
  echo "[####----------------]  0%  Starting service environment"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Repair Terminal / Recovery [progress]" --id recovery {
  echo "[####----------------]  0%  Recovery environment"
  echo "[##########----------] 50%  Recovery initramfs"
  chimera_progress_100 "Recovery terminal ready"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}

menuentry "Chimera II OS — Safe Mode [minimal progress]" --id safe-mode {
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Last Known Good [rollback path]" --id last-known-good {
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Diagnostics [progress]" --id diagnostics {
  echo "[####----------------]  0%  Diagnostics"
  echo "[##########----------] 50%  Recovery tooling"
  chimera_progress_100 "Diagnostics ready"
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}

menuentry "Chimera II OS — Retro Computer Center" --id retro {
  multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "Chimera II OS — Mobile / ARM64 Research Runtime (unavailable on x86_64)" --id mobile {
  echo "[####----------------]  0%  Checking target architecture"
  echo "[##########----------] 50%  This ISO contains the x86_64 Koronos kernel only"
  echo "[####################] 100% Mobile boot is unavailable in this build"
  echo "Build and boot a validated ARM64 image to use the mobile runtime."
  read
}

menuentry "Chimera II OS — Spit Fire / Jasper Native Menu" --id spitfire {
  chimera_progress "Spit Fire / Jasper menu handoff"
  if [ -f /boot/spitfire/spitfire-menu.cfg ]; then
    configfile /boot/spitfire/spitfire-menu.cfg
  else
    echo "[ERROR] Spit Fire native menu configuration is missing."
    read
  fi
}

if [ "$grub_platform" = efi ]; then
  menuentry "Chimera II OS — Jasper Boot Manager / All Modes" --id jasper {
  boot_log "Loading target config: /boot/jasper/jasper.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/jasper.cfg
}

menuentry "Chimera II OS — Installation Menu" --id installation-menu {
  boot_log "Loading target config: /boot/installation/menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/installation/menu.cfg
}

menuentry "Chimera II OS — Recovery Menu" --id recovery-menu {
  boot_log "Loading target config: /boot/jasper/recovery.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/recovery.cfg
}

menuentry "Chimera II OS — Diagnostics Menu" --id diagnostics-menu {
  boot_log "Loading target config: /boot/jasper/diagnostics.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/diagnostics.cfg
}

menuentry "Chimera II OS — Retro / Emulator Center" --id retro-menu {
  boot_log "Loading target config: /boot/jasper/retro.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/retro.cfg
}

menuentry "Chimera II OS — Spit Fire Native Menu" --id spitfire-menu {
  boot_log "Loading target config: /boot/spitfire/spitfire-menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/spitfire/spitfire-menu.cfg
}

menuentry "Chimera II OS — UEFI Firmware Setup" --id firmware { fwsetup; }
else
  menuentry "Chimera II OS — Firmware Setup (BIOS/VMware)" --id firmware-bios {
    echo "Firmware Setup is not available through GRUB in legacy BIOS mode."
    echo "Configure UEFI on the machine/VM to access firmware setup."
    read
  }
fi

menuentry "Chimera II OS — GRUB Command Line" { commandline; }
menuentry "Chimera II OS — Reboot" { reboot; }
menuentry "Chimera II OS — Power Off" { halt; }
