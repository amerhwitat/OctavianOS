# GRUB2 is the executable El Torito/UEFI ISO loader. Spit Fire is the
# first GRUB policy/menu stage and hands off to Jasper's unified target menu.
insmod all_video
insmod video
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod reboot
insmod halt
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
if [ -f /boot/visual/aurora-boot.png ]; then
  background_image --mode stretch /boot/visual/aurora-boot.png
elif [ -f /boot/grub/background.jpg ]; then
  background_image --mode stretch /boot/grub/background.jpg
elif [ -f /boot/grub/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.jpg
fi
echo "[BOOT] GRUB2 firmware loader initialized"
echo "[BOOT] Spit Fire menu -> Jasper / GRUB2 target manager"
configfile /boot/spitfire/spitfire-menu.cfg
