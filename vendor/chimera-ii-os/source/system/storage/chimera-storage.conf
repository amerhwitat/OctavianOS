# Chimera II OS native storage policy
CHIMERA_NATIVE_FILESYSTEM=qfs
CHIMERA_QFS_BLOCK_SIZE=4096
CHIMERA_QFS_MIN_BLOCK_SIZE=4096
CHIMERA_QFS_MAX_BLOCK_SIZE=65536
CHIMERA_QFS_ALLOWED_BLOCK_SIZES=4096,8192,16384,32768,65536
CHIMERA_QFS_REQUIRE_PAGE_SIZE_AT_LEAST_BLOCK=1
CHIMERA_QFS_SECTOR_SIZE=512
CHIMERA_STORAGE_RECOMMENDER=hardware-rnn
