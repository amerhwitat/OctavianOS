# Chimera II OS authentication policy
# Biometric authentication is an additional login path; keep username/password
# as the recovery path. The installer selects modules supported by the host.
# Fingerprint: pam_fprintd
# FIDO2: pam_u2f or an equivalent PAM provider
# Face/iris/palm/voice/vein: provider-specific PAM modules
# Never enable remote biometric authentication by default.
