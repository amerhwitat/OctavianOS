name: ChimeraIIOSApple
options:
  bundleIdPrefix: com.amerhwitat
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  ChimeraIIOSApple:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.chimera2
        GENERATE_INFOPLIST_FILE: YES
  ChimeraIIOSMac:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.chimera2.mac
        GENERATE_INFOPLIST_FILE: YES
