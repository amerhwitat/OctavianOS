name: Build and Push Chimera II OS Docker Hub Fixed Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: amerhwitat/chimera2os

jobs:
  build-push:
    name: Build, validate and publish fixed Chimera2OS image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify source line endings
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d '' f; do
            if grep -Iq . "$f" 2>/dev/null && grep -q $'\\r' "$f"; then
              echo "::error file=$f::CRLF detected"
              bad=1
            fi
          done < <(find . -type f \\
            -not -path './.git/*' \\
            \( -name '*.sh' -o -name '*.bash' -o -name '*.command' -o -name 'Dockerfile*' \) -print0)
          exit "$bad"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-platform fixed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v1.0.0-fixed
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Chimera II OS
            org.opencontainers.image.description=Chimera II OS image with LF-normalized shell scripts and validated shebangs
            org.opencontainers.image.source=https://github.com/amerhwitat/ChimeraIIOS
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=chimera2os
          cache-to: type=gha,mode=max,scope=chimera2os
          provenance: mode=max
          sbom: true

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:v1.0.0-fixed
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:stable
