name: Build and Push Chimera II OS Docker Hub Fixed Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile*'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker-hub-fixed.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/amerhwitat/chimera2os
  DOCKERHUB_IMAGE: amerhwitat/chimera2os
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

jobs:
  build-push:
    name: Build, validate and publish fixed Chimera2OS image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Report source line endings (Dockerfile normalizes scripts)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            if grep -Iq . "$f" 2>/dev/null && LC_ALL=C grep -q $'\r' "$f"; then
              echo "::notice file=$f::CRLF detected; Dockerfile normalizes this source file before build execution"
            fi
          done < <(find . -type f -not -path './.git/*' \( -name '*.sh' -o -name '*.bash' -o -name '*.command' -o -name 'Dockerfile*' \) -print0)

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:stable
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Chimera II OS
            org.opencontainers.image.description=Chimera II OS multi-platform container image
            org.opencontainers.image.source=https://github.com/amerhwitat/ChimeraIIOS
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=chimera2os
          cache-to: type=gha,mode=max,scope=chimera2os
          provenance: mode=max
          sbom: true

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:v1.0.0-fixed
            ${{ env.DOCKERHUB_IMAGE }}:stable
            ${{ env.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Chimera II OS
            org.opencontainers.image.description=Chimera II OS image with LF-normalized shell scripts and validated shebangs
            org.opencontainers.image.source=https://github.com/amerhwitat/ChimeraIIOS
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=chimera2os
          cache-to: type=gha,mode=max,scope=chimera2os
          provenance: mode=max
          sbom: true

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:stable
          if [[ -n "${DOCKERHUB_USERNAME}" && -n "${DOCKERHUB_TOKEN}" ]]; then
            docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:latest
            docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:v1.0.0-fixed
            docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:stable
          else
            echo "::notice::Docker Hub publication skipped; configure DOCKER_USERNAME/DOCKER_PASSWORD or DOCKERHUB_USERNAME/DOCKERHUB_TOKEN."
          fi
