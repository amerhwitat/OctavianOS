name: Build and Push with Docker Build Cloud

on:
  workflow_dispatch:

jobs:
  build-cloud:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your GitHub code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Set up the Build Cloud driver
      - name: Set up Docker Buildx (Cloud Builder)
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          # Replace with your Docker username/org and the name of your cloud builder
          endpoint: "your-org-or-username/your-cloud-builder-name" 

      # 4. Build the image on Docker's cloud infrastructure and push it
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags the image as 'latest' and with the specific Git commit SHA
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            ${{ secrets.DOCKER_USERNAME }}/my-app:${{ github.sha }}
