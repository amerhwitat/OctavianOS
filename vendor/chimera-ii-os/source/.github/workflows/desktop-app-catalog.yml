name: Desktop Application Catalog CI
on:
  push:
    paths:
      - "appcenter/**"
      - ".github/workflows/desktop-app-catalog.yml"
  pull_request:
    paths:
      - "appcenter/**"
      - ".github/workflows/desktop-app-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate application catalog
        run: python appcenter/cli/chimera-appctl.py validate
      - name: Check ISO application manifest matches catalog IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          apps = json.loads(Path('appcenter/catalog/apps.json').read_text(encoding='utf-8'))['apps']
          manifest = Path('iso/manifests/application-catalog.txt').read_text(encoding='utf-8').splitlines()
          ids = [app['id'] for app in apps]
          assert manifest == ids, 'ISO application manifest must exactly match catalog IDs in order'
          print(f'validated {len(manifest)} ISO catalog IDs')
          PY
      - name: Syntax-check standalone browser app scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in (Path("appcenter/paint-studio.html"), Path("appcenter/media-deck.html"), Path("appcenter/document-desk.html"), Path("appcenter/snake-arcade.html")):
              text = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", text, re.S)
              assert scripts, f"missing inline script: {path}"
              Path("/tmp/" + path.stem + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/paint-studio.js
          node --check /tmp/media-deck.js
          node --check /tmp/document-desk.js
          node --check /tmp/snake-arcade.js
      - name: Test Application Center discovery and safe plans
        run: python -m pytest -q appcenter/tests
