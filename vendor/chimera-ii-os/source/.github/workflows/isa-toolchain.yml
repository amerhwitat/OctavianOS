name: Chimera II ISA, installer and command conformance

on:
  push:
    branches: [main]
    paths:
      - 'tools/isa/**'
      - 'tools/shell/**'
      - 'tests/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/isa-toolchain.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isa-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test online catalog merge regression cases
        run: python3 -m unittest discover -s tools/catalogs -p 'test_merge_online_catalogs.py' -v
      - name: Test ISO builder catalog refresh aliases
        run: python3 tests/test_build_cli_options.py
      - name: Validate web assets
        run: python3 -m unittest tests/web/test_web_assets.py
      - name: Generate ISA bitfield registry
        run: python3 tools/isa/generate_isa_bitfields.py --output /tmp/isa_bitfields.json
      - name: Validate complete ISA
        run: python3 tools/isa/test_isa_conformance.py /tmp/isa_bitfields.json
      - name: Validate ISA source reconciliation
        run: python3 tests/isa/test_generate_isa_bitfields.py
      - name: Test LLVM TableGen importer
        run: python3 tests/isa/test_import_llvm_targets.py
      - name: Test pinned RISC-V opcode importer
        run: python3 tests/isa/test_import_riscv_opcodes.py
      - name: Test software N-bit mode runtime and local daemon
        run: |
          python3 -m py_compile tools/runtime/chimera-nbit-mode.py tools/runtime/chimera-nbitd.py
          python3 -m unittest discover -s tools/runtime -p 'test_chimera_nbit_mode.py' -v
          python3 -m unittest discover -s tests/runtime -p 'test_chimera_nbitd.py' -v
          python3 tools/runtime/chimera-nbitd.py --check
      - name: Generate command registry
        run: python3 tools/shell/generate_command_registry.py --output /tmp/chimera_command_registry.json
      - name: Validate installer planner
        run: python3 tests/installer/test_installer_plan.py
      - name: Validate cognition prototype
        run: python3 tests/cognition/test_chimera_rnn.py
      - name: Configure and build
        run: cmake -S . -B build -DCHIMERA_ENABLE_X86_ASM=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
