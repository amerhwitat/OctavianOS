name: Aurora menu runtime CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/aurora/**'
      - 'system/boot/koronos-progress.sh'
      - 'tools/generate-aurora-media.sh'
      - 'tools/tests/test-aurora-events.sh'
      - 'tools/tests/test-koronos-progress.sh'
      - 'config/boot/koronos-progress.json'
  pull_request:
    paths:
      - 'desktop/aurora/**'
      - 'system/boot/koronos-progress.sh'
      - 'tools/generate-aurora-media.sh'
      - 'tools/tests/**'
      - 'config/boot/koronos-progress.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Shell syntax
        run: |
          bash -n desktop/aurora/aurora-event-sound.sh
          bash -n desktop/aurora/aurora-init-splash.sh
          bash -n desktop/aurora/aurora-menu-event.sh
          bash -n system/boot/koronos-progress.sh
          bash -n tools/generate-aurora-media.sh
          sh -n tools/stage-chimera-runtime.sh
      - name: Progress and event tests
        run: |
          bash tools/tests/test-koronos-progress.sh
          bash tools/tests/test-aurora-events.sh
      - name: Media generation smoke test
        run: |
          mkdir -p /tmp/aurora-media
          src=$(find . -type f \( -iname '*.jpg' -o -iname '*.png' \) | head -n 1)
          test -n "$src"
          CHIMERA_AURORA_SOURCE_IMAGE="$src" bash tools/generate-aurora-media.sh /tmp/aurora-media
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/aurora-media/Init.mp4
