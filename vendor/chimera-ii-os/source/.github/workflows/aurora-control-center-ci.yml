name: Aurora Control Center validation
on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - 'web/chimera-hub.js'
      - 'web/chimera-hub.css'
      - 'tools/amiga-local-core/**'
      - 'tools/thamudic-nlp/**'
      - '.github/workflows/aurora-control-center-ci.yml'
  pull_request:
    paths:
      - 'web/index.html'
      - 'web/chimera-hub.js'
      - 'web/chimera-hub.css'
      - 'tools/amiga-local-core/**'
      - 'tools/thamudic-nlp/**'
      - '.github/workflows/aurora-control-center-ci.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: node --check web/chimera-hub.js
      - name: Validate shell scripts
        run: |
          bash -n tools/amiga-local-core/build-local-core.sh
          python3 -m py_compile tools/amiga-local-core/bridge.py tools/thamudic-nlp/bridge.py
          python3 -m py_compile tools/game-center/bridge.py
          python3 -m json.tool web/game-center-manifest.json >/dev/null
          bash -n tools/game-center/build-open-games.sh tools/game-center/fetch-free-assets.sh
      - name: Smoke-test local Thamudic NLP backend
        run: |
          python3 - <<'PY'
          import json, subprocess, time, urllib.request
          p=subprocess.Popen(['python3','tools/thamudic-nlp/bridge.py'])
          try:
              for _ in range(30):
                  try:
                      with urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=1) as r:
                          data=json.load(r)
                      assert data['nlp']['configured'] is True
                      assert data['nlp']['backend'] == 'local-reviewed-corpus'
                      with urllib.request.urlopen('http://127.0.0.1:8766/nlp/capabilities', timeout=1) as r:
                          caps=json.load(r)
                      assert 'transliterate' in caps['features']
                      break
                  except Exception:
                      time.sleep(.2)
              else:
                  raise SystemExit('Thamudic NLP backend did not start')
          finally:
              p.terminate()
              p.wait(timeout=5)
          PY
      - name: Validate Pages boundary
        run: |
          test -s web/index.html
          test -s web/chimera-hub.js
          test -s web/chimera-hub.css
          test ! -e web/amiga-core
          test ! -e web/local-core
          ! grep -R -E 'puae_libretro|\.so|\.dll|\.dylib' web --include='*.html' --include='*.js' --include='*.css'