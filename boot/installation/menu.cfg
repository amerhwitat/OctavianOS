# Keep this submenu visible for 120 seconds before selecting its configured default.
set timeout=120
set timeout_style=menu
set default=0
insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
# Stable alias for integrations that address the installation menu by path.
# The actual installer contract and module ABI live in install.cfg.
terminal_output gfxterm
menuentry "OctavianOS — Native Installer" --id installation-native {
  configfile /boot/jasper/install.cfg
}
menuentry "Return to Jasper Boot Manager" --id installation-return {
  configfile /boot/jasper/jasper.cfg
}
