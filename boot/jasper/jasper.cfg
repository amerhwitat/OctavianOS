# Jasper Boot Manager — OctavianOS
# Canonical high-level boot selection; GRUB/Spit Fire adapters consume the same IDs.
set timeout=8
set default=0
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/jasper/background.png ]; then background_image --mode stretch /boot/jasper/background.png; elif [ -f /boot/jasper/aurora-boot.png ]; then background_image --mode stretch /boot/jasper/aurora-boot.png; elif [ -f /boot/jasper/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/jasper/aurora-wayland-glass.jpg; elif [ -f /boot/visual/aurora-wayland-glass.jpg ]; then background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg; fi
if [ -f /boot/jasper/boot-artwork-manifest.json ]; then echo "JASPER artwork contract: ready"; fi
if [ -f /boot/jasper/Init.mp4 ]; then echo "JASPER intro media: ready"; fi
echo "[#####---------------] 25%  JASPER boot policy manager"
echo "[########------------] 40%  Selecting boot profile"
menuentry "OctavianOS — Live Aurora / Koronos" --id chimera-live { echo "[##########----------] 50%  Loading Aurora Live"; configfile /boot/jasper/live.cfg }
menuentry "OctavianOS — Install OctavianOS" --id chimera-install { echo "[#############-------] 65%  Loading Installer"; configfile /boot/jasper/install.cfg }
menuentry "OctavianOS — Recovery" --id chimera-recovery { echo "[###############-----] 75%  Loading Recovery"; configfile /boot/jasper/recovery.cfg }
menuentry "OctavianOS — Diagnostics" --id chimera-diagnostics { echo "[################----] 80%  Loading Diagnostics"; configfile /boot/jasper/diagnostics.cfg }
menuentry "OctavianOS — Spit Fire Native Path" --id spitfire { configfile /boot/spitfire/spitfire-menu.cfg }
menuentry "OctavianOS — Retro Computer Center" --id retro { configfile /boot/jasper/retro.cfg }
menuentry "OctavianOS — Mobile / ARM64 (not available in x86_64 ISO)" --id mobile-unavailable {
  echo "This ISO contains the x86_64 Koronos kernel only."
  echo "ARM64/mobile requires a matching kernel and device-specific boot chain."
  sleep 8
}
menuentry "OctavianOS — Firmware Setup" --id firmware { fwsetup }
menuentry "Reboot" { reboot }
menuentry "Power Off" { halt }
