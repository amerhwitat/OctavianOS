# Jasper Boot Manager — OctavianOS
# This menu routes to the target-specific configs. Runtime readiness is verified
# by the target userspace, not by these menu labels or echoed progress strings.
# Progress shows verified menu/handoff steps; kernel/userspace must report real runtime events.
set timeout=8
set default=0
insmod gfxterm
# Prefer the highest firmware/adapter-supported graphics mode, falling back through VGA/SVGA modes.
set gfxmode=5120x2880x32,5120x2880x24,5120x2880,4096x2160x32,4096x2160x24,4096x2160,3840x2160x32,3840x2160x24,3840x2160,3440x1440x32,3440x1440x24,3440x1440,3200x1800x32,3200x1800x24,3200x1800,2880x1800x32,2880x1800x24,2880x1800,2560x1600x32,2560x1600x24,2560x1600,2560x1440x32,2560x1440x24,2560x1440,2560x1080x32,2560x1080x24,2560x1080,2048x1536x32,2048x1536x24,2048x1536,1920x1200x32,1920x1200x24,1920x1200,1920x1080x32,1920x1080x24,1920x1080,1680x1050x32,1680x1050x24,1680x1050,1600x1200x32,1600x1200x24,1600x1200,1600x900x32,1600x900x24,1600x900,1440x900x32,1440x900x24,1440x900,1366x768x32,1366x768x24,1366x768,1280x1024x32,1280x1024x24,1280x1024,1280x800x32,1280x800x24,1280x800,1280x720x32,1280x720x24,1280x720,1152x864x32,1152x864x24,1152x864,1024x768x32,1024x768x24,1024x768,800x600x32,800x600x24,800x600,640x480x32,640x480x24,640x480,auto
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
# GRUB reports menu/handoff progress; runtime percentages require emitted events.
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/jasper/background.png ]; then
  background_image --mode stretch /boot/jasper/background.png
elif [ -f /boot/jasper/aurora-boot.png ]; then
  background_image --mode stretch /boot/jasper/aurora-boot.png
elif [ -f /boot/jasper/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/jasper/aurora-wayland-glass.jpg
elif [ -f /boot/visual/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/visual/aurora-wayland-glass.jpg
fi
if [ -f /boot/jasper/boot-artwork-manifest.json ]; then echo "Jasper artwork manifest found"; fi
if [ -f /boot/jasper/Init.mp4 ]; then echo "Jasper intro media found (GRUB does not play MP4 itself)"; fi

menuentry "OctavianOS — Live CD / Choose Aurora or Marine" --id chimera-live {
  boot_log "Loading target config: /boot/jasper/live.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/live.cfg
}
menuentry "OctavianOS — Install OctavianOS" --id chimera-install {
  boot_log "Loading target config: /boot/jasper/install.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/install.cfg
}
menuentry "OctavianOS — Recovery Shell" --id chimera-recovery {
  boot_log "Loading target config: /boot/jasper/recovery.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/recovery.cfg
}
menuentry "OctavianOS — Diagnostics Console" --id chimera-diagnostics {
  boot_log "Loading target config: /boot/jasper/diagnostics.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/diagnostics.cfg
}
menuentry "OctavianOS — Retro / Emulator Center (optional)" --id retro {
  boot_log "Loading target config: /boot/jasper/retro.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/retro.cfg
}
menuentry "OctavianOS — Spit Fire Native Menu" --id spitfire {
  boot_log "Loading target config: /boot/spitfire/spitfire-menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/spitfire/spitfire-menu.cfg
}
menuentry "OctavianOS — Installation Menu Alias" --id installation-menu {
  boot_log "Loading target config: /boot/installation/menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/installation/menu.cfg
}
menuentry "OctavianOS — Safe Graphics / Live Console" --id safe-graphics {
  boot_log "Loading target config: /boot/jasper/safe.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/safe.cfg
}
menuentry "OctavianOS — Mobile / ARM64 (not available in x86_64 ISO)" --id mobile-unavailable {
  echo "This ISO contains an x86_64 Koronos kernel only."
  echo "ARM64/mobile requires a matching kernel, boot chain, and device-specific verification."
  sleep 8
}
if [ "$grub_platform" = efi ]; then
  menuentry "OctavianOS — Firmware Setup" --id firmware { fwsetup; }
fi
menuentry "Reboot" { reboot; }
menuentry "Power Off" { halt; }
