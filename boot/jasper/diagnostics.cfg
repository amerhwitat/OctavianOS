insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
# Diagnostics uses the recovery userspace payload with a distinct requested mode.
insmod multiboot2
terminal_output gfxterm

menuentry "OctavianOS — Diagnostics Console" --id diagnostics-console {
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/recovery/chimera-recovery-initramfs.img  -a  -f /boot/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "ERROR: Diagnostics requires the recovery kernel payload and manifest."
    sleep 8
  fi
}

menuentry "Return to Jasper Boot Manager" --id diagnostics-return {
  configfile /boot/jasper/jasper.cfg
}
