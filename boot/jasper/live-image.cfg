# Shared GRUB 2 / Jasper / Spit Fire target menu for the Linux-kernel live edition.
# Native Koronos Installer/Recovery targets are enabled only when their complete
# runtime payloads are staged. Missing payloads fail closed; no Linux image is
# relabelled as a native Koronos boot.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod font
insmod normal
insmod search
insmod multiboot2
insmod reboot
insmod halt
if [ "${grub_platform}" = efi ]; then insmod efi_gop; fi

# Highest-first firmware/adapter-supported SVGA/HD modes. GRUB falls back
# automatically when a mode is not advertised by the firmware or virtual GPU.
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
set timeout=8
set default=0
set color_normal=light-gray/black
set color_highlight=white/blue

echo "[BOOT 00] Firmware: ${grub_platform}"
echo "[BOOT 01] Jasper target router initialized"
echo "[BOOT 02] Preferred display: 5120x2880; firmware-supported fallback enabled"
echo "[BOOT 03] Framebuffer handoff policy: gfxpayload=keep"
echo "[BOOT 04] Kernel and initramfs diagnostics: verbose"

menuentry "Live — Aurora Desktop (Linux live edition)" --id live-linux {
  echo "[LIVE 10] Loading Linux live kernel"
  echo "[LIVE 20] Loading live initramfs and squashfs root"
  linux /live/vmlinuz boot=live components hostname=live username=live console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 rd.debug
  initrd /live/initrd.img
}

menuentry "Installer — Native Koronos Installer (payload required)" --id installer {
  echo "[INST 10] Validating native Koronos installer payload"
  if [ -f /boot/koronos/koronos.elf -a -f /boot/installer/installer-initrd.img -a -f /install/installer/installation.img -a -f /install/installer/installer-contract.json -a -f /install/installer/installation_phases.json -a -f /install/installer/installer_profiles.json ]; then
    echo "[INST 20] Native kernel and installer contracts found"
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer chm.log=verbose chm.progress=events loglevel=7
    module2 /boot/installer/installer-initrd.img chimera-installer-initrd
    module2 /install/installer/installation.img chimera-installation-image
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /install/installer/installation_phases.json chimera-install-phases
    module2 /install/installer/installer_profiles.json chimera-installer-profiles
    boot
  else
    echo "[INST BLOCKED] Native installer runtime is incomplete."
    echo "Required: Koronos ELF, installer initramfs, installation image and contracts."
    echo "No live desktop fallback will be presented as an installer."
    sleep 12
  fi
}

menuentry "Koronos — Native Kernel Diagnostics (experimental)" --id koronos {
  echo "[KORO 10] Validating native Koronos ELF"
  if [ -f /boot/koronos/koronos.elf ]; then
    echo "[KORO 20] Starting native kernel with verbose diagnostics"
    multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1
    boot
  else
    echo "[KORO BLOCKED] Koronos ELF is not staged in this Linux live ISO."
    echo "Build kernel/build-koronos.sh and provide KORONOS_ELF to the ISO builder."
    sleep 12
  fi
}

menuentry "Recovery — Linux Rescue Shell" --id recovery {
  echo "[RECV 10] Starting Linux live rescue environment"
  echo "[RECV 20] Filesystem, partition, network and hardware tools are available"
  linux /live/vmlinuz boot=live components hostname=recovery username=live chimera.mode=recovery systemd.unit=multi-user.target console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 rd.debug
  initrd /live/initrd.img
}

menuentry "Recovery — Native Koronos Recovery (payload required)" --id recovery-koronos {
  echo "[RECV 30] Validating native Koronos recovery payload"
  if [ -f /boot/koronos/koronos.elf -a -f /boot/recovery/recovery-initramfs.img -a -f /boot/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery chm.log=verbose chm.progress=events loglevel=7
    module2 /boot/recovery/recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "[RECV BLOCKED] Native Koronos recovery payload is incomplete."
    echo "Use the Linux Rescue Shell entry for the available recovery environment."
    sleep 12
  fi
}

menuentry "Classic X / Openbox session" --id classic {
  linux /live/vmlinuz boot=live components hostname=live username=live session=classic console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1
  initrd /live/initrd.img
}
menuentry "Safe graphics (fallback resolution)" --id safe-graphics {
  set gfxmode=1024x768,800x600,640x480,auto
  set gfxpayload=keep
  linux /live/vmlinuz boot=live components hostname=live username=live nomodeset console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1
  initrd /live/initrd.img
}
menuentry "Jasper / Spit Fire boot diagnostics" --id boot-diagnostics {
  echo "[BOOT DIAG] GRUB platform=${grub_platform} cmdpath=${cmdpath} root=${root}"
  echo "[BOOT DIAG] gfxmode=${gfxmode} gfxpayload=${gfxpayload}"
  ls
  ls /boot
  ls /live
  sleep 15
}
menuentry "Jasper Boot Manager — reopen unified targets" --id jasper {
  echo "[JASPER] Unified boot target manager"
  configfile /boot/jasper/jasper.cfg
}
menuentry "Spit Fire Firmware Path — reopen unified targets" --id spitfire {
  echo "[SPIT FIRE] Firmware adapter -> Jasper"
  configfile /boot/spitfire/spitfire-menu.cfg
}
menuentry "GRUB command line" --id grub-shell { commandline; }
menuentry "Reboot" { reboot; }
menuentry "Power off" { halt; }
