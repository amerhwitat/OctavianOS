insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
# Jasper Live CD targets. Payload paths are generated/staged by the ISO build.
# chm.desktop is a requested userspace selection; it is not proof the current
# Koronos build consumes this argument or starts a compositor.
insmod multiboot2
insmod png
insmod jpeg
terminal_output gfxterm
if [ -f /boot/visual/aurora-live.png ]; then background_image --mode stretch /boot/visual/aurora-live.png; fi

menuentry "OctavianOS — Live CD: Aurora Wayland Glass Desktop" --id live-aurora {
  echo "Starting Koronos with the Aurora desktop profile request"
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/user-init-live.elf  -a  -f /boot/live/live-manifest.json -a -f /boot/live/desktop-sessions.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=live chm.desktop=aurora
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/user-init-live.elf chimera-user-init-elf target=live
    module2 /boot/live/live-manifest.json chimera-live-manifest
    module2 /boot/live/desktop-sessions.json octavian-desktop-sessions
    boot
  else
    echo "ERROR: Kernel, Live initramfs, or manifest is missing from this ISO."
    sleep 8
  fi
}

menuentry "OctavianOS — Live CD: Marine Desktop" --id live-marine {
  echo "Starting Koronos with the Marine desktop profile request"
  if [ -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/live-manifest.json -a -f /boot/live/desktop-sessions.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=live chm.desktop=marine
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    module2 /boot/live/desktop-sessions.json octavian-desktop-sessions
    boot
  else
    echo "ERROR: Live initramfs or manifest is missing from this ISO."
    sleep 8
  fi
}

menuentry "OctavianOS — Live CD: Safe Graphics / Console" --id live-safe {
  if [ -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/user-init-live.elf  -a  -f /boot/live/live-manifest.json  ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=safe chm.graphics=basic
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    boot
  else
    echo "ERROR: Kernel or Live payload is missing; cannot enter safe graphics."
    sleep 8
  fi
}

menuentry "Return to Jasper Boot Manager" --id live-return {
  configfile /boot/jasper/jasper.cfg
}
