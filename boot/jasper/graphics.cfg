# Jasper GRUB graphics include fragment.
# Integrate with the actual generated grub.cfg; this file is not active unless sourced.
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
else
    insmod vbe
fi
insmod all_video
insmod gfxterm
set gfxmode="3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto"
terminal_output gfxterm
if [ -f /boot/jasper/artwork/jasper-gates-boot.png ]; then
    background_image /boot/jasper/artwork/jasper-gates-boot.png
fi
# Keep the selected mode only when the kernel's framebuffer handoff validates it.
set gfxpayload=keep
