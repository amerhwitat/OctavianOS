insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
# Retro/emulator center is an optional userspace bundle. Do not boot the live
# initramfs under a misleading Retro label when that bundle is absent.
terminal_output gfxterm
menuentry "OctavianOS — Retro / Emulator Center" --id retro-center {
  if [ -f /boot/retro/retro-manifest.json  -a  -f /boot/retro/retro-initramfs.img ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=retro chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    module2 /boot/retro/retro-initramfs.img octavian-retro-initramfs
    module2 /boot/retro/retro-manifest.json octavian-retro-manifest
    boot
  else
    echo "Retro / emulator userspace is not present in this ISO."
    echo "The menu target is reserved; no emulator payload will be misrepresented as ready."
    sleep 8
  fi
}
menuentry "Return to Jasper Boot Manager" --id retro-return {
  configfile /boot/jasper/jasper.cfg
}
