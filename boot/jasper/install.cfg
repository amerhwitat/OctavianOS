# Jasper native installation path.
insmod gfxterm
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-installer.png ]; then background_image --mode stretch /boot/visual/aurora-installer.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi

menuentry "OctavianOS — Installation Environment (Koronos)" --id installer {
  if [ -f /install/installer/installation.img ] && [ -f /install/installer/installation-manifest.json ] && [ -f /install/installer/installer-contract.json ] && [ -f /install/installer/installation_phases.json ] && [ -f /install/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf
    module2 /install/installer/installation.img octavian-installation-image
    module2 /install/installer/installation-manifest.json octavian-installation-manifest
    module2 /install/installer/installer-contract.json octavian-installer-contract
    module2 /install/installer/installation_phases.json octavian-install-phases
    module2 /install/installer/installer_profiles.json octavian-installer-profiles
    module2 /boot/visual/aurora-installer.png aurora-background
    boot
  else
    echo "ERROR: OctavianOS installation media contracts are incomplete."
    echo "Return to the parent menu and rebuild native installation media."
    sleep 8
  fi
}
menuentry "OctavianOS — Installation Environment (Legacy Initramfs Alias)" --id installer-legacy {
  if [ -f /install/installer/installer-initrd.img ] && [ -f /install/installer/installation-manifest.json ] && [ -f /install/installer/installer-contract.json ]; then
    multiboot2 /boot/koronos/koronos.elf
    module2 /install/installer/installer-initrd.img octavian-installer-initrd
    module2 /install/installer/installation-manifest.json octavian-installation-manifest
    module2 /install/installer/installer-contract.json octavian-installer-contract
    module2 /system/hardware/octavian-hardware-profile.json octavian-hardware-profile
    module2 /system/hardware/compatibility-modes.json octavian-compatibility-modes
    module2 /system/hardware/nbit-policy.conf octavian-nbit-policy
    module2 /boot/visual/aurora-installer.png aurora-background
    boot
  else
    echo "ERROR: legacy installer initramfs contract is incomplete."
    sleep 5
  fi
}
menuentry "Return to Live Aurora" {
  configfile /boot/jasper/live.cfg
}
