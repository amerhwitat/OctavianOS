# Jasper native installation path.
insmod gfxterm
# Prefer highest advertised GOP/VBE mode; keep framebuffer for kernel handoff.
set gfxmode=5120x2880x32,5120x2880x24,5120x2880,4096x2160x32,4096x2160x24,4096x2160,3840x2160x32,3840x2160x24,3840x2160,3440x1440x32,3440x1440x24,3440x1440,3200x1800x32,3200x1800x24,3200x1800,2880x1800x32,2880x1800x24,2880x1800,2560x1600x32,2560x1600x24,2560x1600,2560x1440x32,2560x1440x24,2560x1440,2560x1080x32,2560x1080x24,2560x1080,2048x1536x32,2048x1536x24,2048x1536,1920x1200x32,1920x1200x24,1920x1200,1920x1080x32,1920x1080x24,1920x1080,1680x1050x32,1680x1050x24,1680x1050,1600x1200x32,1600x1200x24,1600x1200,1600x900x32,1600x900x24,1600x900,1440x900x32,1440x900x24,1440x900,1366x768x32,1366x768x24,1366x768,1280x1024x32,1280x1024x24,1280x1024,1280x800x32,1280x800x24,1280x800,1280x720x32,1280x720x24,1280x720,1152x864x32,1152x864x24,1152x864,1024x768x32,1024x768x24,1024x768,800x600x32,800x600x24,800x600,640x480x32,640x480x24,640x480,auto
set gfxpayload=keep
insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
insmod jpeg
insmod png
terminal_output gfxterm
if [ -f /boot/visual/aurora-installer.png ]; then background_image --mode stretch /boot/visual/aurora-installer.png; elif [ -f /boot/visual/aurora-boot.png ]; then background_image --mode stretch /boot/visual/aurora-boot.png; fi

menuentry "OctavianOS — Installation Environment (Koronos)" --id installer {
  if [ -f /boot/koronos/koronos.elf  -a  -f /install/installer/installation.img  -a  -f /install/installer/installation-manifest.json  -a  -f /install/installer/installer-contract.json  -a  -f /install/installer/installation_phases.json  -a  -f /install/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer
    module2 /install/installer/installation.img chimera-installation-image
    module2 /install/installer/installation-manifest.json chimera-installation-manifest
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /install/installer/installation_phases.json chimera-install-phases
    module2 /install/installer/installer_profiles.json chimera-installer-profiles
    if [ -f /boot/visual/aurora-installer.png ]; then module2 /boot/visual/aurora-installer.png aurora-background; fi
    boot
  else
    echo "ERROR: OctavianOS installation media contracts are incomplete."
    echo "Return to the parent menu and rebuild native installation media."
    sleep 8
  fi
}
menuentry "OctavianOS — Installation Environment (Legacy Initramfs Alias)" --id installer-legacy {
  if [ -f /boot/koronos/koronos.elf  -a  -f /install/installer/installer-initrd.img  -a  -f /install/installer/installation-manifest.json  -a  -f /install/installer/installer-contract.json  -a  -f /system/hardware/chimera-hardware-profile.json  -a  -f /system/hardware/compatibility-modes.json  -a  -f /system/hardware/nbit-policy.conf ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer
    module2 /install/installer/installer-initrd.img chimera-installer-initrd
    module2 /install/installer/installation-manifest.json chimera-installation-manifest
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /system/hardware/chimera-hardware-profile.json chimera-hardware-profile
    module2 /system/hardware/compatibility-modes.json chimera-compatibility-modes
    module2 /system/hardware/nbit-policy.conf chimera-nbit-policy
    if [ -f /boot/visual/aurora-installer.png ]; then module2 /boot/visual/aurora-installer.png aurora-background; fi
    boot
  else
    echo "ERROR: legacy installer initramfs contract is incomplete."
    sleep 5
  fi
}
menuentry "Return to Live Desktop Selection" {
  configfile /boot/jasper/live.cfg
}
