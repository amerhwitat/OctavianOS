# Prefer highest advertised GOP/VBE mode; preserve framebuffer at handoff.
set gfxmode=5120x2880,4096x2160,3840x2160,3440x1440,3200x1800,2880x1800,2560x1600,2560x1440,2560x1080,2048x1536,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x800,1280x720,1152x864,1024x768,800x600,640x480,auto
set gfxpayload=keep

insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
# Safe graphics is a direct, minimal Live CD handoff.
# The live userspace must honor chm.mode=safe and chm.graphics=basic; that
# behavior is not claimed until validated against the imported runtime in QEMU.
insmod multiboot2
terminal_output gfxterm
menuentry "OctavianOS — Safe Graphics / Text Recovery" --id safe-graphics {
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/live-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=safe chm.graphics=basic
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    boot
  else
    echo "ERROR: safe mode needs the kernel, live initramfs, and manifest."
    sleep 8
  fi
}
menuentry "Return to Jasper Boot Manager" --id safe-return {
  configfile /boot/jasper/jasper.cfg
}
