# Prefer highest advertised GOP/VBE mode; keep framebuffer for kernel handoff.
set gfxmode=5120x2880x32,5120x2880x24,5120x2880,4096x2160x32,4096x2160x24,4096x2160,3840x2160x32,3840x2160x24,3840x2160,3440x1440x32,3440x1440x24,3440x1440,3200x1800x32,3200x1800x24,3200x1800,2880x1800x32,2880x1800x24,2880x1800,2560x1600x32,2560x1600x24,2560x1600,2560x1440x32,2560x1440x24,2560x1440,2560x1080x32,2560x1080x24,2560x1080,2048x1536x32,2048x1536x24,2048x1536,1920x1200x32,1920x1200x24,1920x1200,1920x1080x32,1920x1080x24,1920x1080,1680x1050x32,1680x1050x24,1680x1050,1600x1200x32,1600x1200x24,1600x1200,1600x900x32,1600x900x24,1600x900,1440x900x32,1440x900x24,1440x900,1366x768x32,1366x768x24,1366x768,1280x1024x32,1280x1024x24,1280x1024,1280x800x32,1280x800x24,1280x800,1280x720x32,1280x720x24,1280x720,1152x864x32,1152x864x24,1152x864,1024x768x32,1024x768x24,1024x768,800x600x32,800x600x24,800x600,640x480x32,640x480x24,640x480,auto
set gfxpayload=keep

insmod png
if [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
# Recovery menu. Recovery media is a generated ISO payload, not checked into
# this source tree. Every launch validates required files before handing off.
insmod multiboot2
terminal_output gfxterm
if [ -f /boot/visual/aurora-recovery.png ]; then background_image --mode stretch /boot/visual/aurora-recovery.png; fi

menuentry "OctavianOS — Recovery Shell / Services" --id recovery-shell {
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/recovery/chimera-recovery-initramfs.img  -a  -f /boot/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery
    module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "ERROR: Recovery kernel, initramfs, or manifest is missing."
    echo "Rebuild the ISO with recovery media enabled."
    sleep 8
  fi
}

menuentry "OctavianOS — Recovery Safe Graphics / Text Mode" --id recovery-safe {
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/recovery/chimera-recovery-initramfs.img  -a  -f /boot/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery chm.graphics=basic
    module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "ERROR: Recovery payload is missing."
    sleep 8
  fi
}

menuentry "Return to Jasper Boot Manager" --id recovery-return {
  configfile /boot/jasper/jasper.cfg
}
