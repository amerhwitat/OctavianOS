# OctavianOS boot menu. Primary paths are self-contained and expose
# Live desktop selection, installer, recovery, diagnostics and optional targets.
# Progress displayed by GRUB is menu/handoff status; live percentages must be emitted by completed runtime events.
# Progress shows verified menu/handoff steps; kernel/userspace must report real runtime events.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod png
if [ -f /boot/jasper/artwork/jasper-gates-boot.png ]; then background_image --mode stretch /boot/jasper/artwork/jasper-gates-boot.png; elif [ -f /boot/grub/octavian-octopus-background.png ]; then background_image --mode stretch /boot/grub/octavian-octopus-background.png; fi
insmod jpeg
insmod png
insmod font
insmod normal
insmod gfxmenu
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
# Preserve the selected mode only if Koronos validates the incoming framebuffer; serial/debugcon remains the fallback.
if [ -f /boot/jasper/graphics.cfg ]; then source /boot/jasper/graphics.cfg; fi
set terminal_output=gfxterm
terminal_output gfxterm
# GRUB reports menu/handoff progress; runtime percentages require emitted events.
function boot_log { echo "[BOOT] $1"; }
function boot_progress_0 { echo "[--------------------]  0% $1"; }
function boot_progress_25 { echo "[#####---------------] 25% $1"; }
function boot_progress_50 { echo "[##########----------] 50% $1"; }
function boot_progress_75 { echo "[###############-----] 75% $1"; }
function boot_progress_100 { echo "[####################] 100% $1"; }
boot_progress_0 "Boot menu initialized; checking target payloads"
set timeout=8
set default=0
set boot_progress_width=20
function chimera_progress {
  echo "[--------------------]  0%  $1"
}
function chimera_progress_25 {
  echo "[#####---------------] 25%  $1"
}
function chimera_progress_50 {
  echo "[##########----------] 50%  $1"
}
function chimera_progress_75 {
  echo "[###############-----] 75%  $1"
}
function chimera_progress_100 {
  echo "[####################] 100% $1"
}

echo "OctavianOS GRUB boot menu — target checks are performed before handoff"
if [ -f /boot/grub/aurora-theme.txt ]; then
  set theme=/boot/grub/aurora-theme.txt
  export theme
elif [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.png
elif [ -f /boot/visual/aurora-menu.png ]; then
  background_image --mode stretch /boot/visual/aurora-menu.png
elif [ -f /boot/visual/aurora-boot.png ]; then
  background_image --mode stretch /boot/visual/aurora-boot.png
elif [ -f /boot/grub/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.jpg
fi
if [ -f /boot/grub/boot-artwork-manifest.json ]; then echo "GRUB artwork manifest found"; fi
if [ -f /boot/grub/Init.mp4 ]; then echo "Boot intro media found (GRUB does not play MP4 itself)"; fi
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "OctavianOS — Live CD: Aurora Wayland Glass Desktop" --id aurora-live {
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/live-manifest.json -a -f /boot/live/desktop-sessions.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events chm.mode=live chm.desktop=aurora
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    module2 /boot/live/desktop-sessions.json octavian-desktop-sessions
    boot
  else
    echo "ERROR: Live kernel, initramfs, or manifest missing; rebuild the ISO."
    sleep 8
  fi
}

menuentry "OctavianOS — Live CD: Marine Desktop" --id marine-live {
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/live-manifest.json -a -f /boot/live/desktop-sessions.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events chm.mode=live chm.desktop=marine
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    module2 /boot/live/desktop-sessions.json octavian-desktop-sessions
    boot
  else
    echo "ERROR: Live kernel, initramfs, or manifest missing; rebuild the ISO."
    sleep 8
  fi
}

menuentry "OctavianOS — Jasper Boot Manager / Select Target" --id normal {
  boot_log "Loading target config: /boot/jasper/jasper.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/jasper.cfg
}

menuentry "OctavianOS — Install / Installer Environment [contract-checked]" --id install {
  echo "[####----------------]  0%  Installer environment"
  echo "[#####---------------] 25%  Checking installer media contracts"
  if [ -f /install/installer/installation.img -a -f /install/installer/installation-manifest.json -a -f /install/installer/installer-contract.json -a -f /install/installer/installation_phases.json -a -f /install/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf
    module2 /install/installer/installation.img chimera-installation-image
    module2 /install/installer/installation-manifest.json chimera-installation-manifest
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /install/installer/installation_phases.json chimera-install-phases
    module2 /install/installer/installer_profiles.json chimera-installer-profiles
    module2 /boot/visual/aurora-installer.png aurora-background
    boot
  else
    echo "ERROR: Installer contracts are incomplete; refusing to boot Live payload under the Install label."
    sleep 8
  fi
}

menuentry "OctavianOS — Live CD Hardware / Driver Progress" --id live-progress {
  echo "Requested verbose hardware discovery; this message is not measured device progress."
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/live-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events chm.mode=live chm.hardware_probe=verbose
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    boot
  else
    echo "ERROR: Live payload is incomplete."
    sleep 8
  fi
}

menuentry "OctavianOS — Enterprise Service Environment [progress]" --id services {
  echo "[####----------------]  0%  Starting service environment"
  if [ -f /boot/koronos/koronos.elf  -a  -f /boot/live/chimera-live-initramfs.img  -a  -f /boot/live/live-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events chm.mode=services
    module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
    module2 /boot/live/live-manifest.json chimera-live-manifest
    boot
  else
    echo "ERROR: Service environment requires the Live payload."
    sleep 8
  fi
}

menuentry "OctavianOS — Repair Terminal / Recovery" --id recovery {
  boot_log "Loading target config: /boot/jasper/recovery.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/recovery.cfg
}

menuentry "OctavianOS — Safe Mode / Basic Graphics" --id safe-mode {
  boot_log "Loading target config: /boot/jasper/safe.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/safe.cfg
}

menuentry "OctavianOS — Last Known Good (requires rollback snapshot)" --id last-known-good {
  if [ -f /boot/rollback/rollback-initramfs.img  -a  -f /boot/rollback/rollback-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events chm.mode=rollback
    module2 /boot/rollback/rollback-initramfs.img octavian-rollback-initramfs
    module2 /boot/rollback/rollback-manifest.json octavian-rollback-manifest
    boot
  else
    echo "No rollback snapshot is staged in this ISO; no fallback is being misrepresented as last-known-good."
    sleep 8
  fi
}

menuentry "OctavianOS — Diagnostics" --id diagnostics {
  boot_log "Loading target config: /boot/jasper/diagnostics.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/diagnostics.cfg
}

menuentry "OctavianOS — Retro / Emulator Center (optional payload)" --id retro {
  boot_log "Loading target config: /boot/jasper/retro.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/retro.cfg
}

menuentry "OctavianOS — Mobile / ARM64 Research Runtime (not available in x86_64 ISO)" --id mobile {
  echo "This ISO contains the x86_64 Koronos kernel only."
  echo "ARM64/mobile requires an ARM64 kernel, matching boot chain, and device-specific verification."
  echo "No x86_64 kernel will be misrepresented as an ARM64 runtime."
  sleep 8
}

menuentry "OctavianOS — Spit Fire Native Menu" --id spitfire {
  boot_log "Loading target config: /boot/spitfire/spitfire-menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/spitfire/spitfire-menu.cfg
}

if [ "$grub_platform" = efi ]; then
  menuentry "OctavianOS — Jasper Boot Manager / All Modes" --id jasper {
  boot_log "Loading target config: /boot/jasper/jasper.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/jasper.cfg
}

menuentry "OctavianOS — Installation Menu" --id installation-menu {
  boot_log "Loading target config: /boot/installation/menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/installation/menu.cfg
}

menuentry "OctavianOS — Recovery Menu" --id recovery-menu {
  boot_log "Loading target config: /boot/jasper/recovery.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/recovery.cfg
}

menuentry "OctavianOS — Diagnostics Menu" --id diagnostics-menu {
  boot_log "Loading target config: /boot/jasper/diagnostics.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/diagnostics.cfg
}

menuentry "OctavianOS — Retro / Emulator Center" --id retro-menu {
  boot_log "Loading target config: /boot/jasper/retro.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/jasper/retro.cfg
}

menuentry "OctavianOS — Spit Fire Native Menu" --id spitfire-menu {
  boot_log "Loading target config: /boot/spitfire/spitfire-menu.cfg"
  boot_progress_25 "Target menu handoff"
  configfile /boot/spitfire/spitfire-menu.cfg
}

menuentry "OctavianOS — UEFI Firmware Setup" --id firmware { fwsetup; }
else
  menuentry "OctavianOS — Firmware Setup (BIOS/VMware)" --id firmware-bios {
    echo "Firmware Setup is not available through GRUB in legacy BIOS mode."
    echo "Configure UEFI on the machine/VM to access firmware setup."
    read
  }
fi

menuentry "OctavianOS — GRUB Command Line" { commandline; }
menuentry "OctavianOS — Reboot" { reboot; }
menuentry "OctavianOS — Power Off" { halt; }
