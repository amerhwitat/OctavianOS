# OctavianOS boot menu. Primary paths are self-contained and expose
# normal, Live CD, installation, recovery, diagnostics and mobile targets.
insmod all_video
insmod video
insmod video_bochs
insmod video_cirrus
insmod gfxterm
insmod jpeg
insmod png
insmod font
insmod normal
insmod gfxmenu
insmod search
insmod search_fs_file
insmod multiboot2
insmod chain
insmod reboot
insmod halt
insmod echo
if [ "$grub_platform" = efi ]; then insmod efi_gop; insmod efifwsetup; fi
set gfxmode=auto,1920x1080,1600x900,1280x720,1024x768,800x600,640x480
set gfxpayload=keep
set terminal_output=gfxterm
terminal_output gfxterm
set timeout=8
set default=0
set boot_progress_width=20
function chimera_progress {
  echo "[--------------------]  0%  $1"
}
function chimera_progress_25 {
  echo "[#####---------------] 25%  $1"
}
function chimera_progress_50 {
  echo "[##########----------] 50%  $1"
}
function chimera_progress_75 {
  echo "[###############-----] 75%  $1"
}
function chimera_progress_100 {
  echo "[####################] 100% $1"
}

echo "[--------------------]  0%  GRUB / Aurora boot menu"
if [ -f /boot/grub/aurora-theme.txt ]; then
  set theme=/boot/grub/aurora-theme.txt
  export theme
elif [ -f /boot/grub/aurora-wayland-glass.png ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.png
elif [ -f /boot/visual/aurora-menu.png ]; then
  background_image --mode stretch /boot/visual/aurora-menu.png
elif [ -f /boot/visual/aurora-boot.png ]; then
  background_image --mode stretch /boot/visual/aurora-boot.png
elif [ -f /boot/grub/aurora-wayland-glass.jpg ]; then
  background_image --mode stretch /boot/grub/aurora-wayland-glass.jpg
fi
if [ -f /boot/grub/boot-artwork-manifest.json ]; then echo "[#####---------------] 25%  GRUB artwork contract ready"; fi
if [ -f /boot/grub/Init.mp4 ]; then echo "[######--------------] 30%  GRUB intro media ready"; fi
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "OctavianOS — Live Aurora / Koronos [100% path ready]" --id aurora-live {
  chimera_progress "Aurora Live CD"
  chimera_progress_25 "Hardware discovery"
  chimera_progress_50 "Koronos kernel"
  chimera_progress_75 "Aurora services"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "OctavianOS — Normal Boot [system progress]" --id normal {
  chimera_progress "Starting Koronos"
  chimera_progress_25 "Memory / interrupts"
  chimera_progress_50 "Drivers / storage"
  chimera_progress_75 "Services / Aurora"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "OctavianOS — Install / Installer Environment [progress UI]" --id install {
  echo "[####----------------]  0%  Installer environment"
  echo "[#####---------------] 25%  Checking installer media contracts"
  if [ -f /install/installer/installation.img ] && [ -f /install/installer/installation-manifest.json ] && [ -f /install/installer/installer-contract.json ] && [ -f /install/installer/installation_phases.json ] && [ -f /install/installer/installer_profiles.json ]; then
    configfile /boot/jasper/install.cfg
  else
    echo "ERROR: Installer payload or manifest is missing; refusing to boot the Live image as an installer."
    echo "Use Live Aurora or rebuild the ISO with native installer media enabled."
    sleep 8
  fi
}

menuentry "OctavianOS — Live CD Hardware / Driver Progress" --id live-progress {
  echo "[####----------------]  0%  Hardware probe"
  echo "[#####---------------░░] 25%  PCI / USB / storage"
  echo "[##########----------] 50%  GPU / display / audio"
  echo "[###############-----] 75%  Network / power / input"
  chimera_progress_100 "Live handoff"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "OctavianOS — Enterprise Service Environment [progress]" --id services {
  echo "[####----------------]  0%  Starting service environment"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "OctavianOS — Repair Terminal / Recovery [progress]" --id recovery {
  echo "[####----------------]  0%  Recovery environment"
  echo "[##########----------] 50%  Recovery initramfs"
  chimera_progress_100 "Recovery terminal ready"
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}

menuentry "OctavianOS — Safe Mode [minimal progress]" --id safe-mode {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "OctavianOS — Last Known Good [rollback path]" --id last-known-good {
  multiboot2 /boot/koronos/koronos.elf
  module2 /boot/live/chimera-live-initramfs.img chimera-live-initramfs
  module2 /boot/live/live-manifest.json chimera-live-manifest
  boot
}

menuentry "OctavianOS — Diagnostics [recovery-backed]" --id diagnostics {
  echo "Diagnostics currently uses the dedicated Koronos recovery console and manifest."
  multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics
  module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
  module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
  boot
}

menuentry "OctavianOS — Retro Computer Center" --id retro {
  configfile /boot/jasper/retro.cfg
}

menuentry "OctavianOS — Mobile / ARM64 Research Runtime (not available in x86_64 ISO)" --id mobile {
  echo "This ISO contains the x86_64 Koronos kernel only."
  echo "ARM64/mobile requires an ARM64 kernel, matching boot chain, and device-specific verification."
  echo "No x86_64 kernel will be misrepresented as an ARM64 runtime."
  sleep 8
}

menuentry "OctavianOS — Spit Fire Native Menu" --id spitfire {
  configfile /boot/spitfire/spitfire-menu.cfg
}

if [ "$grub_platform" = efi ]; then
  menuentry "OctavianOS — Jasper Boot Manager / All Modes" --id jasper {
  configfile /boot/jasper/jasper.cfg
}

menuentry "OctavianOS — Installation Menu" --id installation-menu {
  configfile /boot/installation/menu.cfg
}

menuentry "OctavianOS — Recovery Menu" --id recovery-menu {
  configfile /boot/jasper/recovery.cfg
}

menuentry "OctavianOS — Diagnostics Menu" --id diagnostics-menu {
  configfile /boot/jasper/diagnostics.cfg
}

menuentry "OctavianOS — Retro / Emulator Center" --id retro-menu {
  configfile /boot/jasper/retro.cfg
}

menuentry "OctavianOS — Spit Fire Native Menu" --id spitfire-menu {
  configfile /boot/spitfire/spitfire-menu.cfg
}

menuentry "OctavianOS — UEFI Firmware Setup" --id firmware { fwsetup; }
else
  menuentry "OctavianOS — Firmware Setup (BIOS/VMware)" --id firmware-bios {
    echo "Firmware Setup is not available through GRUB in legacy BIOS mode."
    echo "Configure UEFI on the machine/VM to access firmware setup."
    read
  }
fi

menuentry "OctavianOS — GRUB Command Line" { commandline; }
menuentry "OctavianOS — Reboot" { reboot; }
menuentry "OctavianOS — Power Off" { halt; }
