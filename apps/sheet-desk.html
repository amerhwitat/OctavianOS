<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07172b"><title>Sheet Desk</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#061426;color:#effaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#0b526b 0,transparent 42%),#061426}header,.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#071a30;border-bottom:1px solid #89eaf033}a{color:#aaf5f5;text-decoration:none}button,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #8be8ed55;background:#12304d;color:#efffff}button{cursor:pointer}main{padding:14px;max-width:1300px;margin:auto}.panel{background:#0b2038;border:1px solid #89eaf033;border-radius:12px;padding:12px}.gridwrap{overflow:auto;max-height:65vh;margin-top:12px}table{border-collapse:collapse;background:#fff;color:#16263d;min-width:100%;font-size:13px}th,td{border:1px solid #ccd5df;min-width:120px;height:34px;padding:0}th{position:sticky;top:0;background:#dce8f2;z-index:1}td input{width:100%;height:100%;min-width:120px;border:0;border-radius:0;background:#fff;color:#16263d;padding:7px}td input:focus{outline:2px solid #17889a;outline-offset:-2px}.status{color:#a9e9ee;font-size:12px}@media(max-width:600px){main{padding:6px}}
</style></head><body><header><strong>◈ SHEET DESK</strong><span>CSV spreadsheet editor</span><span style="margin-left:auto"><a href="./application-center.html">Application Center</a></span></header><div class="bar"><button id="open">Open CSV</button><input id="file" type="file" accept=".csv,text/csv,text/plain" hidden><button id="addRow">Add row</button><button id="addCol">Add column</button><button id="export">Export CSV</button><button id="sample">Load sample</button><span id="status" class="status" aria-live="polite">Ready · Edits remain local until exported.</span></div><main><section class="panel"><h1>Sheet Desk</h1><p class="status">Editable CSV grid with import/export. Values are text; this prototype does not implement Excel/LibreOffice formulas, charts, macros, or workbook formats.</p><div class="gridwrap"><table id="grid" aria-label="CSV spreadsheet"><tbody></tbody></table></div></section></main><script>
(()=>{const table=document.querySelector('#grid'),body=table.tBodies[0],file=document.querySelector('#file'),status=document.querySelector('#status');let data=[['Name','Quantity','Notes'],['Apples','12','Fruit'],['Coffee','3','Pantry']];const say=s=>status.textContent=s;
function parse(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"'&&cell==='')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}const cols=Math.max(1,...rows.map(r=>r.length));return rows.map(r=>Array.from({length:cols},(_,i)=>r[i]??''))}
function render(){body.replaceChildren();const cols=Math.max(1,...data.map(r=>r.length));data.forEach((row,ri)=>{const tr=document.createElement('tr');for(let ci=0;ci<cols;ci++){const cell=document.createElement(ri===0?'th':'td');if(ri===0){cell.textContent=row[ci]??'';cell.contentEditable='true';cell.setAttribute('role','textbox');cell.setAttribute('aria-label','Column '+(ci+1)+' header');cell.addEventListener('input',()=>{data[ri][ci]=cell.textContent})}else{const input=document.createElement('input');input.value=row[ci]??'';input.setAttribute('aria-label','Row '+(ri+1)+' column '+(ci+1));input.addEventListener('input',()=>{data[ri][ci]=input.value});cell.append(input)}tr.append(cell)}body.append(tr)});say(data.length+' rows · '+cols+' columns')}
document.querySelector('#open').onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;try{data=parse(await f.text());render();say('Loaded '+f.name)}catch{say('Could not read CSV')}file.value=''};
document.querySelector('#addRow').onclick=()=>{data.push(Array(Math.max(1,...data.map(r=>r.length))).fill(''));render()};document.querySelector('#addCol').onclick=()=>{data.forEach(r=>r.push(''));render()};
document.querySelector('#sample').onclick=()=>{data=[['Item','Quantity','Category'],['Apples','12','Fruit'],['Coffee','3','Pantry'],['Notebook','5','Office']];render()};
document.querySelector('#export').onclick=()=>{const csv=data.map(r=>r.map(v=>{const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='sheet.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);say('CSV export prepared')};
render();
})();
</script></body></html>
