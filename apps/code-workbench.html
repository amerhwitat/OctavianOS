<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07172b"><title>Code Workbench</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#061426;color:#effaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#0b526b 0,transparent 42%),#061426}header,.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#071a30;border-bottom:1px solid #89eaf033}a{color:#aaf5f5;text-decoration:none}button,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #8be8ed55;background:#12304d;color:#efffff}button{cursor:pointer}main{max-width:1300px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#0b2038;border:1px solid #89eaf033;border-radius:12px;padding:12px;min-width:0}textarea{width:100%;min-height:65vh;background:#061426;color:#dffbff;border:1px solid #89eaf033;border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,monospace;tab-size:2}iframe{width:100%;height:65vh;background:white;border:0;border-radius:8px}.muted{font-size:12px;color:#a9c4d9}#status{color:#a9e9ee}@media(max-width:760px){.layout{grid-template-columns:1fr}textarea,iframe{min-height:42vh;height:42vh}main{padding:6px}}
</style></head><body><header><strong>◈ CODE WORKBENCH</strong><span>HTML · CSS · JavaScript</span><span style="margin-left:auto"><a href="./application-center.html">Application Center</a></span></header><div class="bar"><label>Starter <select id="starter"><option value="hello">Hello page</option><option value="canvas">Canvas sketch</option><option value="blank">Blank</option></select></label><button id="run">Run preview</button><button id="save">Download HTML</button><span id="status" class="muted" role="status" aria-live="polite">Preview is isolated in a sandboxed iframe.</span></div><main><p class="muted">A small local HTML/CSS/JS workbench. Preview runs in a sandboxed iframe without same-origin access or top navigation. It is not a native compiler, debugger or SDK.</p><div class="layout"><section class="panel"><h2>Source</h2><textarea id="source" spellcheck="false" aria-label="HTML source"></textarea></section><section class="panel"><h2>Preview</h2><iframe id="preview" sandbox="allow-scripts" title="Isolated code preview"></iframe></section></div></main><script>
(()=>{const source=document.querySelector('#source'),preview=document.querySelector('#preview'),status=document.querySelector('#status');const samples={hello:'<!doctype html>\n<html><head><meta charset="utf-8"><style>body{font:16px system-ui;padding:2rem;color:#16324f}button{padding:.6rem 1rem}</style></head><body><h1>Hello, Workbench!</h1><p>Edit this source and run it.</p><button onclick="document.querySelector(\'p\').textContent=\'JavaScript is running in the sandbox.\'">Try JavaScript</button></body></html>',canvas:'<!doctype html>\n<html><body style="font:16px system-ui"><h2>Canvas starter</h2><canvas id="c" width="480" height="260" style="max-width:100%;border:1px solid #aaa"></canvas><script>const c=document.querySelector("#c"),x=c.getContext("2d");x.fillStyle="#117e8b";x.fillRect(30,30,180,100);x.fillStyle="#222";x.font="20px sans-serif";x.fillText("Canvas works",35,170);<\/script></body></html>',blank:'<!doctype html>\n<html><head><meta charset="utf-8"></head><body></body></html>'};function run(){preview.srcdoc=source.value;say('Preview updated. Scripts run only inside the sandboxed iframe.')}function say(s){status.textContent=s}document.querySelector('#starter').onchange=e=>{source.value=samples[e.target.value];run()};document.querySelector('#run').onclick=run;document.querySelector('#save').onclick=()=>{const u=URL.createObjectURL(new Blob([source.value],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='workbench.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);say('HTML download prepared')};source.value=samples.hello;run()})();
</script></body></html>
