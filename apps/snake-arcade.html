<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07172b"><title>Snake Arcade — OctavianOS</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#061426;color:#eefaff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0,#0b526b 0,transparent 42%),#061426}header{padding:14px 18px;background:#071a30eF;border-bottom:1px solid #89eaf044;display:flex;gap:16px}a{color:#aaf5f5;text-decoration:none}main{max-width:760px;margin:auto;padding:20px}.panel{background:#0b2038;border:1px solid #89eaf033;border-radius:14px;padding:16px;text-align:center}canvas{width:min(100%,500px);height:auto;display:block;margin:12px auto;border:1px solid #89eaf055;border-radius:8px;background:#071426}button{font:inherit;padding:10px 14px;border:1px solid #8be8ed55;border-radius:8px;background:#12304d;color:#efffff;cursor:pointer}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.stat{color:#a9e9ee}@media(max-width:600px){main{padding:8px}.panel{padding:8px}}
</style></head><body><header><strong>◈ SNAKE ARCADE</strong><a href="./application-center.html" style="margin-left:auto">Application Center</a></header><main><section class="panel"><h1>Snake Arcade</h1><p>Collect food, grow longer and avoid collisions. Use arrow keys or WASD; on touch screens use the directional buttons.</p><p class="stat">Score: <strong id="score">0</strong> · <span id="status">Ready</span></p><canvas id="game" width="500" height="500" aria-label="Snake game board"></canvas><div class="controls"><button id="start">Start / Restart</button><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></section></main><script>
(()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),status=document.querySelector('#status');const cell=25,cells=20;let snake=[],dir={x:1,y:0},food={x:10,y:10},score=0,timer,alive=false;function rand(){return Math.floor(Math.random()*cells)}function foodAt(){let p;do{p={x:rand(),y:rand()}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}function start(){clearInterval(timer);snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};score=0;scoreEl.textContent=score;food=foodAt();alive=true;status.textContent='Playing';draw();timer=setInterval(tick,120)}function turn(d){if(d.x===-dir.x&&d.y===-dir.y)return;dir=d}function tick(){if(!alive)return;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some((s,i)=>i>0&&s.x===head.x&&s.y===head.y)){alive=false;clearInterval(timer);status.textContent='Game over · restart to play again';return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;food=foodAt()}else snake.pop();draw()}function draw(){x.fillStyle='#071426';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#ffffff0c';for(let i=0;i<=cells;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,c.height);x.stroke();x.beginPath();x.moveTo(0,i*cell);x.lineTo(c.width,i*cell);x.stroke()}x.fillStyle='#ffcb69';x.beginPath();x.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.36,0,Math.PI*2);x.fill();snake.forEach((s,i)=>{x.fillStyle=i?'#45aeb9':'#a3fff2';x.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4)})}document.querySelector('#start').onclick=start;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const d=b.dataset.dir;turn(d==='up'?{x:0,y:-1}:d==='down'?{x:0,y:1}:d==='left'?{x:-1,y:0}:{x:1,y:0})});window.addEventListener('keydown',e=>{const map={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};if(map[e.key]){e.preventDefault();turn(map[e.key])}});draw()})();
</script></body></html>
