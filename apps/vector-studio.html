<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07172b"><title>Vector Studio</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#061426;color:#effaff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#0b526b 0,transparent 42%),#061426}header,.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#071a30;border-bottom:1px solid #89eaf033}a{color:#aaf5f5;text-decoration:none}button,input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #8be8ed55;background:#12304d;color:#efffff}button{cursor:pointer}main{max-width:1200px;margin:auto;padding:14px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:12px}.panel{background:#0b2038;border:1px solid #89eaf033;border-radius:12px;padding:12px;min-width:0}#stage{background:#fff;border-radius:8px;min-height:460px;overflow:auto}svg{width:100%;height:460px;display:block;touch-action:none}.status{font-size:12px;color:#a9c4d9}textarea{width:100%;min-height:350px;background:#061426;color:#dffbff;border:1px solid #89eaf033;border-radius:8px;padding:10px;font:12px ui-monospace,monospace}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:8px}}
</style></head><body><header><strong>◈ VECTOR STUDIO</strong><span>SVG drawing and export</span><span style="margin-left:auto"><a href="./application-center.html">Application Center</a></span></header><div class="bar" role="toolbar"><label>Tool <select id="tool"><option value="select">Select</option><option value="rect">Rectangle</option><option value="ellipse">Ellipse</option><option value="line">Line</option><option value="pen">Freehand</option><option value="text">Text</option></select></label><label>Color <input id="color" type="color" value="#13a6b5"></label><label>Stroke <input id="stroke" type="range" min="1" max="20" value="3"></label><button id="undo">Undo</button><button id="clear">Clear</button><button id="exportSvg">Export SVG</button><button id="exportPng">Export PNG</button></div><main><div class="layout"><section class="panel"><div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Vector canvas"><rect width="900" height="600" fill="white"/></svg></div><p class="status" id="status" aria-live="polite">Select a tool and draw. Click an object in Select mode to remove it.</p></section><section class="panel"><h2>SVG source</h2><p class="status">The source reflects the current vector artwork. Edit it and apply to import custom SVG markup (scripts and external references are removed).</p><textarea id="source" spellcheck="false"></textarea><div class="controls"><button id="apply">Apply SVG source</button></div></section></div></main><script>
(()=>{const svg=document.querySelector('#svg'),source=document.querySelector('#source'),status=document.querySelector('#status'),tool=document.querySelector('#tool'),color=document.querySelector('#color'),stroke=document.querySelector('#stroke');let drawing=null,history=[];
const ns='http://www.w3.org/2000/svg';function say(s){status.textContent=s}function snap(){history.push(svg.innerHTML);if(history.length>40)history.shift();sync()}function sync(){source.value=svg.outerHTML}function pt(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*600/r.height}}function el(tag,attrs){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
svg.addEventListener('pointerdown',e=>{if(e.target!==svg&&tool.value==='select'){snap();e.target.remove();sync();say('Removed selected object');return}if(tool.value==='select')return;if(tool.value==='text'){const p=pt(e),t=prompt('Text to add:');if(t){snap();const n=el('text',{x:p.x,y:p.y,fill:color.value,'font-size':24});n.textContent=t;svg.append(n);sync()}return}snap();drawing={p:pt(e),node:null};const p=drawing.p,attrs={fill:'none',stroke:color.value,'stroke-width':stroke.value,'stroke-linecap':'round','stroke-linejoin':'round'};if(tool.value==='rect')drawing.node=el('rect',{...attrs,x:p.x,y:p.y,width:0,height:0});if(tool.value==='ellipse')drawing.node=el('ellipse',{...attrs,cx:p.x,cy:p.y,rx:0,ry:0});if(tool.value==='line')drawing.node=el('line',{...attrs,x1:p.x,y1:p.y,x2:p.x,y2:p.y});if(tool.value==='pen'){drawing.node=el('path',{...attrs,d:'M '+p.x+' '+p.y});}if(drawing.node){svg.append(drawing.node);svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e),s=drawing.p,n=drawing.node;if(tool.value==='rect'){n.setAttribute('x',Math.min(s.x,p.x));n.setAttribute('y',Math.min(s.y,p.y));n.setAttribute('width',Math.abs(p.x-s.x));n.setAttribute('height',Math.abs(p.y-s.y))}if(tool.value==='ellipse'){n.setAttribute('cx',(s.x+p.x)/2);n.setAttribute('cy',(s.y+p.y)/2);n.setAttribute('rx',Math.abs(p.x-s.x)/2);n.setAttribute('ry',Math.abs(p.y-s.y)/2)}if(tool.value==='line'){n.setAttribute('x2',p.x);n.setAttribute('y2',p.y)}if(tool.value==='pen')n.setAttribute('d',n.getAttribute('d')+' L '+p.x+' '+p.y)});
function finish(){if(drawing){drawing=null;sync()}}svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish);
document.querySelector('#undo').onclick=()=>{if(history.length){svg.innerHTML=history.pop();sync();say('Undo complete')}else say('Nothing to undo')};document.querySelector('#clear').onclick=()=>{snap();svg.innerHTML='<rect width="900" height="600" fill="white"/>';sync();say('Canvas cleared')};
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.querySelector('#exportSvg').onclick=()=>download(new Blob([svg.outerHTML],{type:'image/svg+xml'}),'vector-art.svg');
document.querySelector('#exportPng').onclick=()=>{const xml=new XMLSerializer().serializeToString(svg),url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=1800;c.height=1200;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b&&download(b,'vector-art.png'),'image/png');URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);say('Could not rasterize SVG')};img.src=url};
document.querySelector('#apply').onclick=()=>{try{const parsed=new DOMParser().parseFromString(source.value,'image/svg+xml');if(parsed.querySelector('parsererror'))throw Error('Invalid SVG');const clean=parsed.documentElement;if(clean.localName!=='svg')throw Error('Root must be SVG');clean.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(n=>n.remove());clean.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||((a.name==='href'||a.name.endsWith(':href'))&&!a.value.startsWith('#')&&!a.value.startsWith('data:image/')))n.removeAttribute(a.name)}));svg.innerHTML=clean.innerHTML;svg.setAttribute('viewBox',clean.getAttribute('viewBox')||'0 0 900 600');sync();say('Applied sanitized SVG source')}catch(e){say('SVG not applied: '+e.message)}};sync();
})();
</script></body></html>
