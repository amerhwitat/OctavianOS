# Spit Fire first-stage menu for the Linux Live ISO.
# GRUB2 is the executable ISO loader; this menu hands off to Jasper/GRUB2 targets.
insmod gfxterm
insmod all_video
insmod png
insmod jpeg
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; fi
set timeout=8
set default=0
menuentry "Spit Fire — Continue to Gates boot policy" --id spitfire-to-gates {
  echo "[SPIT FIRE] Firmware handoff complete; entering Gates policy menu"
  configfile /boot/gates/gates-menu.cfg
}
menuentry "Spit Fire — Boot diagnostics" --id spitfire-diagnostics {
  echo "[SPIT FIRE] platform=${grub_platform} cmdpath=${cmdpath} root=${root}"
  echo "[SPIT FIRE] gfxmode=${gfxmode} gfxpayload=${gfxpayload}"
  ls; ls /boot; ls /live; sleep 15
}
menuentry "Spit Fire — UEFI firmware setup" --id spitfire-firmware {
  if [ "${grub_platform}" = efi ]; then fwsetup; else echo "Firmware setup is not exposed by legacy BIOS."; sleep 5; fi
}
menuentry "GRUB 2 command line" --id spitfire-shell { commandline; }
menuentry "Reboot" { reboot; }
menuentry "Power off" { halt; }
