# Jasper / GRUB2 unified target menu for the Linux-kernel Live ISO.
# Native Koronos targets remain fail-closed until all runtime artifacts exist.
insmod all_video
insmod video
if [ "${grub_platform}" = pc ]; then insmod video_bochs; insmod video_cirrus; fi
if [ "${grub_platform}" = efi ]; then insmod efi_gop; fi
insmod gfxterm
insmod font
insmod normal
insmod multiboot2
insmod reboot
insmod halt
set gfxmode=5120x2880,3840x2160,2560x1440,1920x1200,1920x1080,1680x1050,1600x1200,1600x900,1440x900,1366x768,1280x1024,1280x720,1024x768,800x600,640x480,auto
set gfxpayload=keep
set debug=all
terminal_output gfxterm
if [ -f /boot/grub/background.jpg ]; then background_image --mode stretch /boot/grub/background.jpg; fi
set timeout=8
set default=0
echo "[JASPER] unified target router; verbose boot enabled"
menuentry "Live — Aurora Desktop (Linux Live)" --id live-linux {
  echo "[LIVE] Linux kernel -> initramfs -> Aurora startup splash -> desktop"
  linux /live/vmlinuz boot=live components hostname=live username=live console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 rd.debug
  initrd /live/initrd.img
}
menuentry "Live — Safe Graphics" --id live-safe {
  set gfxmode=1024x768,800x600,640x480,auto
  set gfxpayload=keep
  linux /live/vmlinuz boot=live components hostname=live username=live nomodeset console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1
  initrd /live/initrd.img
}
menuentry "Recovery — Linux Rescue Shell (separate Linux runtime)" --id linux-rescue {
  linux /live/vmlinuz boot=live components hostname=recovery username=live chimera.mode=recovery systemd.unit=multi-user.target console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1 initcall_debug udev.log_level=debug systemd.journald.forward_to_console=1 systemd.log_level=debug systemd.log_target=console systemd.show_status=1 rd.debug
  initrd /live/initrd.img
}
menuentry "Installer — Native Koronos Installer (requires complete runtime)" --id native-installer {
  if [ -f /boot/koronos/koronos.elf -a -f /boot/installer/installer-initrd.img -a -f /install/installer/installation.img -a -f /install/installer/installation-manifest.json -a -f /install/installer/installer-contract.json -a -f /install/installer/installation_phases.json -a -f /install/installer/installer_profiles.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=installer chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    module2 /boot/installer/installer-initrd.img chimera-installer-initrd
    module2 /install/installer/installation.img chimera-installation-image
    module2 /install/installer/installation-manifest.json chimera-installation-manifest
    module2 /install/installer/installer-contract.json chimera-installer-contract
    module2 /install/installer/installation_phases.json chimera-install-phases
    module2 /install/installer/installer_profiles.json chimera-installer-profiles
    boot
  else
    echo "[BLOCKED] Native Koronos Installer runtime is incomplete. No Linux fallback will be called an installer."
    sleep 12
  fi
}
menuentry "Recovery — Native Koronos Recovery (requires complete runtime)" --id native-recovery {
  if [ -f /boot/koronos/koronos.elf -a -f /boot/recovery/chimera-recovery-initramfs.img -a -f /boot/recovery/recovery-manifest.json ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=recovery chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
    module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
    boot
  else
    echo "[BLOCKED] Native Koronos Recovery runtime is incomplete. Use the separate Linux Rescue Shell."
    sleep 12
  fi
}
menuentry "Koronos — Native diagnostics (experimental)" --id koronos-diagnostics {
  if [ -f /boot/koronos/koronos.elf ]; then
    multiboot2 /boot/koronos/koronos.elf chm.mode=diagnostics chm.log=verbose chm.progress=events loglevel=7 ignore_loglevel printk.time=1
    boot
  else
    echo "[BLOCKED] Koronos ELF is not staged in this Live ISO."; sleep 10
  fi
}
menuentry "Classic X / Openbox session" --id classic {
  linux /live/vmlinuz boot=live components hostname=live username=live session=classic console=tty0 console=ttyS0,115200n8 loglevel=7 ignore_loglevel printk.time=1
  initrd /live/initrd.img
}
menuentry "Jasper / Spit Fire boot diagnostics" --id diagnostics {
  echo "platform=${grub_platform} cmdpath=${cmdpath} root=${root} gfxmode=${gfxmode}"
  ls; ls /boot; ls /live; sleep 15
}
menuentry "Return to Spit Fire menu" --id return-spitfire { configfile /boot/spitfire/spitfire-menu.cfg }
menuentry "UEFI firmware setup" --id firmware { if [ "${grub_platform}" = efi ]; then fwsetup; else echo "UEFI firmware setup is unavailable in BIOS mode."; sleep 5; fi }
menuentry "GRUB 2 command line" { commandline; }
menuentry "Reboot" { reboot; }
menuentry "Power off" { halt; }
