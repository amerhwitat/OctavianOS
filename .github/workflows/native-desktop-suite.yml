name: Octavian Native Desktop Suite Build

on:
  push:
    paths:
      - 'desktop/**'
      - 'userspace/bin/octavian-map-windows-drives'
      - 'userspace/tests/test_wsl_drive_aliases.sh'
      - 'userspace/systemd/octavian-wsl-drive-aliases.service'
      - 'userspace/Makefile'
      - 'desktop/native/**'
      - 'boot/live/desktop-sessions.json'
      - 'vendor/chimera-ii-os/source/desktop/**'
      - 'vendor/chimera-ii-os/source/tools/build-desktop-binaries.sh'
      - 'vendor/chimera-ii-os/source/tools/build-desktop-icon-files.py'
      - 'vendor/chimera-ii-os/source/userspace/hive/**'
      - '.github/workflows/native-desktop-suite.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'userspace/bin/octavian-map-windows-drives'
      - 'userspace/tests/test_wsl_drive_aliases.sh'
      - 'userspace/systemd/octavian-wsl-drive-aliases.service'
      - 'userspace/Makefile'
      - 'desktop/native/**'
      - 'boot/live/desktop-sessions.json'
      - 'vendor/chimera-ii-os/source/desktop/**'
      - 'vendor/chimera-ii-os/source/tools/build-desktop-binaries.sh'
      - 'vendor/chimera-ii-os/source/tools/build-desktop-icon-files.py'
      - 'vendor/chimera-ii-os/source/userspace/hive/**'
      - '.github/workflows/native-desktop-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-native-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test WSL Windows-drive aliases without touching host mounts
        run: bash userspace/tests/test_wsl_drive_aliases.sh
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake python3 libgtk-4-dev librsvg2-common xvfb libgl1-mesa-dev libglfw3-dev libopencv-dev mesa-utils pkg-config libgl1-mesa-dev libglfw3-dev libopencv-dev mesa-utils pkg-config vice fs-uae python3-venv gcc-aarch64-linux-gnu qemu-user
      - name: Build and verify Amiga ADF and Commodore D64 starter disks
        run: |
          python3 -m venv /tmp/octavian-retro-media-venv
          . /tmp/octavian-retro-media-venv/bin/activate
          python -m pip install --disable-pip-version-check amitools
          command -v c1541
          command -v x64sc
          x64sc --version || true
          command -v fs-uae
          fs-uae --version
          bash -n tools/retro-media/install-emulators.sh
          python3 -m json.tool tools/retro-media/emulator-packages.json >/dev/null
          python tools/retro-media/build_retro_media.py --output /tmp/octavian-retro-media
          CHIMERA_RETRO_MEDIA_DIR=/tmp/octavian-retro-media python -m unittest discover -s tests/retro_media -v
      - name: Upload Amiga and Commodore disk images
        uses: actions/upload-artifact@v4
        with:
          name: octavian-amiga-commodore-disk-images
          path: /tmp/octavian-retro-media/
          if-no-files-found: error
          retention-days: 30
      - name: Validate Aurora and Marine session-selection contract
        run: |
          set -euo pipefail
          python3 -m json.tool boot/live/desktop-sessions.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("boot/live/desktop-sessions.json").read_text())
          assert data["default"] == "aurora"
          sessions = {item["id"]: item for item in data["sessions"]}
          assert sessions["aurora"]["name"] == "Aurora Wayland Glass Desktop"
          assert sessions["marine"]["name"] == "Marine Desktop"
          # Keep the UI honest until a real kernel userspace session launcher exists.
          assert sessions["aurora"]["status"] == "prototype"
          assert sessions["marine"]["status"] == "prototype"
          for path in (
              "desktop/aurora-wayland-glass/index.html",
              "desktop/marine/index.html",
              "desktop/aurora/assets/octavian-octopus-aurora.svg",
              "desktop/aurora/assets/octavian-artwork-manifest.json",
          ):
              assert Path(path).is_file(), f"missing desktop source: {path}"
          print("Desktop contracts valid; native session launch is not claimed.")
          PY
      - name: Build and runtime-test imported OpenGL and OpenCV tools
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 desktop/native/chm-opengl-smoke.cpp -o /tmp/octavian-opengl-smoke $(pkg-config --cflags --libs glfw3 gl)
          c++ -std=c++17 -O2 desktop/native/chm-image-inspect.cpp -o /tmp/octavian-image-inspect $(pkg-config --cflags --libs opencv4)
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/octavian-opengl-smoke --self-test
          /tmp/octavian-image-inspect --self-test
          /tmp/octavian-image-inspect --help
          python3 - <<'PY'
          from pathlib import Path
          Path("/tmp/octavian-test.ppm").write_bytes(b"P6\n2 2\n255\n" + bytes([255,0,0, 0,255,0, 0,0,255, 255,255,255]))
          PY
          /tmp/octavian-image-inspect /tmp/octavian-test.ppm --edges /tmp/octavian-edges.png --grayscale /tmp/octavian-gray.png --resize 4x4 /tmp/octavian-resized.png --json
          test -s /tmp/octavian-edges.png
          test -s /tmp/octavian-gray.png
          test -s /tmp/octavian-resized.png
          test -s man/chm-opengl-smoke.1
          test -s man/chm-image-inspect.1

      - name: Compile shared native Aurora components from imported Chimera source
        working-directory: vendor/chimera-ii-os/source
        env:
          CHIMERA_DESKTOP_BUILD_DIR: ${{ runner.temp }}/octavian-desktop
        run: |
          set -euo pipefail
          bash tools/build-desktop-binaries.sh
          out="$CHIMERA_DESKTOP_BUILD_DIR"
          test -s "$out/bin/chm-utf8"
          test -x "$out/bin/chm-utf8"
          test -s "$out/bin/aurora-utf-selftest"
          test -x "$out/bin/aurora-utf-selftest"
          test -s "$out/aurora_input.o"
          test -s "$out/aurora_input_router.o"
          test -s "$out/aurora_locale.o"
          test -s "$out/aurora_utf.o"
          test -s "$out/aurora_emoji.o"
          test -s "$out/chimera_icons.o"
          test -s "$out/icons/icon-index.json"
          test -s "$out/icons/aurora-files.svg"
          test -s "$out/icons/chromium.svg"
          test -s "$out/icons/terminal.svg"
          test -s "$out/icons/settings.svg"
          test -s "$out/icons/vscode.svg"
          "$out/bin/aurora-utf-selftest"
          python3 -m json.tool "$out/manifests/desktop-build-manifest.json" >/dev/null
      - name: Compile imported shell and desktop application targets
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          cmake -S . -B "${{ runner.temp }}/octavian-cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${{ runner.temp }}/octavian-cmake" --target aurora-settings chimera-shell chmctl chm-diagnostics chmhelp chm-utf8 chm-opengl-smoke chm-image-inspect -j2

      - name: Validate VSCodium manager and local emulator bridge
        run: |
          bash -n tools/ides/ide-manager.sh
          bash vendor/chimera-ii-os/source/tools/ides/ide-manager.sh list
          bash tools/ides/ide-manager.sh --help
          node --check vendor/chimera-ii-os/source/web/chimera-hub.js
          python3 -m py_compile tools/retro-media/build_retro_media.py vendor/chimera-ii-os/source/tools/runtime/chimera-local-bridge.py vendor/chimera-ii-os/source/tools/runtime/chimera-terminal-backend.py vendor/chimera-ii-os/source/tools/inspect-binary-headers.py
          python3 vendor/chimera-ii-os/source/tests/runtime/test_terminal_backend.py
          python3 vendor/chimera-ii-os/source/tests/tools/test_inspect_binary_headers.py
          python3 vendor/chimera-ii-os/source/tests/tools/test_run_compatible_binary.py
          bash -n vendor/chimera-ii-os/source/tools/binary/install-compat-runtimes.sh
          bash -n tools/import-verified-desktop-artifacts.sh
          python3 -m json.tool vendor/chimera-ii-os/source/tools/binary/compatibility-runtimes.json >/dev/null
          bash -n vendor/chimera-ii-os/source/tools/toolchains/bootstrap-open-toolchains.sh
          bash vendor/chimera-ii-os/source/tools/toolchains/bootstrap-open-toolchains.sh list >/dev/null
          python3 -m json.tool vendor/chimera-ii-os/source/tools/toolchains/cross-targets.json >/dev/null
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          cat > /tmp/octavian-aarch64-smoke.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("OCTAVIAN AARCH64 QEMU USER PASS"); return 0; }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -o /tmp/octavian-aarch64-smoke /tmp/octavian-aarch64-smoke.c
          python3 vendor/chimera-ii-os/source/tools/run-compatible-binary.py --dry-run /tmp/octavian-aarch64-smoke
          python3 vendor/chimera-ii-os/source/tools/run-compatible-binary.py --run /tmp/octavian-aarch64-smoke
          python3 vendor/chimera-ii-os/source/tools/inspect-binary-headers.py --json /bin/true
          test -s vendor/chimera-ii-os/source/man/chm-ide.1
      - name: Validate X11 provider manifests and launcher syntax
        run: |
          bash -n vendor/chimera-ii-os/source/desktop/x11/start-session.sh
          bash -n vendor/chimera-ii-os/source/tools/commands/install-command-providers.sh
          python3 -m json.tool vendor/chimera-ii-os/source/desktop/x11/xorg-provider.json >/dev/null
      - name: Runtime-test imported OpenGL and OpenCV CMake targets
        working-directory: vendor/chimera-ii-os/source
        env:
          OCTAVIAN_DESKTOP_BUILD_DIR: ${{ runner.temp }}/octavian-desktop
        run: |
          set -euo pipefail
          opengl="${{ runner.temp }}/octavian-cmake/desktop/native/chm-opengl-smoke"
          opencv="${{ runner.temp }}/octavian-cmake/desktop/native/chm-image-inspect"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$opengl" --self-test
          "$opencv" --self-test
          mkdir -p "$OCTAVIAN_DESKTOP_BUILD_DIR/bin"
          install -m 0755 "$opengl" "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/"
          install -m 0755 "$opencv" "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/"
          install -m 0644 man/chm-opengl-smoke.1 man/chm-image-inspect.1 "$OCTAVIAN_DESKTOP_BUILD_DIR/"
          ldd "$opengl" > "$OCTAVIAN_DESKTOP_BUILD_DIR/opengl-runtime-dependencies.txt"
          ldd "$opencv" > "$OCTAVIAN_DESKTOP_BUILD_DIR/opencv-runtime-dependencies.txt"
      - name: Build and headlessly smoke-test native Aurora and Marine GTK shells
        env:
          OCTAVIAN_DESKTOP_BUILD_DIR: ${{ runner.temp }}/octavian-desktop
          CHIMERA_ICON_DIR: ${{ runner.temp }}/octavian-desktop/icons
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: |
          set -euo pipefail
          mkdir -p "$OCTAVIAN_DESKTOP_BUILD_DIR/bin"
          c++ -std=c++20 -O2 -Wall -Wextra \
            $(pkg-config --cflags gtk4) desktop/native/chimera-desktop-shell.cpp \
            $(pkg-config --libs gtk4) -o "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/octavian-desktop-shell"
          xvfb-run -a "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/octavian-desktop-shell" --desktop=aurora --self-test
          xvfb-run -a "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/octavian-desktop-shell" --desktop=marine --self-test
          xvfb-run -a "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/octavian-desktop-shell" --desktop=freexp --self-test
          if "$OCTAVIAN_DESKTOP_BUILD_DIR/bin/octavian-desktop-shell" --desktop=invalid --self-test; then
            echo "invalid desktop profile was accepted" >&2
            exit 1
          fi

      - name: Assemble IDE and binary compatibility helpers
        env:
          OCTAVIAN_DESKTOP_BUILD_DIR: ${{ runner.temp }}/octavian-desktop
        run: |
          set -euo pipefail
          out="$OCTAVIAN_DESKTOP_BUILD_DIR"
          mkdir -p "$out/share/chimera" "$out/share/man/man1"
          install -m 0755 vendor/chimera-ii-os/source/tools/run-compatible-binary.py "$out/share/chimera/"
          install -m 0755 vendor/chimera-ii-os/source/tools/inspect-binary-headers.py "$out/share/chimera/"
          install -m 0755 vendor/chimera-ii-os/source/tools/binary/install-compat-runtimes.sh "$out/bin/"
          install -m 0755 vendor/chimera-ii-os/source/tools/ides/ide-manager.sh "$out/bin/chm-ide-manager"
          install -m 0644 vendor/chimera-ii-os/source/tools/binary/compatibility-runtimes.json "$out/share/chimera/"
          install -m 0644 vendor/chimera-ii-os/source/compat/binary-format-registry.json "$out/share/chimera/"
          install -m 0644 vendor/chimera-ii-os/source/man/chm-ide.1 vendor/chimera-ii-os/source/man/chm-binary-headers.1 vendor/chimera-ii-os/source/man/chm-binary-inspect.1 "$out/share/man/man1/"
          install -m 0755 /tmp/octavian-aarch64-smoke "$out/bin/"
          (cd "$out" && find bin share -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)
      - name: Test verified desktop artifact import and checksum enforcement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          root = Path("/tmp/compat-import-fixture")
          (root / "bin").mkdir(parents=True, exist_ok=True)
          (root / "share").mkdir(parents=True, exist_ok=True)
          (root / "bin" / "fixture-tool").write_text("fixture\\n")
          (root / "share" / "fixture.1").write_text("fixture man page\\n")
          entries = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              entries.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text("\\n".join(entries) + "\\n")
          with zipfile.ZipFile("/tmp/compat-import-fixture.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for path in root.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY
          bash tools/import-verified-desktop-artifacts.sh /tmp/compat-import-fixture.zip /tmp/compat-imported
          (cd /tmp/compat-imported && sha256sum -c SHA256SUMS)
          test -s /tmp/compat-imported/bin/fixture-tool
          test -s /tmp/compat-imported/IMPORT-MANIFEST.json

      - name: Publish compiled native component bundle
        uses: actions/upload-artifact@v4
        with:
          name: octavian-native-desktop-components
          path: ${{ runner.temp }}/octavian-desktop/
          if-no-files-found: error
          retention-days: 90
