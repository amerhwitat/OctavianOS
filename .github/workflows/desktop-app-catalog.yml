name: Desktop Application Catalog
on:
  push:
    paths:
      - "apps/desktop-application-catalog.json"
      - "apps/application-center.html"
      - "apps/paint-studio.html"
      - "apps/media-deck.html"
      - "apps/document-desk.html"
      - "apps/snake-arcade.html"
      - "apps/vector-studio.html"
      - "apps/sheet-desk.html"
      - "apps/file-toolkit.html"
      - "apps/code-workbench.html"
      - "web/index.html"
      - ".github/workflows/desktop-app-catalog.yml"
  pull_request:
    paths:
      - "apps/desktop-application-catalog.json"
      - "apps/application-center.html"
      - "apps/paint-studio.html"
      - "apps/media-deck.html"
      - "apps/document-desk.html"
      - "apps/snake-arcade.html"
      - "apps/vector-studio.html"
      - "apps/sheet-desk.html"
      - "apps/file-toolkit.html"
      - "apps/code-workbench.html"
      - "web/index.html"
      - ".github/workflows/desktop-app-catalog.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser for app launch smoke tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Launch and exercise browser application prototypes
        run: node apps/browser-smoke.mjs
      - name: Syntax-check Paint Studio and Media Deck scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in (Path("apps/paint-studio.html"), Path("apps/media-deck.html"), Path("apps/document-desk.html"), Path("apps/snake-arcade.html"), Path("apps/vector-studio.html"), Path("apps/sheet-desk.html"), Path("apps/file-toolkit.html"), Path("apps/code-workbench.html")):
              text = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", text, re.S)
              assert scripts, f"missing inline script: {path}"
              Path("/tmp/" + path.stem + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/paint-studio.js
          node --check /tmp/media-deck.js
          node --check /tmp/document-desk.js
          node --check /tmp/snake-arcade.js
          node --check /tmp/vector-studio.js
          node --check /tmp/sheet-desk.js
          node --check /tmp/file-toolkit.js
          node --check /tmp/code-workbench.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog schema, IDs, URLs and safety status
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          p = Path("apps/desktop-application-catalog.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("schema") == "cross-platform-desktop-app-catalog/v1"
          apps = data.get("apps")
          assert isinstance(apps, list) and apps, "apps must be a non-empty array"
          ids = []
          for app in apps:
              assert re.fullmatch(r"[a-z0-9][a-z0-9._-]+", app.get("id", "")), app
              assert app.get("name") and app.get("category") and app.get("license")
              assert app.get("provider") and app.get("install")
              assert isinstance(app.get("architectures"), list) and app["architectures"]
              assert app.get("integration_status") in {"catalog-only", "source-reviewed", "imported", "build-verified", "launch-verified", "supported", "blocked"}
              assert app.get("platform_targets") == ["ChimeraIIOS", "OctavianOS"]
              assert app.get("host_platforms") == ["Linux", "Windows", "macOS"]
              for field in ("homepage", "source"):
                  if app.get(field):
                      from urllib.parse import urlparse
                      u = urlparse(app[field])
                      assert u.scheme == "https" and u.netloc, (app["id"], field, app[field])
              ids.append(app["id"])
          assert len(ids) == len(set(ids)), "duplicate app IDs"
          page = Path("apps/application-center.html").read_text(encoding="utf-8")
          assert 'fetch("./desktop-application-catalog.json"' in page
          assert 'noopener noreferrer' in page
          assert "Application Center" in page
          vendor = json.loads(Path("vendor/chimera-ii-os/source/appcenter/catalog/apps.json").read_text(encoding="utf-8"))["apps"]
          vendor_ids = [app["id"] for app in vendor]
          manifest = Path("vendor/chimera-ii-os/source/iso/manifests/application-catalog.txt").read_text(encoding="utf-8").splitlines()
          assert ids == vendor_ids == manifest, "Octavian catalog, vendored Chimera catalog and ISO manifest must stay in sync"
          runtime = json.loads(Path("vendor/chimera-ii-os/source/appcenter/runtime-support-manifest.json").read_text(encoding="utf-8"))
          assert [app["id"] for app in runtime["apps"]] == ids, "runtime support manifest must match catalog order"
          assert all(app["native_package"]["available"] is False for app in runtime["apps"]), "do not claim unverified native packages"
          print(f"validated {len(apps)} mirrored catalog entries, vendored catalog and browser discovery UI")
          PY
      - name: Validate vendored native package contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("vendor/chimera-ii-os/source/appcenter")
          schema = json.loads((root / "package-manifest.schema.json").read_text(encoding="utf-8"))
          runtime = json.loads((root / "runtime-support-manifest.json").read_text(encoding="utf-8"))
          assert schema["schema"] if "schema" in schema else schema["$schema"]
          assert all(app["native_package"]["available"] is False for app in runtime["apps"])
          print("native package schema and fail-closed runtime manifest validated")
          PY
      - name: Compile vendored Application Center scripts
        run: python -m py_compile vendor/chimera-ii-os/source/appcenter/cli/chimera-appctl.py vendor/chimera-ii-os/source/desktop/aurora/repository_application_center.py
      - name: Check HTML integration link
        run: grep -q 'apps/application-center.html' web/index.html
