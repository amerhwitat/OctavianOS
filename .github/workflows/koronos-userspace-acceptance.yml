name: Koronos Userspace Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - '.github/workflows/koronos-userspace-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - '.github/workflows/koronos-userspace-acceptance.yml'

permissions:
  contents: read

jobs:
  userspace:
    name: ${{ matrix.target }} / ${{ matrix.firmware }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [live, installer, recovery]
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel, ISO and QEMU tools
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          sudo apt-get update
          sudo apt-get install -y nasm gcc g++ binutils grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools qemu-system-x86 ovmf busybox-static cpio gzip ffmpeg imagemagick unzip python3-cairosvg dosfstools
      - name: Build Koronos and high-address userspace probes
        run: cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source" && bash kernel/build-koronos.sh
      - name: Test Live and Recovery Multiboot2 module classification
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ikernel/include \
            kernel/tests/multiboot_modules_test.cpp kernel/core/multiboot_modules.cpp \
            -o /tmp/koronos-multiboot-modules-test
          /tmp/koronos-multiboot-modules-test
      - name: Build target-specific ISO from production-selected payload
        env:
          TARGET: ${{ matrix.target }}
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/build/userspace-acceptance/$TARGET"
          ISO_ROOT="$OUT/iso"
          PRODUCTION_ISO="$ROOT/boot/iso/dist/output.iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          # Build the same payloads consumed by the production ISO pipeline.
          # Production native-init ELFs are built independently and staged below; probe ELFs are not production payloads.
          bash tools/build-live-boot-binaries.sh
          bash boot/iso/build-iso.sh
          test -s "$PRODUCTION_ISO"
          cp build/live-boot/boot/koronos/koronos.elf "$ISO_ROOT/boot/koronos.elf"
          NATIVE_INIT="build/koronos/x86_64/native-init-$TARGET.elf"
          test -s "$NATIVE_INIT" || { echo "::error::production native init missing: $NATIVE_INIT"; exit 2; }
          readelf -h "$NATIVE_INIT" | grep -Eq 'Type:[[:space:]]+EXEC'
          readelf -lW "$NATIVE_INIT" | grep -Eq 'LOAD.*R E'
          readelf -lW "$NATIVE_INIT" | grep -Eq 'LOAD.*RW '
          cp "$NATIVE_INIT" "$ISO_ROOT/boot/native-init-$TARGET.elf"
          case "$TARGET" in
            live)
              manifest=build/live-boot/boot/live/live-manifest.json
              payload=build/live-boot/boot/live/chimera-live-initramfs.img
              test -s "$manifest" && test -s "$payload"
              python3 - "$manifest" "$payload" <<'PY'
          import hashlib, json, pathlib, sys
          manifest_path, payload_path = map(pathlib.Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("initramfs") != "/boot/live/chimera-live-initramfs.img":
              raise SystemExit("Live manifest does not select the built production initramfs")
          data = payload_path.read_bytes()
          if not data:
              raise SystemExit("production Live initramfs is empty")
          print(f"production_payload={payload_path} size={len(data)} sha256={hashlib.sha256(data).hexdigest()}")
          PY
              cp "$payload" "$ISO_ROOT/boot/chimera-live-initramfs.img"
              cp "$manifest" "$ISO_ROOT/boot/live-manifest.json"
              ;;
            recovery)
              manifest=build/live-boot/boot/recovery/recovery-manifest.json
              payload=build/live-boot/boot/recovery/chimera-recovery-initramfs.img
              test -s "$manifest" && test -s "$payload"
              python3 - "$manifest" "$payload" <<'PY'
          import hashlib, json, pathlib, sys
          manifest_path, payload_path = map(pathlib.Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("initramfs") != "/boot/recovery/chimera-recovery-initramfs.img":
              raise SystemExit("Recovery manifest does not select the built production initramfs")
          data = payload_path.read_bytes()
          if not data:
              raise SystemExit("production Recovery initramfs is empty")
          print(f"production_payload={payload_path} size={len(data)} sha256={hashlib.sha256(data).hexdigest()}")
          PY
              cp "$payload" "$ISO_ROOT/boot/chimera-recovery-initramfs.img"
              cp "$manifest" "$ISO_ROOT/boot/recovery-manifest.json"
              ;;
            installer)
              for f in installation.img installation-manifest.json installer-contract.json installation_phases.json installer_profiles.json; do
                xorriso -osirrox on -indev "$PRODUCTION_ISO" -extract "/install/installer/$f" "$ISO_ROOT/boot/$f" >/dev/null
                test -s "$ISO_ROOT/boot/$f" || { echo "::error::production Installer artifact missing: $f"; exit 1; }
              done
              sha256sum "$ISO_ROOT"/boot/installation.img "$ISO_ROOT"/boot/installation-manifest.json "$ISO_ROOT"/boot/installer-contract.json "$ISO_ROOT"/boot/installation_phases.json "$ISO_ROOT"/boot/installer_profiles.json
              python3 - "$ISO_ROOT/boot" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ("installation-manifest.json", "installer-contract.json",
                       "installation_phases.json", "installer_profiles.json"):
              json.loads((root / name).read_text(encoding="utf-8"))
          payload = root / "installation.img"
          if not payload.read_bytes():
              raise SystemExit("production Installer image is empty")
          print(f"production_payload={payload} size={payload.stat().st_size}")
          PY
              ;;
            *) echo "::error::unknown target $TARGET"; exit 2 ;;
          esac
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<EOF
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos $TARGET production-payload acceptance" {
            multiboot2 /boot/koronos.elf target=$TARGET
            module2 /boot/native-init-$TARGET.elf chimera-user-init-elf target=$TARGET
          EOF
          case "$TARGET" in
            live)
              cat >> "$ISO_ROOT/boot/grub/grub.cfg" <<'GRUB'
            module2 /boot/chimera-live-initramfs.img chimera-live-initramfs
            module2 /boot/live-manifest.json chimera-live-manifest
          GRUB
              ;;
            recovery)
              cat >> "$ISO_ROOT/boot/grub/grub.cfg" <<'GRUB'
            module2 /boot/chimera-recovery-initramfs.img chimera-recovery-initramfs
            module2 /boot/recovery-manifest.json chimera-recovery-manifest
          GRUB
              ;;
            installer)
              cat >> "$ISO_ROOT/boot/grub/grub.cfg" <<'GRUB'
            module2 /boot/installation.img chimera-installation-image
            module2 /boot/installation-manifest.json chimera-installation-manifest
            module2 /boot/installer-contract.json chimera-installer-contract
            module2 /boot/installation_phases.json chimera-install-phases
            module2 /boot/installer_profiles.json chimera-installer-profiles
          GRUB
              ;;
          esac
          cat >> "$ISO_ROOT/boot/grub/grub.cfg" <<'GRUB'
            boot
          }
          GRUB
          grub-mkrescue -o "$OUT/koronos-$TARGET.iso" "$ISO_ROOT"
          test -s "$OUT/koronos-$TARGET.iso"
      - name: Boot and require userspace-originated readiness
        env:
          TARGET: ${{ matrix.target }}
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -uo pipefail
          OUT="$PWD/build/userspace-acceptance/$TARGET"
          LOG="$OUT/qemu-$FIRMWARE.log"
          QEMU=(qemu-system-x86_64 -m 512M -cdrom "$OUT/koronos-$TARGET.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$LOG" -global isa-debugcon.iobase=0xe9)
          if [ "$FIRMWARE" = uefi ]; then
            OVMF_CODE=""
            OVMF_VARS=""
            for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
              if [ -f "$candidate" ]; then
                vars_candidate="${candidate/CODE/VARS}"
                if [ -f "$vars_candidate" ]; then OVMF_CODE="$candidate"; OVMF_VARS="$vars_candidate"; break; fi
              fi
            done
            if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
              echo "ERROR: matching OVMF code/vars images were not installed" >&2
              find /usr/share -iname 'OVMF_*.fd' -print >&2 || true
              exit 1
            fi
            cp "$OVMF_VARS" "$OUT/OVMF_VARS.fd"
            QEMU+=(-drive "if=pflash,format=raw,unit=0,readonly=on,file=$OVMF_CODE"
                   -drive "if=pflash,format=raw,unit=1,file=$OUT/OVMF_VARS.fd")
          fi
          set +e
          timeout 18s "${QEMU[@]}"
          qemu_rc=$?
          set -e
          # A healthy test init exits to the kernel, which then idles. Timeout
          # is therefore expected; the marker and clean-exit diagnostics are the
          # acceptance evidence, not the QEMU process exit code. Always print the
          # complete trace before assertions so failures can be debugged from CI.
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "ERROR: no debugcon trace at $LOG"; fi
          # Parse the complete trace, not just the last matching lines: reject
          # reordered, duplicated, wrong-target, zero-PID, or mismatched-PID markers.
          python3 - "$TARGET" "$LOG" <<'PY'
          import pathlib, re, sys
          target, path = sys.argv[1], pathlib.Path(sys.argv[2])
          trace = path.read_text(encoding="utf-8", errors="replace")
          kernel = list(re.finditer(r"\[KRN \] KORONOS READY", trace))
          ack = list(re.finditer(r"USER INIT SYSCALL: target=(live|installer|recovery) init_pid=([1-9][0-9]*)\b", trace))
          ready = list(re.finditer(r"USERSPACE READY: (live|installer|recovery) init pid=([1-9][0-9]*)\b", trace))
          if len(kernel) != 1:
              raise SystemExit(f"FAIL: expected exactly one kernel-ready marker, found {len(kernel)}")
          if len(ack) != 1:
              raise SystemExit(f"FAIL: expected exactly one nonzero user-init syscall acknowledgement, found {len(ack)}")
          if len(ready) != 1:
              raise SystemExit(f"FAIL: expected exactly one nonzero userspace-ready marker, found {len(ready)}")
          if ack[0].group(1) != target or ready[0].group(1) != target:
              raise SystemExit(f"FAIL: target mismatch: expected {target}, ack={ack[0].group(1)}, ready={ready[0].group(1)}")
          if ack[0].group(2) != ready[0].group(2):
              raise SystemExit(f"FAIL: PID mismatch: ack={ack[0].group(2)}, ready={ready[0].group(2)}")
          if not kernel[0].start() < ack[0].start() < ready[0].start():
              raise SystemExit("FAIL: required order is kernel-ready -> user-originated syscall -> userspace-ready")
          print(f"PASS: ordered kernel/user-syscall/userspace-ready trace target={target} pid={ready[0].group(2)}")
          PY
          grep -Fq "NATIVE INIT: Koronos syscall round-trip verified" "$LOG"
          grep -Fq "[RUN ] Target userspace init emitted its own readiness handshake and exited cleanly" "$LOG"
          # Page-table reclamation is covered by its dedicated address-space tests;
          # the production native-init trace does not emit the old probe-only banner.
          echo "Candidate ring-3 launch smoke passed target=$TARGET firmware=$FIRMWARE qemu_exit=$qemu_rc (production payload acceptance remains separate)"
      - name: Prove in-kernel timeout aborts a non-returning ring-3 process
        if: matrix.firmware == 'bios'
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/build/userspace-acceptance/timeout"
          ISO_ROOT="$OUT/iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$ISO_ROOT/boot/koronos.elf"
          cp build/koronos/x86_64/user-init-timeout.elf "$ISO_ROOT/boot/user-init-timeout.elf"
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<'EOF'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos in-kernel timeout acceptance" {
            multiboot2 /boot/koronos.elf
            module2 /boot/user-init-timeout.elf chimera-user-init-elf target=live
            boot
          }
          EOF
          grub-mkrescue -o "$OUT/koronos-timeout.iso" "$ISO_ROOT"
          LOG="$OUT/qemu-timeout.log"
          set +e
          timeout 15s qemu-system-x86_64 -machine pc -m 512M -cdrom "$OUT/koronos-timeout.iso" -boot d \
            -display none -serial none -monitor none -no-reboot -no-shutdown \
            -debugcon "file:$LOG" -global isa-debugcon.iobase=0xe9
          qemu_rc=$?
          set -e
          cat "$LOG"
          grep -Fq "[RUN ] Dispatching selected user init through CR3 + ring-3 entry with 10s kernel deadline" "$LOG"
          grep -Fq "[RUN ] ERROR: in-kernel PIT deadline expired; user process aborted and address space will be reclaimed" "$LOG"
          ! grep -Fq "USERSPACE READY: live" "$LOG"
          echo "Accepted in-kernel non-cooperative timeout (outer QEMU exit=$qemu_rc)"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userspace-${{ matrix.target }}-${{ matrix.firmware }}-logs
          path: |
            vendor/chimera-ii-os/source/build/userspace-acceptance/${{ matrix.target }}/qemu-${{ matrix.firmware }}.log
            vendor/chimera-ii-os/source/build/userspace-acceptance/timeout/qemu-timeout.log
          if-no-files-found: warn
