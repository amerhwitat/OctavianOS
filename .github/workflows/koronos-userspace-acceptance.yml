name: Koronos Immutable ISO Probe and SMP Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/boot/**'
      - 'vendor/chimera-ii-os/source/iso/**'
      - 'vendor/chimera-ii-os/source/tools/**'
      - 'vendor/chimera-ii-os/source/desktop/aurora/**'
      - '.github/workflows/koronos-userspace-acceptance.yml'

permissions:
  contents: read

jobs:
  immutable-iso:
    name: One ISO / six BIOS-UEFI target boots / two-vCPU SMP
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install native build, ISO, QEMU and firmware tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential nasm binutils \
            grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            busybox cpio gzip qemu-system-x86 ovmf python3
          OVMF_PATH=""
          for candidate in /usr/share/ovmf/OVMF.fd /usr/share/OVMF/OVMF.fd /usr/share/qemu/OVMF.fd; do
            if [[ -s "$candidate" ]]; then OVMF_PATH="$candidate"; break; fi
          done
          test -n "$OVMF_PATH"
          echo "OVMF_PATH=$OVMF_PATH" >> "$GITHUB_ENV"
          echo "OVMF_VERSION=$(dpkg-query -W -f='\${Version}' ovmf)" >> "$GITHUB_ENV"
          qemu-system-x86_64 --version
          QEMU_VERSION="$(qemu-system-x86_64 --version | awk 'NR == 1 { print $4 }')"
          python3 - "$QEMU_VERSION" <<'PY'
          import sys
          version = tuple(int(part) for part in sys.argv[1].split(".")[:3])
          if version < (10, 2, 1):
              raise SystemExit(f"QEMU {sys.argv[1]} is too old for the x2APIC acceptance gate; require >=10.2.1")
          print(f"QEMU_VERSION_GATE=PASS ({sys.argv[1]})")
          PY

      - name: Apply and verify downstream interactive boot-menu policy
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          python3 - "$ROOT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          boot = root / "boot"
          required = [
              boot / "iso/grub.cfg",
              boot / "loader-menu.cfg",
              boot / "jasper/jasper.cfg",
              boot / "spitfire/spitfire-menu.cfg",
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing required boot menu: {path}")

          candidates = sorted(p for p in boot.rglob("*.cfg") if p.is_file())
          changed = []
          for path in candidates:
              original = path.read_text(encoding="utf-8")
              if "menuentry" not in original and not re.search(r"(?m)^\s*set\s+timeout(?:_style)?\s*=", original):
                  continue
              body = [
                  line for line in original.splitlines()
                  if not re.match(r"^\s*set\s+timeout(?:_style)?\s*=", line)
              ]
              updated = (
                  "# Octavian downstream acceptance policy: visible menu; key input cancels countdown.\n"
                  "set timeout=120\n"
                  "set timeout_style=menu\n"
                  + "\n".join(body) + "\n"
              )
              path.write_text(updated, encoding="utf-8")
              lines = updated.splitlines()
              if lines.count("set timeout=120") != 1 or lines.count("set timeout_style=menu") != 1:
                  raise SystemExit(f"menu policy did not normalize exactly once: {path}")
              changed.append(path.relative_to(root).as_posix())

          for path in required:
              text = path.read_text(encoding="utf-8")
              if "set timeout=120" not in text or "set timeout_style=menu" not in text:
                  raise SystemExit(f"required menu policy missing after overlay: {path}")

          contract_path = boot / "boot-menu-contract.json"
          gates_path = root / "desktop/aurora/gates_menu.json"
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          gates = json.loads(gates_path.read_text(encoding="utf-8"))
          contract["menu_input_grace_seconds"] = 300
          contract["auto_select_default_after_seconds"] = None
          contract["timeout_action"] = "return_to_open_menu"
          contract["auto_activate_default"] = False
          contract["selection_requires_explicit_confirmation"] = True
          gates_contract = gates["boot_contract"]
          gates_contract["input_grace_seconds"] = 300
          gates_contract["auto_boot_default_after_seconds"] = None
          gates_contract["timeout_action"] = "return_to_open_menu"
          gates_contract["auto_activate_default"] = False
          gates_contract["selection_requires_explicit_confirmation"] = True
          contract_path.write_text(json.dumps(contract, indent=2) + "\n", encoding="utf-8")
          gates_path.write_text(json.dumps(gates, indent=2) + "\n", encoding="utf-8")

          # The current vendor source has declarative Gates fields but no known
          # executable consumer. Report that limitation; do not call this runtime proof.
          consumers = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".c", ".cc", ".cpp", ".h", ".hpp", ".py", ".js", ".ts"}:
                  continue
              try:
                  if "auto_boot_default_after_seconds" in path.read_text(encoding="utf-8", errors="ignore"):
                      consumers.append(path.relative_to(root).as_posix())
              except OSError:
                  pass
          print(f"BOOT_MENU_FILES_NORMALIZED={len(changed)}")
          print("BOOT_MENU_FILES=" + ",".join(changed))
          print("GATES_INPUT_GRACE_SECONDS=300")
          print("GATES_AUTO_ACTIVATE_DEFAULT=False")
          print("GATES_TIMEOUT_ACTION=return_to_open_menu")
          print("GATES_RUNTIME_CONSUMERS=" + (",".join(consumers) if consumers else "NONE_FOUND"))
          if not consumers:
              print("::warning::Gates policy is declarative only; no runtime consumer was found in the vendored source.")
          PY

      - name: Build Koronos and one hybrid BIOS-UEFI ISO
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          OUT="$GITHUB_WORKSPACE/build/koronos-release-matrix"
          ISO="$OUT/chimera-candidate.iso"
          mkdir -p "$OUT"
          bash "$ROOT/kernel/build-koronos.sh"
          CHIMERA_AUTO_INSTALL_DEPS=0 \
          CHIMERA_KERNEL="$ROOT/build/koronos/x86_64/koronos.elf" \
          CHIMERA_OUTPUT_ISO="$ISO" \
            bash "$ROOT/iso/chimera-live-iso.sh"
          test -s "$ISO"
          sha256sum "$ISO" | tee "$OUT/iso.sha256"
          for target in live installer recovery; do
            manifest="$ROOT/build/live-boot/boot/targets/target-init-$target.manifest.json"
            if [[ ! -s "$manifest" ]]; then
              manifest="$ROOT/build/chimera-live/iso-root/boot/targets/target-init-$target.manifest.json"
            fi
            test -s "$manifest"
            python3 - "$manifest" "$target" <<'PY'
          import json, sys
          from pathlib import Path
          doc = json.loads(Path(sys.argv[1]).read_text())
          target = sys.argv[2]
          assert doc["target"] == target
          assert doc["payload_kind"] == "ring3-readiness-probe"
          assert doc["production_ready"] is False
          print(f"{target}: CPL3 handoff artifact remains explicitly probe-only")
          PY
          done

      - name: Run six cases against the same ISO with real two-vCPU QEMU
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          OUT="$GITHUB_WORKSPACE/build/koronos-release-matrix"
          ISO="$OUT/chimera-candidate.iso"
          MATRIX="$OUT/cases"
          SOURCE_RUNNER="$ROOT/tools/runtime/check-release-firmware-matrix.py"
          RUNNER="$OUT/check-release-firmware-matrix-smp.py"
          test -s "$OVMF_PATH"
          python3 - "$SOURCE_RUNNER" "$RUNNER" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          qemu_old = '            "-smp", "1",\n'
          qemu_new = (
              '            "-machine", "pc",\n'
              '            "-cpu", "max",\n'
              '            "-smp", "2",\n'
          )
          if source.count(qemu_old) != 1:
              raise SystemExit("expected exactly one single-vCPU QEMU argument block")
          source = source.replace(qemu_old, qemu_new, 1)

          menu_old = '                wait_for(serial_trace, ["Live Aurora / Koronos"], 90)\n'
          menu_new = (
              menu_old
              + '                time.sleep(2)\n'
              + '                if "[KRN ] KORONOS READY" in read_text(kernel_trace):\n'
              + '                    raise RuntimeError("kernel advanced before explicit menu selection")\n'
          )
          if source.count(menu_old) != 1:
              raise SystemExit("expected exactly one interactive GRUB menu wait")
          source = source.replace(menu_old, menu_new, 1)
          Path(sys.argv[2]).write_text(source, encoding="utf-8")
          compile(source, sys.argv[2], "exec")
          print("QEMU policy: machine=pc cpu=max smp=2")
          print("GRUB policy: wait for visible menu; send explicit QMP key before kernel boot")
          PY

          set +e
          python3 "$RUNNER" \
            --iso "$ISO" \
            --ovmf "$OVMF_PATH" \
            --work "$MATRIX" \
            --verifier "$ROOT/tests/boot/verify-userspace-handoff.py" \
            --ovmf-version "$OVMF_VERSION"
          runner_rc=$?
          set -e

          python3 - "$MATRIX/summary.json" "$ISO" "$runner_rc" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          summary_path, iso_path, runner_rc = Path(sys.argv[1]), Path(sys.argv[2]), int(sys.argv[3])
          if not summary_path.is_file():
              raise SystemExit("six-case runner did not produce summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          iso_sha = hashlib.sha256(iso_path.read_bytes()).hexdigest()
          expected = {
              "live-bios", "installer-bios", "recovery-bios",
              "live-uefi", "installer-uefi", "recovery-uefi",
          }
          cases = {case["case"]: case for case in summary.get("cases", [])}
          failures = []
          if set(cases) != expected:
              failures.append(f"case set mismatch: {sorted(cases)}")
          if summary.get("iso_sha256") != iso_sha:
              failures.append("summary ISO SHA does not match the built candidate")
          for name in sorted(expected & set(cases)):
              case = cases[name]
              trace_path = Path(case["kernel_trace"])
              trace = trace_path.read_text(encoding="utf-8", errors="replace") if trace_path.is_file() else ""
              command = case.get("qemu_command", "")
              if case.get("iso_sha256") != iso_sha:
                  failures.append(f"{name}: ISO SHA differs")
              for flag in ("-machine pc", "-cpu max", "-smp 2"):
                  if flag not in command:
                      failures.append(f"{name}: QEMU command missing {flag}")
              required = [
                  "[PMT ] SELFTEST PASS",
                  "[SMP ] SELFTEST PASS",
                  "[SMP ] Native x86_64 AP startup/two-CPU overlap gate passed",
                  "[SMP ] ap_online=1",
                  "[SMP ] overlap_samples=256",
                  "[SMP ] ap_saw_bsp_rounds=256",
                  "[SMP ] tsc_overlap=1",
                  f"USER INIT SYSCALL: target={case['target']}",
                  f"USERSPACE READY: target={case['target']}",
              ]
              for token in required:
                  if token not in trace:
                      failures.append(f"{name}: missing {token}")
              verifier = case.get("handoff_verifier", {})
              if verifier.get("returncode") != 0:
                  failures.append(f"{name}: CPL3/PID handoff verifier failed")
              if case.get("status") != "PASS":
                  failures.append(f"{name}: handoff runner status={case.get('status')} ({case.get('failure')})")
              match = re.search(r"(?m)^\[SMP \] overlap_samples=(\d+)$", trace)
              if match and int(match.group(1)) != 256:
                  failures.append(f"{name}: measured overlap={match.group(1)}, expected 256")
              print(f"{name}: status={case.get('status')} iso_sha={case.get('iso_sha256')} "
                    f"ap_overlap={'256' if '[SMP ] overlap_samples=256' in trace else 'MISSING'} "
                    f"handoff_verifier={verifier.get('returncode')}")
          print(f"IMMUTABLE_ISO_SHA256={iso_sha}")
          print(f"RUNNER_EXIT={runner_rc}")
          if runner_rc != 0:
              failures.append(f"six-case handoff runner exited {runner_rc}")
          if failures:
              print("FAIL-CLOSED ACCEPTANCE:")
              for failure in failures:
                  print(" - " + failure)
              raise SystemExit(1)
          print("PASS: six BIOS/UEFI probe handoffs and AP-backed overlap on one immutable ISO")
          print("NOTE: target ELFs are explicitly probe-only; this is not production certification.")
          PY

      - name: Upload candidate ISO and six-case diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-one-iso-six-case-probe-acceptance
          path: |
            build/koronos-release-matrix/chimera-candidate.iso
            build/koronos-release-matrix/iso.sha256
            build/koronos-release-matrix/cases/**
            vendor/chimera-ii-os/source/build/koronos/**
            vendor/chimera-ii-os/source/build/live-boot/boot/targets/**
          if-no-files-found: warn
          retention-days: 30
