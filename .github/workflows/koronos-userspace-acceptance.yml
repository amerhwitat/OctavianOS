name: Koronos Userspace Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - '.github/workflows/koronos-userspace-acceptance.yml'
  push:
    branches: [main, fix/userspace-acceptance-probe-artifacts-20261023]
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - '.github/workflows/koronos-userspace-acceptance.yml'

permissions:
  contents: read

jobs:
  userspace:
    name: ${{ matrix.target }} / ${{ matrix.firmware }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [live, installer, recovery]
        firmware: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      # Pin the exact reviewed ChimeraIIOS remediation commit for this candidate run.
      # The canonical checkout is overlaid into an isolated CI build tree; this does not rewrite the committed vendor snapshot.
      # Candidate probes remain smoke evidence only and cannot satisfy production closeout.
      - name: Checkout canonical ChimeraIIOS kernel source
        uses: actions/checkout@v4
        with:
          repository: amerhwitat/ChimeraIIOS
          ref: 24b48f7ddf2b1f244e8f95a9d6b041ac44549889
          path: chimera-upstream
          fetch-depth: 1
      - name: Synchronize canonical source into isolated vendor build tree
        shell: bash
        run: |
          set -euo pipefail
          dest=vendor/chimera-ii-os/source
          mkdir -p "$dest"
          rsync -a --delete --exclude='.git/' --exclude='node_modules/' --exclude='build/' --exclude='dist/' --exclude='target/' --exclude='.cache/' --exclude='.venv/' --exclude='venv/' --exclude='__pycache__/' --exclude='*.iso' --exclude='*.img' --exclude='*.elf' --exclude='*.o' --exclude='*.a' --exclude='*.so' --exclude='*.dll' --exclude='*.exe' --exclude='*.dSYM/' --exclude='logs/' --exclude='out/' chimera-upstream/ "$dest/"
          source_sha="$(git -C chimera-upstream rev-parse HEAD)"
          test "$source_sha" = "24b48f7ddf2b1f244e8f95a9d6b041ac44549889"
          echo "Canonical ChimeraIIOS source: $source_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Koronos acceptance is building pinned canonical source $source_sha, not an unverified stale vendor tree."
      - name: Verify kernel source/build manifest parity
        shell: bash
        run: |
          set -euo pipefail
          cd vendor/chimera-ii-os/source
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          builder = (root / "kernel/build-koronos.sh").read_text(encoding="utf-8")
          required = (
              "block_device", "iso9660", "frame_allocator", "address_space",
              "initramfs_cpio", "gzip", "initramfs_ingest", "ramfs",
              "vfs", "tmpfs", "target_launch",
          )
          match = re.search(r"^sources=\(([^)]*)\)", builder, re.MULTILINE)
          if not match:
              raise SystemExit("ERROR: canonical builder has no explicit source manifest")
          units = set(match.group(1).split())
          missing = [name for name in required if name not in units or not (root / f"kernel/core/{name}.cpp").is_file()]
          if missing:
              raise SystemExit("ERROR: kernel source/build manifest drift: " + ", ".join(missing))
          if "user_entry.asm" not in builder or "user-entry.o" not in builder:
              raise SystemExit("ERROR: ring-3 user-entry assembly is not built and linked")
          if not (root / "kernel/arch/x86_64/user_entry.asm").is_file():
              raise SystemExit("ERROR: required ring-3 user-entry assembly source is missing")
          print("PASS: canonical kernel source list includes process/address-space/VFS/initramfs/target-launch and ring-3 entry")
          PY
      - name: Install kernel, ISO and QEMU tools
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          sudo apt-get update
          sudo apt-get install -y nasm gcc g++ binutils grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools qemu-system-x86 ovmf
      - name: Build Koronos and high-address userspace probes
        run: cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source" && bash kernel/build-koronos.sh
      - name: Test Live and Recovery Multiboot2 module classification
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ikernel/include \
            kernel/tests/multiboot_modules_test.cpp kernel/core/multiboot_modules.cpp \
            -o /tmp/koronos-multiboot-modules-test
          /tmp/koronos-multiboot-modules-test
      - name: Test dependency-aware service supervisor lifecycle
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ikernel/include \
            kernel/core/service.cpp kernel/tests/service_bootstrap_test.cpp \
            -o /tmp/service-supervisor-contract
          /tmp/service-supervisor-contract
      - name: Test transactional RAMFS symlink extraction and rollback
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -Ikernel/include \
            kernel/core/initramfs_cpio.cpp kernel/core/ramfs.cpp kernel/tests/ramfs_test.cpp \
            -o /tmp/koronos-ramfs-test
          /tmp/koronos-ramfs-test
      - name: Build target-specific BIOS/UEFI ISO
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/build/userspace-acceptance/$TARGET"
          ISO_ROOT="$OUT/iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$ISO_ROOT/boot/koronos.elf"
          cp "build/koronos/x86_64/user-init-$TARGET.elf" "$ISO_ROOT/boot/user-init-$TARGET.elf"
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<EOF
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos $TARGET userspace acceptance" {
            multiboot2 /boot/koronos.elf
            module2 /boot/user-init-$TARGET.elf chimera-user-init-elf target=$TARGET probe=ring3
            boot
          }
          EOF
          grub-mkrescue -o "$OUT/koronos-$TARGET.iso" "$ISO_ROOT"
          test -s "$OUT/koronos-$TARGET.iso"
      - name: Boot and require userspace-originated readiness
        env:
          TARGET: ${{ matrix.target }}
          FIRMWARE: ${{ matrix.firmware }}
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -uo pipefail
          OUT="$PWD/build/userspace-acceptance/$TARGET"
          LOG="$OUT/qemu-$FIRMWARE.log"
          QEMU=(qemu-system-x86_64 -m 512M -cdrom "$OUT/koronos-$TARGET.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$LOG" -global isa-debugcon.iobase=0xe9)
          if [ "$FIRMWARE" = uefi ]; then
            OVMF_CODE=""
            OVMF_VARS=""
            for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd /usr/share/edk2/ovmf/OVMF_CODE.fd; do
              if [ -f "$candidate" ]; then
                vars_candidate="${candidate/CODE/VARS}"
                if [ -f "$vars_candidate" ]; then OVMF_CODE="$candidate"; OVMF_VARS="$vars_candidate"; break; fi
              fi
            done
            if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
              echo "ERROR: matching OVMF code/vars images were not installed" >&2
              find /usr/share -iname 'OVMF_*.fd' -print >&2 || true
              exit 1
            fi
            cp "$OVMF_VARS" "$OUT/OVMF_VARS.fd"
            QEMU+=(-drive "if=pflash,format=raw,unit=0,readonly=on,file=$OVMF_CODE"
                   -drive "if=pflash,format=raw,unit=1,file=$OUT/OVMF_VARS.fd")
          fi
          set +e
          timeout 18s "${QEMU[@]}"
          qemu_rc=$?
          set -e
          # A healthy test init exits to the kernel, which then idles. Timeout
          # is therefore expected; the marker and clean-exit diagnostics are the
          # acceptance evidence, not the QEMU process exit code. Always print the
          # complete trace before assertions so failures can be debugged from CI.
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "ERROR: no debugcon trace at $LOG"; fi
          grep -Fq "[KRN ] KORONOS READY" "$LOG"
          # Require a real, nonzero PID supplied by the running probe, not a
          # literal pid=1 baked into the image or a kernel-authored marker.
          ready_line="$(grep -Eo "USERSPACE READY: ${TARGET} init pid=[1-9][0-9]*" "$LOG" | tail -n 1)"
          ack_line="$(grep -Eo "USER INIT SYSCALL: target=${TARGET} init_pid=[1-9][0-9]*" "$LOG" | tail -n 1)"
          test -n "$ready_line"
          test -n "$ack_line"
          ready_pid="${ready_line##*=}"
          ack_pid="${ack_line##*=}"
          test "$ready_pid" = "$ack_pid"
          grep -Fq "USERSPACE SYSCALL RETURNED TO RING3" "$LOG"
          grep -Fq "[RUN ] Target userspace init emitted its own readiness handshake and exited cleanly" "$LOG"
          grep -Fq "[MM  ] Process page-table self-test passed" "$LOG"
          echo "Candidate ring-3 launch smoke passed target=$TARGET firmware=$FIRMWARE qemu_exit=$qemu_rc (production payload acceptance remains separate)"
      - name: Prove in-kernel timeout aborts a non-returning ring-3 process
        if: matrix.firmware == 'bios'
        run: |
          cd "$GITHUB_WORKSPACE/vendor/chimera-ii-os/source"
          set -euo pipefail
          ROOT="$PWD"
          OUT="$ROOT/build/userspace-acceptance/timeout"
          ISO_ROOT="$OUT/iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$ISO_ROOT/boot/koronos.elf"
          cp build/koronos/x86_64/user-init-timeout.elf "$ISO_ROOT/boot/user-init-timeout.elf"
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<'EOF'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos in-kernel timeout acceptance" {
            multiboot2 /boot/koronos.elf
            module2 /boot/user-init-timeout.elf chimera-user-init-elf target=live probe=ring3
            boot
          }
          EOF
          grub-mkrescue -o "$OUT/koronos-timeout.iso" "$ISO_ROOT"
          LOG="$OUT/qemu-timeout.log"
          set +e
          timeout 15s qemu-system-x86_64 -machine pc -m 512M -cdrom "$OUT/koronos-timeout.iso" -boot d \
            -display none -serial none -monitor none -no-reboot -no-shutdown \
            -debugcon "file:$LOG" -global isa-debugcon.iobase=0xe9
          qemu_rc=$?
          set -e
          cat "$LOG"
          grep -Fq "[RUN ] Dispatching selected user init through CR3 + ring-3 entry with 10s kernel deadline" "$LOG"
          grep -Fq "[RUN ] ERROR: in-kernel PIT deadline expired; user process aborted and address space will be reclaimed" "$LOG"
          ! grep -Fq "USERSPACE READY: live" "$LOG"
          echo "Accepted in-kernel non-cooperative timeout (outer QEMU exit=$qemu_rc)"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userspace-${{ matrix.target }}-${{ matrix.firmware }}-logs
          path: |
            vendor/chimera-ii-os/source/build/userspace-acceptance/${{ matrix.target }}/qemu-${{ matrix.firmware }}.log
            vendor/chimera-ii-os/source/build/userspace-acceptance/timeout/qemu-timeout.log
          if-no-files-found: warn
