name: Koronos Production DAPS Gate

on:
  pull_request:
    paths:
      - "tools/release/verify-production-daps.py"
      - "tools/tests/test_production_daps_contract.py"
      - "docs/PRODUCTION_DAPS.md"
      - "vendor/chimera-ii-os/source/kernel/**"
      - ".github/workflows/koronos-production-daps.yml"
      - ".github/workflows/publish-octavianos-preview.yml"
      - "tools/tests/test_preview_publish_gate.py"
      - "tools/tests/test_build_cleanup_contract.py"
  push:
    branches: [main]
    paths:
      - "tools/release/verify-production-daps.py"
      - "tools/tests/test_production_daps_contract.py"
      - "docs/PRODUCTION_DAPS.md"
      - "vendor/chimera-ii-os/source/kernel/**"
      - ".github/workflows/koronos-production-daps.yml"
      - ".github/workflows/publish-octavianos-preview.yml"
      - "tools/tests/test_preview_publish_gate.py"
      - "tools/tests/test_build_cleanup_contract.py"
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "GitHub Actions run ID that produced the immutable production evidence bundle"
        required: true
        type: string
      evidence_artifact_name:
        description: "Exact artifact name containing evidence.json, the ISO, traces, and extracted init payloads"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verifier-contract:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production DAPS verifier
        run: python3 -m py_compile tools/release/verify-production-daps.py
      - name: Verify all required production acceptance gates remain fail-closed
        run: |
          python3 tools/tests/test_production_daps_contract.py
          python3 tools/tests/test_preview_publish_gate.py
          python3 tools/tests/test_build_cleanup_contract.py

  production-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download evidence from the specified completed run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.evidence_run_id }}
          name: ${{ inputs.evidence_artifact_name }}
          path: build/production-daps
      - name: Compile verifier
        run: python3 -m py_compile tools/release/verify-production-daps.py
      - name: Verify immutable ISO and all six production cases
        run: python3 tools/release/verify-production-daps.py --evidence build/production-daps/evidence.json
