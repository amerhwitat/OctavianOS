name: Polyglot Python Windows and Linux packaging
on:
  pull_request:
    paths: ['tools/polyglot_apps.py','live-image/build.sh','**/*.py','**/*.java','**/*.html','**/*.js','.github/workflows/polyglot-apps.yml']
  push:
    branches: [main, 'feat/jasper-multimode-verbose-svga-20261103']
    paths: ['tools/polyglot_apps.py','live-image/build.sh','**/*.py','**/*.java','**/*.html','**/*.js','.github/workflows/polyglot-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk-headless maven python3-tk
          python -m pip install --upgrade pip pyinstaller
      - name: Compile sources and build Linux applications
        run: |
          set -euo pipefail
          python tools/polyglot_apps.py --root . --output build/polyglot-linux --platform linux --build
          python - <<'PY'
          import json, pathlib, py_compile
          data=json.loads(pathlib.Path('build/polyglot-linux/polyglot-apps.json').read_text())
          for app in data['python']:
              py_compile.compile(app['source'], doraise=True)
          assert data['panel_build']=='built', data.get('panel_build_log','GUI panel was not built')
          print('Compiled',len(data['python']),'first-party Python sources')
          print('Java sources:',data['java_source_count'],'Java build:',data['java_build'])
          print('Web sources:',data['web_source_count'])
          PY
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path '*/vendor/*' -prune -o -path '*/node_modules/*' -prune -o -path '*/.git/*' -prune -o -name '*.js' -type f -print0)
          test -s build/polyglot-linux/polyglot-apps.json
      - uses: actions/upload-artifact@v4
        with:
          name: polyglot-linux-apps
          path: build/polyglot-linux/
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows GUI executables
        shell: pwsh
        run: |
          python tools/polyglot_apps.py --root . --output build/polyglot-windows --platform windows --build
          python - <<'PY'
          import json, pathlib, py_compile
          data=json.loads(pathlib.Path('build/polyglot-windows/polyglot-apps.json').read_text())
          for app in data['python']:
              py_compile.compile(app['source'], doraise=True)
          assert data['panel_build']=='built', data.get('panel_build_log','GUI panel was not built')
          print('Compiled',len(data['python']),'first-party Python sources')
          PY
          if (!(Test-Path build/polyglot-windows/polyglot-apps.json)) { throw "Missing manifest" }
          if (!(Test-Path build/polyglot-windows/dist/PolyglotAppsPanel.exe)) { throw "Missing Windows Apps Panel executable" }
      - uses: actions/upload-artifact@v4
        with:
          name: polyglot-windows-executables
          path: build/polyglot-windows/
          if-no-files-found: error
