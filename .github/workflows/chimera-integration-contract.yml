name: Vendored Chimera Registry, Network, Directory, Optical and FHS Contracts
on:
  pull_request:
    paths:
      - "vendor/chimera-ii-os/source/services/registry/**"
      - "vendor/chimera-ii-os/source/services/network/**"
      - "vendor/chimera-ii-os/source/services/storage/**"
      - "vendor/chimera-ii-os/source/system/integrations/**"
      - "vendor/chimera-ii-os/source/system/registry/**"
      - "vendor/chimera-ii-os/source/system/network/**"
      - "vendor/chimera-ii-os/source/system/filesystem/**"
      - "vendor/chimera-ii-os/source/desktop/aurora-shell/**"
      - "vendor/chimera-ii-os/source/desktop/aurora/**"
      - "vendor/chimera-ii-os/source/live-image/**"
      - "vendor/chimera-ii-os/source/tools/**"
      - "vendor/chimera-ii-os/source/tests/**"
      - "vendor/chimera-ii-os/source/userspace/**"
      - "vendor/chimera-ii-os/source/platform/systemd/**"
      - ".github/workflows/chimera-integration-contract.yml"
  push:
    branches: [main, docs/cpu-architecture-matrix-20261104]
    paths:
      - "vendor/chimera-ii-os/source/services/registry/**"
      - "vendor/chimera-ii-os/source/services/network/**"
      - "vendor/chimera-ii-os/source/services/storage/**"
      - "vendor/chimera-ii-os/source/system/integrations/**"
      - "vendor/chimera-ii-os/source/system/registry/**"
      - "vendor/chimera-ii-os/source/system/network/**"
      - "vendor/chimera-ii-os/source/system/filesystem/**"
      - "vendor/chimera-ii-os/source/desktop/aurora-shell/**"
      - "vendor/chimera-ii-os/source/desktop/aurora/**"
      - "vendor/chimera-ii-os/source/live-image/**"
      - "vendor/chimera-ii-os/source/tools/**"
      - "vendor/chimera-ii-os/source/tests/**"
      - "vendor/chimera-ii-os/source/userspace/**"
      - "vendor/chimera-ii-os/source/platform/systemd/**"
      - ".github/workflows/chimera-integration-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    name: Registry, SMB, AD/LDAP, optical and FHS contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vendor/chimera-ii-os/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile every integration Python entry point
        run: |
          find services tools live-image -type f -name '*.py' -print0 |
            xargs -0 -r python -m py_compile
      - name: Run registry, SMB, AD/LDAP, optical and FHS tests
        run: |
          python -m unittest discover -s tests/integrations -v
          bash tests/services/run-service-tests.sh
      - name: Check Aurora JavaScript
        run: |
          node --check desktop/aurora-shell/assets/apps-registry.js
          node --check desktop/aurora-shell/assets/apps-windows-network.js
          node --check desktop/aurora-shell/assets/apps-optical-media.js
          node --check web/system-services.js
      - name: Validate manifests, runtime session and staging
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("system/integrations").glob("*.json"):
              json.loads(path.read_text())
          services = json.loads(pathlib.Path("services/service_registry.json").read_text())
          ids = {item["id"] for item in services["services"]}
          required = {"registry", "smb-server", "smb-discovery", "directory-services", "optical-media"}
          assert required <= ids, required - ids
          index = pathlib.Path("desktop/aurora-shell/index.html").read_text()
          for name in ("apps-registry.js", "apps-windows-network.js", "apps-optical-media.js"):
              assert name in index
          build = pathlib.Path("live-image/build.sh").read_text()
          for name in ("registryd.py", "registry-editor-api.py", "registry-editor-launcher.py",
                       "registry-editor.html", "smb-browse.py", "directoryctl.py",
                       "directory-discovery.py", "mount-image.py"):
              assert name in build, name
          session_unit = pathlib.Path("userspace/systemd/aurora-session.service").read_text()
          session_script = pathlib.Path("userspace/bin/aurora-session").read_text()
          assert "dbus-run-session" in session_unit
          assert "/usr/libexec/polkit-mate-authentication-agent-1" in session_script
          print("vendored integration contracts: OK")
          PY
      - name: Verify all default registry hives
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for hive in machine environment kernel; do
            python tools/registry/registry_hive.py build --input "system/registry/$hive.defaults.json" --output "$tmp/$hive.hive"
            python tools/registry/registry_hive.py verify "$tmp/$hive.hive"
          done
      - name: Shell and userspace unit checks
        run: |
          bash -n live-image/build.sh
          bash -n tests/services/run-service-tests.sh
          make -C userspace check
