name: OctavianOS boot target routing contracts

on:
  push:
    paths:
      - 'boot/**/*.cfg'
      - 'boot/iso/grub.cfg'
      - 'tests/boot/**'
      - 'docs/BOOT_SEQUENCE_TRACE.md'
      - 'kernel/**'
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/SNAPSHOT-MANIFEST.json'
      - 'vendor/chimera-ii-os/source/tests/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/koronos/**'
      - 'vendor/chimera-ii-os/source/boot/**'
      - 'vendor/chimera-ii-os/source/desktop/aurora/gates_menu.json'
      - 'editions/mobile/**'
      - 'tools/release/**'
      - 'tests/qemu/**'
      - 'Dockerfile'
      - 'web/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'boot/**/*.cfg'
      - 'boot/iso/grub.cfg'
      - 'tests/boot/**'
      - 'docs/BOOT_SEQUENCE_TRACE.md'
      - 'kernel/**'
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/SNAPSHOT-MANIFEST.json'
      - 'vendor/chimera-ii-os/source/tests/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/koronos/**'
      - 'vendor/chimera-ii-os/source/boot/**'
      - 'vendor/chimera-ii-os/source/desktop/aurora/gates_menu.json'
      - 'editions/mobile/**'
      - 'tools/release/**'
      - 'tests/qemu/**'
      - 'Dockerfile'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed userspace handoff evidence verifier
        run: python3 -m unittest discover -s tests/migration -p "test_userspace_handoff_verifier.py" -v
      - name: Install GRUB parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes grub-common
      - name: Parse all tracked GRUB scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            grub-script-check "$file"
          done < <(find boot -type f -name '*.cfg' -print | sort)
      - name: Validate complete configfile target graph
        run: python3 tests/boot/test_boot_target_graph.py
      - name: Validate native installer payload routing
        run: python3 tests/boot/test_installer_payload_routing.py
      - name: Test ISO payload validator
        run: python3 tests/boot/test_iso_payload_validator.py
      - name: Test OctavianOS splash and progress contracts
        run: python3 tests/boot/test_octavian_splash_progress.py
      - name: Validate splash helper shell syntax
        run: bash -n tools/boot/octavian-progress.sh tools/artwork/rebrand-init-video.sh
      - name: Smoke-test desktop companion container
        run: |
          set -euo pipefail
          docker build --pull -t octavianos-desktop-preview:ci .
          cid="$(docker run -d -p 127.0.0.1:8080:80 octavianos-desktop-preview:ci)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/octavianos-index.html; then break; fi
            sleep 1
          done
          grep -q 'OctavianOS' /tmp/octavianos-index.html

  native-koronos-smoke:
    name: Native Koronos x86_64 build and QEMU kernel smoke (not release acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and boot tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm binutils python3 grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools qemu-system-x86
      - name: Build Koronos and run its host subsystem tests
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash kernel/build-koronos.sh
          test -s build/koronos/x86_64/koronos.elf
      - name: Validate ELF and Multiboot2 entry
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          python3 tools/koronos/validate_elf.py build/koronos/x86_64/koronos.elf
          readelf -h build/koronos/x86_64/koronos.elf
          grub-file --is-x86-multiboot2 build/koronos/x86_64/koronos.elf
      - name: Boot Koronos in QEMU and require its kernel readiness marker
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          smoke=build/qemu-smoke
          mkdir -p "$smoke/iso/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$smoke/iso/boot/koronos.elf"
          cat > "$smoke/iso/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos native kernel smoke test" {
            multiboot2 /boot/koronos.elf
            boot
          }
          GRUB
          grub-mkrescue -o "$smoke/koronos-smoke.iso" "$smoke/iso"
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 512M -cdrom "$smoke/koronos-smoke.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/debugcon.log" -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e
          test -s "$smoke/debugcon.log"
          cat "$smoke/debugcon.log"
          grep -Fq '[KRN ] KORONOS READY' "$smoke/debugcon.log" || { echo "::error::Koronos did not reach its kernel readiness marker (QEMU exit $qemu_status)"; exit 1; }
          echo "Kernel-only QEMU smoke passed; this is not CPL3/userspace or production release acceptance."
      - name: Upload Koronos kernel smoke trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octavian-koronos-kernel-smoke
          path: vendor/chimera-ii-os/source/build/qemu-smoke/
          if-no-files-found: warn
          retention-days: 30
