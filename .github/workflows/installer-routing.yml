name: OctavianOS boot target routing contracts

on:
  push:
    paths:
      - 'boot/**/*.cfg'
      - 'boot/iso/grub.cfg'
      - 'tests/boot/**'
      - 'docs/BOOT_SEQUENCE_TRACE.md'
      - 'kernel/**'
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/tests/**'
      - 'editions/mobile/**'
      - 'tools/release/**'
      - 'tests/qemu/**'
      - 'Dockerfile'
      - 'web/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'boot/**/*.cfg'
      - 'boot/iso/grub.cfg'
      - 'tests/boot/**'
      - 'docs/BOOT_SEQUENCE_TRACE.md'
      - 'kernel/**'
      - 'editions/mobile/**'
      - 'tools/release/**'
      - 'tests/qemu/**'
      - 'Dockerfile'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed userspace handoff evidence verifier
        run: python3 -m unittest discover -s tests/migration -p "test_userspace_handoff_verifier.py" -v
      - name: Install GRUB parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes grub-common
      - name: Parse all tracked GRUB scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            grub-script-check "$file"
          done < <(find boot -type f -name '*.cfg' -print | sort)
      - name: Validate complete configfile target graph
        run: python3 tests/boot/test_boot_target_graph.py
      - name: Validate native installer payload routing
        run: python3 tests/boot/test_installer_payload_routing.py
      - name: Test ISO payload validator
        run: python3 tests/boot/test_iso_payload_validator.py
      - name: Test vendored ISO artwork and native init artifact contract
        run: python3 tests/boot/test_vendored_iso_artwork_contract.py -v
      - name: Test OctavianOS splash and progress contracts
        run: python3 tests/boot/test_octavian_splash_progress.py
      - name: Validate splash helper shell syntax
        run: bash -n tools/boot/octavian-progress.sh tools/artwork/rebrand-init-video.sh
      - name: Smoke-test desktop companion container
        run: |
          set -euo pipefail
          docker build --pull -t octavianos-desktop-preview:ci .
          cid="$(docker run -d -p 127.0.0.1:8080:80 octavianos-desktop-preview:ci)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/octavianos-index.html; then break; fi
            sleep 1
          done
          grep -q 'OctavianOS' /tmp/octavianos-index.html

  vendored-koronos-build:
    name: Vendored Koronos native build and target ELF outputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential binutils nasm python3 grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools busybox-static cpio ffmpeg imagemagick unzip python3-cairosvg
      - name: Run canonical Koronos build and all source-contract tests
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash kernel/build-koronos.sh
          test -s build/koronos/x86_64/koronos.elf
          for target in live installer recovery; do
            artifact="build/koronos/x86_64/user-init-$target.elf"
            if [[ ! -s "$artifact" ]]; then
              echo "::error::Missing target-specific native-init artifact: $artifact"
              find build/koronos/x86_64 -maxdepth 1 -type f -printf '%f\\n' | sort
              exit 1
            fi
          done
          test -s build/koronos/x86_64/user-init-timeout.elf
          # Exercise the real ISO producer after the native kernel and target
          # probes have been built; source-only contract checks are insufficient
          # to catch artwork or module packaging regressions.
          (
            cd "$GITHUB_WORKSPACE"
            python3 tools/runtime/train_runtime_rnn.py --epochs 2 --hidden 8 --output runtime/cognition/trained-command-isa-rnn.json
            python3 tools/runtime/stage_native_command_runtime.py
          )
          bash tools/build-live-boot-binaries.sh
          bash boot/iso/build-iso.sh
          iso=boot/iso/dist/output.iso
          test -s "$iso"
          inspect=build/iso-artwork-inspect
          mkdir -p "$inspect"
          xorriso -osirrox on -indev "$iso" -extract /boot/visual/octavian-octopus-aurora.png "$inspect/octavian-octopus-aurora.png" >/dev/null
          test -s "$inspect/octavian-octopus-aurora.png"
          cmp "$inspect/octavian-octopus-aurora.png" boot/iso/dist/iso/boot/visual/octavian-octopus-aurora.png
