name: Registry, SMB, Directory and Optical Integration
on:
  pull_request:
    paths:
      - "vendor/chimera-ii-os/source/services/registry/**"
      - "vendor/chimera-ii-os/source/services/network/**"
      - "vendor/chimera-ii-os/source/services/storage/**"
      - "vendor/chimera-ii-os/source/system/integrations/**"
      - "vendor/chimera-ii-os/source/system/registry/**"
      - "vendor/chimera-ii-os/source/system/filevendor/chimera-ii-os/source/system/**"
      - "vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/desktop/aurora-shell/**"
      - "vendor/chimera-ii-os/source/desktop/aurora/**"
      - "vendor/chimera-ii-os/source/live-image/**"
      - "vendor/chimera-ii-os/source/tools/filevendor/chimera-ii-os/source/system/**"
      - "vendor/chimera-ii-os/source/tools/registry/**"
      - "vendor/chimera-ii-os/source/tests/integrations/**"
      - "vendor/chimera-ii-os/source/tests/vendor/chimera-ii-os/source/services/**"
      - "vendor/chimera-ii-os/source/tests/vendor/chimera-ii-os/source/system/**"
      - "vendor/chimera-ii-os/source/userspace/systemd/**"
      - "vendor/chimera-ii-os/source/platform/systemd/**"
      - ".github/workflows/integrations-contract.yml"
  push:
    branches: [main]
    paths:
      - "vendor/chimera-ii-os/source/services/registry/**"
      - "vendor/chimera-ii-os/source/services/network/**"
      - "vendor/chimera-ii-os/source/services/storage/**"
      - "vendor/chimera-ii-os/source/system/integrations/**"
      - "vendor/chimera-ii-os/source/system/registry/**"
      - "vendor/chimera-ii-os/source/system/filevendor/chimera-ii-os/source/system/**"
      - "vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/desktop/aurora-shell/**"
      - "vendor/chimera-ii-os/source/desktop/aurora/**"
      - "vendor/chimera-ii-os/source/live-image/**"
      - "vendor/chimera-ii-os/source/tools/filevendor/chimera-ii-os/source/system/**"
      - "vendor/chimera-ii-os/source/tools/registry/**"
      - "vendor/chimera-ii-os/source/tests/integrations/**"
      - "vendor/chimera-ii-os/source/tests/vendor/chimera-ii-os/source/services/**"
      - "vendor/chimera-ii-os/source/tests/vendor/chimera-ii-os/source/system/**"
      - "vendor/chimera-ii-os/source/userspace/systemd/**"
      - "vendor/chimera-ii-os/source/platform/systemd/**"
      - ".github/workflows/integrations-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax (all integration entry points)
        run: |
          find vendor/chimera-ii-os/source/services vendor/chimera-ii-os/source/tools vendor/chimera-ii-os/source/live-image -type f -name '*.py' -print0 |
            xargs -0 -r python -m py_compile
      - name: Integration regression tests
        run: python -m unittest discover -s vendor/chimera-ii-os/source/tests/integrations -v
      - name: Registry, directory, optical and FHS service tests
        run: bash vendor/chimera-ii-os/source/tests/vendor/chimera-ii-os/source/services/run-service-tests.sh
      - name: Aurora JavaScript syntax
        run: |
          node --check vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/desktop/aurora-shell/assets/apps-registry.js
          node --check vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/desktop/aurora-shell/assets/apps-windows-network.js
          node --check vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/desktop/aurora-shell/assets/apps-optical-media.js
          node --check vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/web/system-services.js
      - name: Validate JSON contracts and staged paths
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("vendor/chimera-ii-os/source/system/integrations").glob("*.json"):
              json.loads(path.read_text())
          services = json.loads(pathlib.Path("vendor/chimera-ii-os/source/services/service_registry.json").read_text())
          ids = {x["id"] for x in services["services"]}
          required = {"registry", "smb-server", "smb-discovery", "directory-services", "optical-media"}
          assert required <= ids, required - ids
          index = pathlib.Path("vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/desktop/aurora-shell/index.html").read_text()
          for name in ("apps-registry.js", "apps-windows-network.js", "apps-optical-media.js"):
              assert name in index, name
          build = pathlib.Path("vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/live-image/build.sh").read_text()
          for name in ("registryd.py", "registry-editor-api.py", "registry-editor-launcher.py",
                       "registry-editor.html", "smb-browse.py", "directoryctl.py",
                       "directory-discovery.py", "mount-image.py"):
              assert name in build, name
          web = pathlib.Path("vendor/chimera-ii-os/source/web/index.html").read_text()
          assert "system-services.js" in web and 'id="view-system"' in web
          print("integration contracts: OK")
          PY
      - name: Shell syntax
        run: |
          bash -n vendor/chimera-ii-os/source/vendor/chimera-ii-os/source/live-image/build.sh
          bash -n vendor/chimera-ii-os/source/tests/vendor/chimera-ii-os/source/services/run-service-tests.sh
          make -C vendor/chimera-ii-os/source/userspace check
