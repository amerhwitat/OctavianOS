name: Native Koronos kernel build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/isa/**'
      - 'vendor/chimera-ii-os/source/data/isa/**'
      - 'vendor/chimera-ii-os/source/tools/build-live-boot-binaries.sh'
      - 'vendor/chimera-ii-os/source/tools/build-boot-artifacts.sh'
      - 'vendor/chimera-ii-os/source/tools/boot/**'
      - 'vendor/chimera-ii-os/source/tools/aurora/**'
      - 'vendor/chimera-ii-os/source/tools/generate-aurora-media.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/build-iso.sh'






      - 'vendor/chimera-ii-os/source/boot/iso/prepare-layout.sh'
      - 'vendor/chimera-ii-os/source/tools/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/tools/commands/test-chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/share/chimera/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/sbin/chimera-cpu-mode'
      - 'vendor/chimera-ii-os/source/rootfs/etc/chimera/commands/registry.tsv'
      - 'vendor/chimera-ii-os/source/tools/commands/**'
      - 'vendor/chimera-ii-os/source/src/chimera-command-compat/**'
      - 'vendor/chimera-ii-os/source/build-chimera-iso.sh'
      - 'vendor/chimera-ii-os/source/.github/workflows/isa-command-runtime-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/machine-code-pipeline-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/koronos-process-loader.yml'
      - '.github/workflows/native-koronos-build.yml'
  pull_request:
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/isa/**'
      - 'vendor/chimera-ii-os/source/data/isa/**'
      - 'vendor/chimera-ii-os/source/tools/build-live-boot-binaries.sh'
      - 'vendor/chimera-ii-os/source/tools/build-boot-artifacts.sh'
      - 'vendor/chimera-ii-os/source/tools/boot/**'
      - 'vendor/chimera-ii-os/source/tools/aurora/**'
      - 'vendor/chimera-ii-os/source/tools/generate-aurora-media.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/build-iso.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/prepare-layout.sh'
      - 'vendor/chimera-ii-os/source/tools/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/tools/commands/test-chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/share/chimera/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/sbin/chimera-cpu-mode'
      - 'vendor/chimera-ii-os/source/rootfs/etc/chimera/commands/registry.tsv'
      - 'vendor/chimera-ii-os/source/tools/commands/**'
      - 'vendor/chimera-ii-os/source/src/chimera-command-compat/**'
      - 'vendor/chimera-ii-os/source/build-chimera-iso.sh'
      - 'vendor/chimera-ii-os/source/.github/workflows/isa-command-runtime-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/machine-code-pipeline-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/koronos-process-loader.yml'
      - '.github/workflows/native-koronos-build.yml'

permissions:
  contents: write

concurrency:
  group: native-koronos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-koronos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout OctavianOS
        uses: actions/checkout@v4
      - name: Install native kernel build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm binutils python3 grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools qemu-system-x86 ovmf busybox-static cpio ffmpeg imagemagick unzip
      - name: Build freestanding Koronos x86_64 ELF
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash kernel/build-koronos.sh
          test -s build/koronos/x86_64/koronos.elf
      - name: Validate ELF and Multiboot2 entry contract
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          python3 tools/koronos/validate_elf.py build/koronos/x86_64/koronos.elf
          readelf -h build/koronos/x86_64/koronos.elf
          grub-file --is-x86-multiboot2 build/koronos/x86_64/koronos.elf
          nm -a --defined-only build/koronos/x86_64/koronos.elf > build/koronos/x86_64/symbols.txt
          grep -q 'chimera_process_admit_elf' build/koronos/x86_64/symbols.txt
          grep -q 'chimera_sched_run_parallel' build/koronos/x86_64/symbols.txt
      - name: Boot kernel in QEMU and require Koronos readiness marker
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          smoke=build/qemu-smoke
          mkdir -p "$smoke/iso/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$smoke/iso/boot/koronos.elf"
          cat > "$smoke/iso/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos native kernel smoke test" {
            multiboot2 /boot/koronos.elf
            boot
          }
          GRUB
          grub-mkrescue -o "$smoke/koronos-smoke.iso" "$smoke/iso"
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 512M -cdrom "$smoke/koronos-smoke.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/debugcon.log" -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e
          # A running idle kernel is intentionally stopped by timeout (124).
          # Any exit status is acceptable only if the kernel's own readiness marker appeared.
          if [[ ! -f "$smoke/debugcon.log" ]]; then echo "::error::QEMU produced no debugcon log"; exit 1; fi
          cat "$smoke/debugcon.log"
          grep -Fq '[KRN ] KORONOS READY' "$smoke/debugcon.log" || { echo "::error::Koronos did not reach its readiness marker (QEMU exit $qemu_status)"; exit 1; }
      - name: Upload QEMU kernel smoke trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-qemu-smoke-trace
          path: |
            vendor/chimera-ii-os/source/build/qemu-smoke/debugcon.log
            vendor/chimera-ii-os/source/build/qemu-smoke/koronos-smoke.iso
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Live and Jasper recovery initramfs payloads
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash tools/build-live-boot-binaries.sh
          live=build/live-boot/boot/live/chimera-live-initramfs.img
          recovery=build/live-boot/boot/recovery/chimera-recovery-initramfs.img
          test -s "$live"
          test -s build/live-boot/boot/live/live-manifest.json
          test -s "$recovery"
          test -s build/live-boot/boot/recovery/recovery-manifest.json
          gzip -t "$live"
          gzip -t "$recovery"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/live-boot")
          for rel in ("boot/live/live-manifest.json", "boot/recovery/recovery-manifest.json"):
              json.loads((root / rel).read_text(encoding="utf-8"))
          for arch in ("arm64", "armv7", "x86_64"):
              manifest = json.loads((root / "mobile" / arch / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["verified_binary_generation"] is False, (arch, manifest)
              runtime = root / "mobile" / arch / "koronos-runtime.elf"
              if arch != "x86_64":
                  assert not runtime.exists(), f"incorrect cross-architecture kernel artifact: {runtime}"
          print("Live/recovery initramfs archives and boot manifests validated; mobile targets remain explicitly unverified.")
          PY
      - name: Upload Live and recovery boot payloads
        uses: actions/upload-artifact@v4
        with:
          name: koronos-live-recovery-payloads
          path: |
            vendor/chimera-ii-os/source/build/live-boot/boot/koronos/koronos.elf
            vendor/chimera-ii-os/source/build/live-boot/boot/live/chimera-live-initramfs.img
            vendor/chimera-ii-os/source/build/live-boot/boot/live/live-manifest.json
            vendor/chimera-ii-os/source/build/live-boot/boot/recovery/chimera-recovery-initramfs.img
            vendor/chimera-ii-os/source/build/live-boot/boot/recovery/recovery-manifest.json
            vendor/chimera-ii-os/source/build/live-boot/mobile/*/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Build native BIOS/UEFI ISO candidate from source
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash boot/iso/build-iso.sh
          iso=boot/iso/dist/output.iso
          test -s "$iso"
          (cd "$(dirname "$iso")" && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256")
          xorriso -indev "$iso" -report_el_torito plain -report_system_area plain | tee boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          grep -q 'El Torito' boot/iso/dist/ISO-BOOT-REPORT-CI.txt
      - name: Boot the complete ISO in BIOS and UEFI modes
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -uo pipefail
          smoke=build/qemu-smoke
          iso=boot/iso/dist/output.iso
          mkdir -p "$smoke"
          test -s "$iso"
          # Fail early on missing handoff assets, and retain the actual staged menu for diagnosis.
          test -s boot/iso/dist/iso/boot/grub/grub.cfg
          test -s boot/iso/dist/iso/boot/koronos/koronos.elf
          test -s boot/iso/dist/iso/boot/live/chimera-live-initramfs.img
          test -s boot/iso/dist/iso/boot/live/live-manifest.json
          test -s boot/iso/dist/iso/boot/recovery/chimera-recovery-initramfs.img
          test -s boot/iso/dist/iso/boot/recovery/recovery-manifest.json
          test -s boot/iso/dist/iso/install/installer/installation.img
          test -s boot/iso/dist/iso/install/installer/installation-manifest.json
          test -s boot/iso/dist/iso/install/installer/installer-contract.json
          test -s boot/iso/dist/iso/install/installer/installation_phases.json
          test -s boot/iso/dist/iso/install/installer/installer_profiles.json
          grep -q '3840x2160' boot/iso/dist/iso/boot/grub/grub.cfg
          grep -q '1024x768' boot/iso/dist/iso/boot/grub/grub.cfg
          grep -q '640x480' boot/iso/dist/iso/boot/grub/grub.cfg
          grep -q 'configfile /boot/installation/menu.cfg' boot/iso/dist/iso/boot/grub/grub.cfg
          grep -q 'module2 /install/installer/installation.img chimera-installation-image' boot/iso/dist/iso/boot/jasper/install.cfg
          grep -q 'Mobile boot is unavailable in this build' boot/iso/dist/iso/boot/grub/grub.cfg
          for cfg in boot/iso/grub.cfg boot/jasper/jasper.cfg boot/jasper/live.cfg boot/jasper/install.cfg boot/installation/menu.cfg boot/spitfire/spitfire-menu.cfg; do
            grub-script-check "$cfg"
          done
          cp boot/iso/dist/iso/boot/grub/grub.cfg "$smoke/staged-grub.cfg"
          set +e
          timeout 25s qemu-system-x86_64 -machine q35 -m 1024 -vga std -cdrom "$iso" -boot d -display none -serial "file:$smoke/full-iso-bios-serial.log" -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/full-iso-bios-debugcon.log" -global isa-debugcon.iobase=0xe9 -d guest_errors,cpu_reset -D "$smoke/full-iso-bios-qemu.log"
          bios_status=$?
          # Prefer the non-Secure-Boot firmware pair, matching the disk image size.
          ovmf_code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE_4M.fd' -print -quit)"
          ovmf_vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS_4M.fd' -print -quit)"
          if [[ -z "$ovmf_code" || -z "$ovmf_vars" ]]; then
            ovmf_code="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE.fd' -print -quit)"
            ovmf_vars="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS.fd' -print -quit)"
          fi
          if [[ -z "$ovmf_code" || -z "$ovmf_vars" ]]; then
            echo "::error::OVMF firmware files are missing; installed package contents:"
            dpkg -L ovmf || true
            exit 1
          fi
          cp "$ovmf_vars" "$smoke/OVMF_VARS.fd"
          timeout 25s qemu-system-x86_64 -machine q35 -m 1024 -vga std -drive if=pflash,format=raw,readonly=on,file="$ovmf_code" -drive if=pflash,format=raw,file="$smoke/OVMF_VARS.fd" -cdrom "$iso" -boot order=d -display none -serial "file:$smoke/full-iso-uefi-serial.log" -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/full-iso-uefi-debugcon.log" -global isa-debugcon.iobase=0xe9 -d guest_errors,cpu_reset -D "$smoke/full-iso-uefi-qemu.log"
          uefi_status=$?
          set -e
          echo "BIOS QEMU exit: $bios_status; UEFI QEMU exit: $uefi_status"
          for mode in bios uefi; do
            trace="$smoke/full-iso-$mode-debugcon.log"
            if ! grep -Fq '[KRN ] KORONOS READY' "$trace" 2>/dev/null; then
              echo "::error::$mode ISO boot did not reach the Koronos readiness marker"
              [[ -f "$smoke/full-iso-$mode-serial.log" ]] && tail -100 "$smoke/full-iso-$mode-serial.log" || true
              [[ -f "$smoke/full-iso-$mode-qemu.log" ]] && tail -100 "$smoke/full-iso-$mode-qemu.log" || true
              exit 1
            fi
          done
          # Test target routing through each possible top-level menu configuration, with GRUB output mirrored to serial.
          original_cfg="$smoke/staged-grub.cfg"
          if [[ ! -s "$original_cfg" ]]; then cp boot/iso/dist/iso/boot/grub/grub.cfg "$original_cfg"; fi
          original_jasper_cfg="$smoke/original-jasper.cfg"
          original_install_cfg="$smoke/original-installation-menu.cfg"
          cp boot/iso/dist/iso/boot/jasper/jasper.cfg "$original_jasper_cfg"
          cp boot/iso/dist/iso/boot/installation/menu.cfg "$original_install_cfg"
          original_jasper_install_cfg="$smoke/original-jasper-install.cfg"
          cp boot/iso/dist/iso/boot/jasper/install.cfg "$original_jasper_install_cfg"
          for target in live install recovery; do
            case "$target" in
              live) main_index=0; jasper_index=0; install_index=2 ;;
              install) main_index=2; jasper_index=1; install_index=0 ;;
              recovery) main_index=5; jasper_index=2; install_index=1 ;;
            esac
            sed -E "s/^set default=.*/set default=$main_index/" "$original_cfg" > "$smoke/target-grub.cfg"
            printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n' >> "$smoke/target-grub.cfg"
            cp "$smoke/target-grub.cfg" boot/iso/dist/iso/boot/grub/grub.cfg
            cp "$smoke/target-grub.cfg" boot/iso/dist/iso/boot/jasper/grub.cfg
            sed -E "s/^set default=.*/set default=$jasper_index/" "$original_jasper_cfg" > "$smoke/target-jasper.cfg"
            printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n' >> "$smoke/target-jasper.cfg"
            cp "$smoke/target-jasper.cfg" boot/iso/dist/iso/boot/jasper/jasper.cfg
            { printf 'set timeout=0\nset default=%s\n' "$install_index"; cat "$original_install_cfg"; printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n'; } > "$smoke/target-installation-menu.cfg"
            cp "$smoke/target-installation-menu.cfg" boot/iso/dist/iso/boot/installation/menu.cfg
            if [[ "$target" == recovery ]]; then
              cat > "$smoke/target-jasper-install.cfg" <<'EOF'
          set timeout=0
          set default=0
          insmod normal
          insmod multiboot2
          insmod serial
          serial --unit=0 --speed=115200
          terminal_output --append serial
          menuentry "QEMU recovery target" {
            multiboot2 /boot/koronos/koronos.elf chm.log=verbose chm.progress=events
            module2 /boot/recovery/chimera-recovery-initramfs.img chimera-recovery-initramfs
            module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
            boot
          }
          EOF
            else
              { printf 'set timeout=0\nset default=%s\n' "$install_index"; cat "$original_jasper_install_cfg"; printf '\ninsmod serial\nserial --unit=0 --speed=115200\nterminal_output --append serial\n'; } > "$smoke/target-jasper-install.cfg"
            fi
            cp "$smoke/target-jasper-install.cfg" boot/iso/dist/iso/boot/jasper/install.cfg
            grub-mkrescue -o "$smoke/target-$target.iso" boot/iso/dist/iso
            set +e
            timeout 15s qemu-system-x86_64 -machine q35 -m 1024 -vga std -cdrom "$smoke/target-$target.iso" -boot d -display none -serial "file:$smoke/target-$target-serial.log" -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/target-$target-debugcon.log" -global isa-debugcon.iobase=0xe9
            target_status=$?
            set -e
            trace="$smoke/target-$target-debugcon.log"
            grep -Fq '[KRN ] KORONOS READY' "$trace" || { echo "::error::$target menu did not reach Koronos (QEMU exit $target_status)"; tail -100 "$smoke/target-$target-serial.log" || true; exit 1; }
            case "$target" in
              live)
                grep -Fq '[LIVE] Live initramfs module accepted' "$trace" || { echo "::error::Live menu loaded the wrong target payload"; tail -100 "$smoke/target-live-serial.log" || true; exit 1; }
                grep -Fq 'USERSPACE NOT READY' "$trace" || { echo "::error::Live target must report the real userspace readiness boundary"; exit 1; }
                ;;
              install)
                grep -Fq '[INST] Installer target detected' "$trace" || { echo "::error::Installer menu did not hand off installer modules"; tail -100 "$smoke/target-install-serial.log" || true; exit 1; }
                grep -Fq 'installer userspace NOT READY' "$trace" || { echo "::error::Installer readiness was falsely reported"; exit 1; }
                ;;
              recovery)
                grep -Fq '[RECV] Recovery initramfs and manifest accepted' "$trace" || { echo "::error::Recovery menu did not hand off recovery modules"; tail -100 "$smoke/target-recovery-serial.log" || true; exit 1; }
                grep -Fq 'Recovery userspace NOT READY' "$trace" || { echo "::error::Recovery readiness was falsely reported"; exit 1; }
                ;;
            esac
          done
          cp "$original_cfg" boot/iso/dist/iso/boot/iso/dist/iso/boot/grub/grub.cfg
          cp "$original_cfg" boot/iso/dist/iso/boot/iso/dist/iso/boot/jasper/grub.cfg
          cp "$original_jasper_cfg" boot/iso/dist/iso/boot/iso/dist/iso/boot/jasper/jasper.cfg
          cp "$original_install_cfg" boot/iso/dist/iso/boot/installation/menu.cfg
          cp "$original_jasper_install_cfg" boot/iso/dist/iso/boot/jasper/install.cfg
      - name: Upload full ISO QEMU traces and staged boot contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octavianos-full-iso-qemu-traces
          path: |
            vendor/chimera-ii-os/source/build/qemu-smoke/full-iso-*
            vendor/chimera-ii-os/source/build/qemu-smoke/staged-grub.cfg
            vendor/chimera-ii-os/source/build/qemu-smoke/OVMF_VARS.fd
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload native ISO candidate for review (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octavianos-native-iso-candidate
          path: |
            vendor/chimera-ii-os/source/boot/iso/dist/output.iso
            vendor/chimera-ii-os/source/boot/iso/dist/output.iso.sha256
            vendor/chimera-ii-os/source/boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload validated kernel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: koronos-x86_64-elf
          path: |
            vendor/chimera-ii-os/source/build/koronos/x86_64/koronos.elf
            vendor/chimera-ii-os/source/build/koronos/x86_64/symbols.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish OctavianOS native ISO candidate to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          iso=boot/iso/dist/output.iso
          (cd boot/iso/dist && sha256sum -c output.iso.sha256)
          tag="native-iso-${GITHUB_SHA::12}"
          assets=(
            "$iso"
            "$iso.sha256"
            boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          )
          notes="Native x86_64 BIOS/UEFI ISO candidate built from OctavianOS commit $GITHUB_SHA and its vendored Chimera II OS source snapshot. CI validates the ISO boot records, checksum, and Koronos kernel readiness under QEMU. This is a development prerelease; it does not claim that Aurora desktop, installer completion, or all userspace services are fully validated."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --draft=false --prerelease \
              --title "OctavianOS native ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "OctavianOS native ISO candidate (${GITHUB_SHA::7})" \
              --notes "$notes"
          fi
