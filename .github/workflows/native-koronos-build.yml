name: Native Koronos kernel build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/isa/**'
      - 'vendor/chimera-ii-os/source/data/isa/**'
      - '.github/workflows/native-koronos-build.yml'
  pull_request:
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/isa/**'
      - 'vendor/chimera-ii-os/source/data/isa/**'
      - '.github/workflows/native-koronos-build.yml'

permissions:
  contents: read

concurrency:
  group: native-koronos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-koronos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout OctavianOS
        uses: actions/checkout@v4
      - name: Install native kernel build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm binutils python3 grub-common
      - name: Build freestanding Koronos x86_64 ELF
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash kernel/build-koronos.sh
          test -s build/koronos/x86_64/koronos.elf
      - name: Validate ELF and Multiboot2 entry contract
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          python3 tools/koronos/validate_elf.py build/koronos/x86_64/koronos.elf
          readelf -h build/koronos/x86_64/koronos.elf
          grub-file --is-x86-multiboot2 build/koronos/x86_64/koronos.elf
          nm -a --defined-only build/koronos/x86_64/koronos.elf > build/koronos/x86_64/symbols.txt
          grep -q 'chimera_process_admit_elf' build/koronos/x86_64/symbols.txt
          grep -q 'chimera_sched_run_parallel' build/koronos/x86_64/symbols.txt
      - name: Upload validated kernel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: koronos-x86_64-elf
          path: |
            vendor/chimera-ii-os/source/build/koronos/x86_64/koronos.elf
            vendor/chimera-ii-os/source/build/koronos/x86_64/symbols.txt
          if-no-files-found: error
          retention-days: 14
