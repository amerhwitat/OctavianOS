name: Native Koronos kernel build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/isa/**'
      - 'vendor/chimera-ii-os/source/tests/isa/**'
      - 'vendor/chimera-ii-os/source/tools/cognition/**'
      - 'vendor/chimera-ii-os/source/data/isa/**'
      - 'vendor/chimera-ii-os/source/tools/build-live-boot-binaries.sh'
      - 'vendor/chimera-ii-os/source/tools/build-boot-artifacts.sh'
      - 'vendor/chimera-ii-os/source/tools/boot/**'
      - 'vendor/chimera-ii-os/source/tools/aurora/**'
      - 'vendor/chimera-ii-os/source/tools/generate-aurora-media.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/build-iso.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/**'
      - 'vendor/chimera-ii-os/source/boot/jasper/**'
      - 'vendor/chimera-ii-os/source/boot/installation/**'
      - 'tests/boot/**'
      - 'tools/boot/**'
      - 'desktop/aurora/assets/**'
      - 'tools/boot/**'
      - 'desktop/aurora/assets/**'
      - 'tests/migration/**'






      - 'vendor/chimera-ii-os/source/boot/iso/prepare-layout.sh'
      - 'vendor/chimera-ii-os/source/tools/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/tools/commands/test-chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/share/chimera/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/sbin/chimera-cpu-mode'
      - 'vendor/chimera-ii-os/source/rootfs/etc/chimera/commands/registry.tsv'
      - 'vendor/chimera-ii-os/source/tools/commands/**'
      - 'vendor/chimera-ii-os/source/src/chimera-command-compat/**'
      - 'vendor/chimera-ii-os/source/build-chimera-iso.sh'
      - 'vendor/chimera-ii-os/source/.github/workflows/isa-command-runtime-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/machine-code-pipeline-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/koronos-process-loader.yml'
      - 'runtime/commands/**'
      - 'runtime/isa/**'
      - 'tools/runtime/**'
      - 'tests/runtime/**'
      - '.github/workflows/native-koronos-build.yml'
  pull_request:
    paths:
      - 'vendor/chimera-ii-os/source/kernel/**'
      - 'vendor/chimera-ii-os/source/tools/isa/**'
      - 'vendor/chimera-ii-os/source/data/isa/**'
      - 'vendor/chimera-ii-os/source/tests/isa/**'
      - 'vendor/chimera-ii-os/source/tools/build-live-boot-binaries.sh'
      - 'vendor/chimera-ii-os/source/tools/build-boot-artifacts.sh'
      - 'vendor/chimera-ii-os/source/tools/boot/**'
      - 'vendor/chimera-ii-os/source/tools/aurora/**'
      - 'vendor/chimera-ii-os/source/tools/generate-aurora-media.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/build-iso.sh'
      - 'vendor/chimera-ii-os/source/boot/iso/**'
      - 'vendor/chimera-ii-os/source/boot/jasper/**'
      - 'vendor/chimera-ii-os/source/boot/installation/**'
      - 'tests/boot/**'
      - 'tools/boot/**'
      - 'desktop/aurora/assets/**'
      - 'vendor/chimera-ii-os/source/boot/iso/prepare-layout.sh'
      - 'vendor/chimera-ii-os/source/tools/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/tools/commands/test-chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/share/chimera/commands/chimera-cpu-mode.py'
      - 'vendor/chimera-ii-os/source/rootfs/usr/sbin/chimera-cpu-mode'
      - 'vendor/chimera-ii-os/source/rootfs/etc/chimera/commands/registry.tsv'
      - 'vendor/chimera-ii-os/source/tools/commands/**'
      - 'vendor/chimera-ii-os/source/src/chimera-command-compat/**'
      - 'vendor/chimera-ii-os/source/build-chimera-iso.sh'
      - 'vendor/chimera-ii-os/source/.github/workflows/isa-command-runtime-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/machine-code-pipeline-ci.yml'
      - 'vendor/chimera-ii-os/source/.github/workflows/koronos-process-loader.yml'
      - 'tests/migration/**'
      - '.github/workflows/native-koronos-build.yml'

permissions:
  contents: write

concurrency:
  group: native-koronos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-koronos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout OctavianOS
        uses: actions/checkout@v4
      - name: Install native kernel build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm binutils python3 grub-common grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools qemu-system-x86 busybox-static cpio ffmpeg imagemagick unzip python3-cairosvg
      - name: Build freestanding Koronos x86_64 ELF
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash kernel/build-koronos.sh
          test -s build/koronos/x86_64/koronos.elf
      - name: Validate ELF and Multiboot2 entry contract
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          python3 tools/koronos/validate_elf.py build/koronos/x86_64/koronos.elf
          readelf -h build/koronos/x86_64/koronos.elf
          grub-file --is-x86-multiboot2 build/koronos/x86_64/koronos.elf
          nm -a --defined-only build/koronos/x86_64/koronos.elf > build/koronos/x86_64/symbols.txt
          grep -q 'chimera_process_admit_elf' build/koronos/x86_64/symbols.txt
          grep -q 'chimera_sched_run_parallel' build/koronos/x86_64/symbols.txt
      - name: Compile and run Multiboot2 live/recovery module classification tests
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I kernel/include kernel/tests/multiboot_modules_test.cpp kernel/core/multiboot_modules.cpp -o /tmp/octavian-multiboot-modules-test
          /tmp/octavian-multiboot-modules-test
      - name: Boot kernel in QEMU and require Koronos readiness marker
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          smoke=build/qemu-smoke
          mkdir -p "$smoke/iso/boot/grub"
          cp build/koronos/x86_64/koronos.elf "$smoke/iso/boot/koronos.elf"
          cat > "$smoke/iso/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Koronos native kernel smoke test" {
            multiboot2 /boot/koronos.elf
            boot
          }
          GRUB
          grub-mkrescue -o "$smoke/koronos-smoke.iso" "$smoke/iso"
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 512M -cdrom "$smoke/koronos-smoke.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/debugcon.log" -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e
          # A running idle kernel is intentionally stopped by timeout (124).
          # Any exit status is acceptable only if the kernel's own readiness marker appeared.
          if [[ ! -f "$smoke/debugcon.log" ]]; then echo "::error::QEMU produced no debugcon log"; exit 1; fi
          cat "$smoke/debugcon.log"
          grep -Fq '[KRN ] KORONOS READY' "$smoke/debugcon.log" || { echo "::error::Koronos did not reach its readiness marker (QEMU exit $qemu_status)"; exit 1; }
      - name: Upload QEMU kernel smoke trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-qemu-smoke-trace
          path: |
            vendor/chimera-ii-os/source/build/qemu-smoke/debugcon.log
            vendor/chimera-ii-os/source/build/qemu-smoke/koronos-smoke.iso
          if-no-files-found: ignore
          retention-days: 7
      - name: Train and validate catalog-grounded RNN language model
        run: |
          set -euo pipefail
          python3 -m py_compile tools/runtime/train_runtime_rnn.py tools/runtime/mark_runtime_smoke_tested.py vendor/chimera-ii-os/source/tools/cognition/trainable_rnn_lm.py tests/runtime/test_train_runtime_rnn.py tests/runtime/test_mark_runtime_smoke_tested.py
          python3 -m unittest discover -s tests/runtime -p "test_train_runtime_rnn.py" -v
          python3 -m unittest discover -s tests/runtime -p "test_mark_runtime_smoke_tested.py" -v
          python3 -m unittest discover -s tests/migration -p "test_userspace_handoff_verifier.py" -v
          python3 -m unittest discover -s tests/migration -p "test_userspace_release_gate_workflow.py" -v
          (cd vendor/chimera-ii-os/source && python3 -m unittest tools.cognition.test_trainable_rnn_lm -v && python3 -m unittest tools.isa.test_rv32i_execution_vectors -v)
          (cd vendor/chimera-ii-os/source && python3 -m unittest tests/isa/test_import_riscv_opcodes.py -v)
          (cd vendor/chimera-ii-os/source && python3 tools/isa/validate_rv32_machine_tested_subset.py)
          python3 tools/runtime/train_runtime_rnn.py --epochs 2 --hidden 8 --output runtime/cognition/trained-command-isa-rnn.json | tee /tmp/octavian-rnn-training.json
          grep -q '"status": "trained-and-roundtrip-validated"' /tmp/octavian-rnn-training.json || grep -q '"status":"trained-and-roundtrip-validated"' /tmp/octavian-rnn-training.json
          test -s runtime/cognition/trained-command-isa-rnn.json
          test -s runtime/cognition/runtime-capabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/cognition/trained-command-isa-rnn.json").read_text())
          m=d["metadata"]
          assert d["model_type"] == "trained-character-level-vanilla-RNN"
          assert m["training_sequences"] >= 100 and m["command_rows"] >= 1000 and m["isa_rows"] >= 1000
          assert m["loss_first"] >= 0 and m["loss_last"] >= 0 and m["loss_last"] < m["loss_first"], "training loss did not improve"
          print("RNN model metadata validated:", {k:m[k] for k in ("training_sequences","command_rows","isa_rows","epochs","loss_first","loss_last","corpus_sha256")})
          PY
      - name: Stage Octavian command and ISA learning runtime into native rootfs
        run: |
          set -euo pipefail
          python3 tools/runtime/stage_native_command_runtime.py
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/commands/native-command-candidates.json
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/commands/command_candidate_router.py
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/commands/local_llm.py
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/commands/trainable_rnn_lm.py
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/cognition/trained-command-isa-rnn.json
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/cognition/runtime-capabilities.json
          grep -q -- "--rnn-model" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-command
          grep -q -- "--rnn-model" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-isa
          OCTAVIAN_ROOT_PREFIX="$PWD/vendor/chimera-ii-os/source/rootfs" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-command "list files" --limit 5 --queue /tmp/octavian-command-pending.jsonl > /tmp/octavian-command-rnn.json
          grep -q '"mode": "trained-character-rnn"' /tmp/octavian-command-rnn.json
          OCTAVIAN_ROOT_PREFIX="$PWD/vendor/chimera-ii-os/source/rootfs" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-isa "riscv add" --limit 5 --queue /tmp/octavian-isa-pending.jsonl > /tmp/octavian-isa-rnn.json
          grep -q '"mode": "trained-character-rnn"' /tmp/octavian-isa-rnn.json
          python3 tools/runtime/mark_runtime_smoke_tested.py runtime/cognition/runtime-capabilities.json
          python3 tools/runtime/stage_native_command_runtime.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for root in (Path("vendor/chimera-ii-os/source/rootfs"), Path("vendor/chimera-ii-os/source/build/live-boot/initramfs/root")):
              report=json.loads((root/"usr/share/octavian/cognition/runtime-capabilities.json").read_text())
              assert report["host_router_smoke_tested_in_ci"] is True
              assert report["in_os_execution_verified"] is False
              assert report["kernel_userspace_ready_verified"] is False
          PY
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/isa/local_llm.py
          test -s vendor/chimera-ii-os/source/rootfs/usr/share/octavian/isa/universal-instruction-catalog.json
          test -x vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-command
          test -x vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-isa
      - name: Upload trained catalog RNN model
        uses: actions/upload-artifact@v4
        with:
          name: Octavian-Trained-Command-ISA-RNN-${{ github.sha }}
          path: |
            runtime/cognition/trained-command-isa-rnn.json
            runtime/cognition/runtime-capabilities.json
          if-no-files-found: error
          retention-days: 30
      - name: Build Live and Jasper recovery initramfs payloads
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash tools/build-live-boot-binaries.sh
          live=build/live-boot/boot/live/chimera-live-initramfs.img
          live_cpio=build/live-boot/boot/live/chimera-live-initramfs.cpio
          recovery=build/live-boot/boot/recovery/chimera-recovery-initramfs.img
          recovery_cpio=build/live-boot/boot/recovery/chimera-recovery-initramfs.cpio
          installer=build/live-boot/boot/installer/chimera-installer-initramfs.img
          installer_cpio=build/live-boot/boot/installer/chimera-installer-initramfs.cpio
          test -s "$live_cpio"
          test -s "$recovery_cpio"
          test -s "$installer"
          test -s "$installer_cpio"
          python3 - "$live_cpio" "$recovery_cpio" "$installer_cpio" <<'PY'
          import sys
          from pathlib import Path
          for name in sys.argv[1:]:
              data = Path(name).read_bytes()
              assert data.startswith(b"070701"), f"{name} is not raw newc CPIO"
          print("Native VFS root archives verified as raw newc CPIO.")
          PY
          build/koronos/x86_64/vfs-cpio-test "$live_cpio"
          build/koronos/x86_64/vfs-cpio-test "$recovery_cpio"
          build/koronos/x86_64/vfs-cpio-test "$installer_cpio"
          test -s "$live"
          test -s build/live-boot/boot/live/live-manifest.json
          test -s "$recovery"
          test -s build/live-boot/initramfs/root/usr/share/octavian/commands/command_candidate_router.py
          test -s build/live-boot/initramfs/root/usr/share/octavian/commands/local_llm.py
          test -s build/live-boot/initramfs/root/usr/share/octavian/cognition/trained-command-isa-rnn.json
          test -s build/live-boot/initramfs/root/usr/share/octavian/cognition/runtime-capabilities.json
          test -s build/live-boot/initramfs/root/usr/share/octavian/isa/trainable_rnn_lm.py
          test -s build/live-boot/initramfs/root/usr/share/octavian/isa/isa_candidate_router.py
          test -x build/live-boot/initramfs/root/usr/bin/octavian-learn-command
          test -s build/live-boot/initramfs/recovery/usr/share/octavian/commands/command_candidate_router.py
          test -s build/live-boot/initramfs/recovery/usr/share/octavian/isa/isa_candidate_router.py
          test -x build/live-boot/initramfs/recovery/usr/bin/octavian-learn-isa
          test -s build/live-boot/boot/recovery/recovery-manifest.json
          gzip -t "$live"
          gzip -t "$recovery"
          gzip -t "$installer"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/live-boot")
          for rel in ("boot/live/live-manifest.json", "boot/recovery/recovery-manifest.json"):
              json.loads((root / rel).read_text(encoding="utf-8"))
          for arch in ("arm64", "armv7", "x86_64"):
              manifest = json.loads((root / "mobile" / arch / "manifest.json").read_text(encoding="utf-8"))
              assert manifest["verified_binary_generation"] is False, (arch, manifest)
              runtime = root / "mobile" / arch / "koronos-runtime.elf"
              if arch != "x86_64":
                  assert not runtime.exists(), f"incorrect cross-architecture kernel artifact: {runtime}"
          print("Live/recovery initramfs archives and boot manifests validated; mobile targets remain explicitly unverified.")
          PY
      - name: Upload Live and recovery boot payloads
        uses: actions/upload-artifact@v4
        with:
          name: koronos-live-recovery-payloads
          path: |
            vendor/chimera-ii-os/source/build/live-boot/boot/koronos/koronos.elf
            vendor/chimera-ii-os/source/build/live-boot/boot/live/chimera-live-initramfs.img
            vendor/chimera-ii-os/source/build/live-boot/boot/live/chimera-live-initramfs.cpio
            vendor/chimera-ii-os/source/build/live-boot/boot/live/live-manifest.json
            vendor/chimera-ii-os/source/build/live-boot/boot/installer/chimera-installer-initramfs.img
            vendor/chimera-ii-os/source/build/live-boot/boot/installer/chimera-installer-initramfs.cpio
            vendor/chimera-ii-os/source/build/live-boot/boot/recovery/chimera-recovery-initramfs.img
            vendor/chimera-ii-os/source/build/live-boot/boot/recovery/chimera-recovery-initramfs.cpio
            vendor/chimera-ii-os/source/build/live-boot/boot/recovery/recovery-manifest.json
            vendor/chimera-ii-os/source/build/live-boot/mobile/*/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate Octavian Octopus artwork renderer
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/boot -p test_boot_artwork_renderer.py -v
          python3 tools/boot/render_boot_artwork.py --source desktop/aurora/assets/octavian-octopus-aurora.svg --output /tmp/octavian-octopus-aurora.png
          test -s /tmp/octavian-octopus-aurora.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/octavian-octopus-aurora.png")
          data=p.read_bytes()
          assert data.startswith(b"\x89PNG\r\n\x1a\n"), "rendered Octavian artwork is not PNG"
          assert len(data) > 1024, "rendered Octavian artwork is unexpectedly small"
          print("Octavian firmware artwork render verified:", len(data), "bytes")
          PY
      - name: Build native BIOS/UEFI ISO candidate from source
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          bash boot/iso/build-iso.sh
          iso=boot/iso/dist/output.iso
          test -s "$iso"
          (cd "$(dirname "$iso")" && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256")
          xorriso -indev "$iso" -report_el_torito plain -report_system_area plain | tee boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          grep -q 'El Torito' boot/iso/dist/ISO-BOOT-REPORT-CI.txt
      - name: Verify Octavian artwork inside the final ISO
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          iso=boot/iso/dist/output.iso
          inspect=build/iso-artwork-inspect
          mkdir -p "$inspect/visual" "$inspect/grub" "$inspect/stages"
          for path in \
            "/boot/visual/octavian-octopus-aurora.png" \
            "/boot/visual/octavian-artwork-manifest.json" \
            "/boot/visual/aurora-boot.png" \
            "/boot/grub/grub.cfg" \
            "/boot/spitfire/aurora-boot.png" \
            "/boot/jasper/aurora-boot.png" \
            "/boot/grub/aurora-boot.png" \
            "/boot/koronos/aurora-boot.png"; do
            out="$inspect/${path#/boot/}"
            mkdir -p "$(dirname "$out")"
            xorriso -osirrox on -indev "$iso" -extract "$path" "$out" >/dev/null
            test -s "$out" || { echo "ERROR: final ISO missing $path" >&2; exit 2; }
          done
          cmp "$inspect/visual/octavian-octopus-aurora.png" "$inspect/visual/aurora-boot.png"
          cmp "$inspect/visual/octavian-octopus-aurora.png" "$inspect/spitfire/aurora-boot.png"
          cmp "$inspect/visual/octavian-octopus-aurora.png" "$inspect/jasper/aurora-boot.png"
          cmp "$inspect/visual/octavian-octopus-aurora.png" "$inspect/grub/aurora-boot.png"
          cmp "$inspect/visual/octavian-octopus-aurora.png" "$inspect/koronos/aurora-boot.png"
          grep -q 'background_image --mode stretch /boot/visual/aurora-boot.png' "$inspect/grub/grub.cfg"
      - name: QEMU recovery target routing smoke test (no repair claim)
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          smoke=build/qemu-smoke
          mkdir -p "$smoke/recovery-tree/boot/grub"
          cp -a boot/iso/dist/iso/. "$smoke/recovery-tree/"
          cat > "$smoke/recovery-tree/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Recovery module smoke" --id recovery {
            multiboot2 /boot/koronos/koronos.elf
            module2 /boot/recovery/chimera-recovery-initramfs.cpio chimera-recovery-initramfs
            module2 /boot/recovery/user-init-recovery.elf chimera-user-init-elf target=recovery
            module2 /boot/recovery/recovery-manifest.json chimera-recovery-manifest
            boot
          }
          GRUB
          grub-mkrescue -o "$smoke/recovery-smoke.iso" "$smoke/recovery-tree"
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 1024 -cdrom "$smoke/recovery-smoke.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/recovery-debugcon.log" -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e
          test -s "$smoke/recovery-debugcon.log" || { echo "::error::Recovery QEMU trace missing (exit $qemu_status)"; exit 1; }
          grep -Fq '[REC ] Recovery initramfs module recognized' "$smoke/recovery-debugcon.log" || { cat "$smoke/recovery-debugcon.log"; echo "::error::Recovery target module was not recognized"; exit 1; }
          grep -Fq 'USER INIT SYSCALL: target=recovery init_pid=' "$smoke/recovery-debugcon.log" || { cat "$smoke/recovery-debugcon.log"; echo "::error::Recovery init never acknowledged a CPL3 syscall"; exit 1; }
          grep -Fq 'NATIVE INIT PID: target=recovery pid=' "$smoke/recovery-debugcon.log" || { cat "$smoke/recovery-debugcon.log"; echo "::error::Recovery init did not report the kernel-returned PID"; exit 1; }
          grep -Fq 'NATIVE INIT BLOCKED:' "$smoke/recovery-debugcon.log" || { cat "$smoke/recovery-debugcon.log"; echo "::error::Recovery native services did not fail closed"; exit 1; }
          grep -Fq '[RUN ] ERROR: userspace init exited before its target-specific USERSPACE READY handshake' "$smoke/recovery-debugcon.log" || { cat "$smoke/recovery-debugcon.log"; echo "::error::Recovery init did not report fail-closed readiness rejection"; exit 1; }
      - name: QEMU installer target routing smoke test (no disk writes)
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          smoke=build/qemu-smoke
          mkdir -p "$smoke/installer-tree/boot/grub"
          cp -a boot/iso/dist/iso/. "$smoke/installer-tree/"
          cat > "$smoke/installer-tree/boot/grub/grub.cfg" <<'GRUB'
          set timeout=0
          set default=0
          terminal_output console
          menuentry "Installer module smoke" --id install {
            multiboot2 /boot/koronos/koronos.elf
            module2 /boot/installer/user-init-installer.elf chimera-user-init-elf target=installer
            module2 /install/installer/installation.img chimera-installation-image
            module2 /install/installer/installation-manifest.json chimera-installation-manifest
            module2 /install/installer/installer-contract.json chimera-installer-contract
            module2 /install/installer/installation_phases.json chimera-install-phases
            module2 /install/installer/installer_profiles.json chimera-installer-profiles
            boot
          }
          GRUB
          grub-mkrescue -o "$smoke/installer-smoke.iso" "$smoke/installer-tree"
          set +e
          timeout 12s qemu-system-x86_64 -machine q35 -m 1024 -cdrom "$smoke/installer-smoke.iso" -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/installer-debugcon.log" -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e
          test -s "$smoke/installer-debugcon.log" || { echo "::error::Installer QEMU trace missing (exit $qemu_status)"; exit 1; }
          grep -Fq '[INST] Installer target detected' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer image module was not recognized"; exit 1; }
          grep -Fq '[INST] Installation image accepted' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer image payload was not accepted"; exit 1; }
          grep -Fq 'USER INIT SYSCALL: target=installer init_pid=' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer native init did not execute a CPL3 syscall"; exit 1; }
          grep -Fq 'NATIVE INIT PID: target=installer pid=' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer native init did not report kernel-returned PID"; exit 1; }
          grep -Fq 'NATIVE INIT BLOCKED:' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer native init did not fail closed on unavailable services"; exit 1; }
          grep -Fq '[RUN ] ERROR: userspace init exited before its target-specific USERSPACE READY handshake' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer init did not fail closed before readiness"; exit 1; }
          grep -Fq 'USER INIT SYSCALL: target=installer init_pid=' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer init never acknowledged a CPL3 syscall"; exit 1; }
          grep -Fq 'NATIVE INIT PID: target=installer pid=' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer init did not report the kernel-returned PID"; exit 1; }
          grep -Fq 'NATIVE INIT BLOCKED:' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer native services did not fail closed"; exit 1; }
          grep -Fq '[RUN ] Installer target init failed before readiness; failing closed' "$smoke/installer-debugcon.log" || { cat "$smoke/installer-debugcon.log"; echo "::error::Installer target did not fail closed after the readiness handshake was withheld"; exit 1; }
      - name: Boot the complete ISO and require Koronos readiness
        working-directory: vendor/chimera-ii-os/source
        run: |
          set -euo pipefail
          smoke=build/qemu-smoke
          mkdir -p "$smoke"
          set +e
          timeout 25s qemu-system-x86_64 -machine q35 -m 1024 -cdrom boot/iso/dist/output.iso -boot d -display none -serial none -monitor none -no-reboot -no-shutdown -debugcon "file:$smoke/full-iso-debugcon.log" -global isa-debugcon.iobase=0xe9
          qemu_status=$?
          set -e
          test -s "$smoke/full-iso-debugcon.log" || { echo "::error::Full ISO produced no debugcon trace (QEMU exit $qemu_status)"; exit 1; }
          cat "$smoke/full-iso-debugcon.log"
          grep -Fq '[KRN ] KORONOS READY' "$smoke/full-iso-debugcon.log" || { echo "::error::Full ISO did not reach Koronos readiness (QEMU exit $qemu_status)"; exit 1; }
      - name: Upload Live, Installer, and Recovery QEMU traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octavianos-full-iso-qemu-trace
          path: |
            vendor/chimera-ii-os/source/build/qemu-smoke/full-iso-debugcon.log
            vendor/chimera-ii-os/source/build/qemu-smoke/installer-debugcon.log
            vendor/chimera-ii-os/source/build/qemu-smoke/recovery-debugcon.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload native ISO candidate for review (not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octavianos-native-iso-candidate
          path: |
            vendor/chimera-ii-os/source/boot/iso/dist/output.iso
            vendor/chimera-ii-os/source/boot/iso/dist/output.iso.sha256
            vendor/chimera-ii-os/source/boot/iso/dist/ISO-BOOT-REPORT-CI.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload validated kernel build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koronos-x86_64-elf
          path: |
            vendor/chimera-ii-os/source/build/koronos/x86_64/koronos.elf
            vendor/chimera-ii-os/source/build/koronos/x86_64/symbols.txt
          if-no-files-found: error
          retention-days: 14

  verify-userspace-handoff:
    name: Verify real Live, Installer, and Recovery userspace
    needs: build-koronos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OctavianOS verifier
        uses: actions/checkout@v4
      - name: Download Live, Installer, and Recovery QEMU traces
        uses: actions/download-artifact@v4
        with:
          name: octavianos-full-iso-qemu-trace
          path: trace
      - name: Require actual user-mode init acknowledgement for every target
        run: |
          set -uo pipefail
          result=0
          python3 tests/migration/verify-userspace-handoff.py live trace/full-iso-debugcon.log || result=1
          python3 tests/migration/verify-userspace-handoff.py installer trace/installer-debugcon.log || result=1
          python3 tests/migration/verify-userspace-handoff.py recovery trace/recovery-debugcon.log || result=1
          exit "$result"

  publish-native-iso:
    name: Publish prerelease only after userspace acceptance
    needs: [build-koronos, verify-userspace-handoff]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download reviewed native ISO candidate
        uses: actions/download-artifact@v4
        with:
          name: octavianos-native-iso-candidate
          path: dist
      - name: Verify checksum and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c output.iso.sha256
          tag="native-iso-${GITHUB_SHA::12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" output.iso output.iso.sha256 ISO-BOOT-REPORT-CI.txt --clobber
            gh release edit "$tag" --draft=false --prerelease --title "OctavianOS native ISO candidate (${GITHUB_SHA::7})" --notes "Development prerelease. Published only after Live, Installer, and Recovery userspace handoff gates pass."
          else
            gh release create "$tag" output.iso output.iso.sha256 ISO-BOOT-REPORT-CI.txt --target "$GITHUB_SHA" --prerelease --title "OctavianOS native ISO candidate (${GITHUB_SHA::7})" --notes "Development prerelease. Published only after Live, Installer, and Recovery userspace handoff gates pass."
          fi
