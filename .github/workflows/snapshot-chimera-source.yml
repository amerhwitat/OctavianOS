name: Snapshot ChimeraIIOS source into OctavianOS

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snapshot-chimera-source.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or tag to snapshot
        required: true
        default: main
        type: string
      include_media:
        description: Include original artwork and media assets
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chimera-source-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout OctavianOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact ChimeraIIOS tree bytes
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chimera-source chimera-source.git
          git init --bare chimera-source.git
          git -C chimera-source.git remote add origin https://github.com/amerhwitat/ChimeraIIOS.git
          git -C chimera-source.git fetch --depth=1 origin "$SOURCE_REF"
          source_sha="$(git -C chimera-source.git rev-parse FETCH_HEAD)"
          mkdir -p chimera-source
          git -C chimera-source.git archive "$source_sha" | tar -x -C chimera-source
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Exact upstream tree: $source_sha"
      - name: Snapshot source without flattening into active runtime
        env:
          INCLUDE_MEDIA: ${{ github.event_name == 'push' || inputs.include_media }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          dest=vendor/chimera-ii-os/source
          mkdir -p "$dest"
          rsync -a --delete --exclude='.git/' chimera-source/ "$dest/"
          if [[ "$INCLUDE_MEDIA" != "true" ]]; then find "$dest" -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.mp3' -o -iname '*.wav' \) -delete; fi
          # Keep committed bytes identical to the upstream tree: disable Git eol/text filters
          # for the vendored source while leaving this metadata outside the parity root.
          printf 'source/** -text\n' > vendor/chimera-ii-os/.gitattributes
          file_count="$(find "$dest" -type f | wc -l | tr -d ' ')"
          SOURCE_SHA="$SOURCE_SHA" FILE_COUNT="$file_count" python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              "schema_version": 1,
              "source_repository": "https://github.com/amerhwitat/ChimeraIIOS",
              "source_ref": os.environ["SOURCE_REF"],
              "source_commit": os.environ["SOURCE_SHA"],
              "snapshot_file_count": int(os.environ["FILE_COUNT"]),
              "includes_media": os.environ["INCLUDE_MEDIA"].lower() == "true",
              "scope": "source snapshot; not yet a compiled or runtime-integrated port",
              "history_preserved": False
          }
          Path("vendor/chimera-ii-os/SNAPSHOT-MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          test "$file_count" -gt 100
          python3 -m json.tool vendor/chimera-ii-os/SNAPSHOT-MANIFEST.json >/dev/null
          echo "Source snapshot: $source_sha ($file_count files)" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce byte-for-byte path and SHA-256 parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 tools/migration/chimera-source-inventory.py \
            --upstream chimera-source \
            --vendored vendor/chimera-ii-os/source \
            --upstream-revision "$SOURCE_SHA" \
            --output reports/chimera-source-snapshot-inventory.json \
            --strict
      - name: Commit exact snapshot and open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OCTAVIANOS_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="migration/chimera-source-snapshot-$(date +%s)"
          git checkout -b "$branch"
          git add -A -f vendor/chimera-ii-os reports/chimera-source-snapshot-inventory.json
          git commit -m "chore(migration): snapshot ChimeraIIOS source with exact bytes"
          rm -rf verify-committed && mkdir -p verify-committed
          git archive HEAD vendor/chimera-ii-os/source | tar -x -C verify-committed
          python3 tools/migration/chimera-source-inventory.py \
            --upstream chimera-source \
            --vendored verify-committed/vendor/chimera-ii-os/source \
            --upstream-revision "$SOURCE_SHA" \
            --output reports/chimera-source-committed-inventory.json \
            --strict
          git push origin "$branch"
          cat > pr-body.md <<'EOF'
          This PR snapshots exact upstream tree bytes from the selected public ChimeraIIOS ref under `vendor/chimera-ii-os/source/` and records the exact upstream commit in `SNAPSHOT-MANIFEST.json`.

          Strict path and SHA-256 parity is enforced twice: once on the working tree and once on the committed tree via `git archive`. All vendored source is stored with text/EOL filters disabled so committed bytes match upstream bytes. This is not a completed port: the code is intentionally isolated from active OctavianOS runtime paths until each component has been reviewed, licensed, mapped, built, and tested. Git history is not included; use the separate history importer when preserving refs is required.
          EOF
          gh pr create --repo amerhwitat/OctavianOS --base main --head "$branch" \
            --title 'Import ChimeraIIOS source snapshot for OctavianOS port' \
            --body-file pr-body.md
      - name: Upload strict snapshot inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-source-snapshot-inventories
          path: reports/chimera-source-*-inventory.json
          if-no-files-found: warn
