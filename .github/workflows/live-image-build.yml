name: OctavianOS live ISO and fullscreen desktop validation

on:
  push:
    branches: [main, 'fix/live-image-fullscreen-app-bundle-*']
    paths:
      - 'live-image/**'
      - 'tests/live-image/**'
      - 'web/**'
      - 'desktop/**'
      - 'vendor/chimera-ii-os/source/desktop/app-icons/**'
      - 'apps/**'
      - 'applications/**'
      - 'appcenter/**'
      - 'iso/manifests/**'
      - '.github/workflows/live-image-build.yml'
  pull_request:
    paths:
      - 'live-image/**'
      - 'tests/live-image/**'
      - 'web/**'
      - 'desktop/**'
      - 'apps/**'
      - 'applications/**'
      - 'appcenter/**'
      - 'iso/manifests/**'
      - '.github/workflows/live-image-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after all ISO and desktop checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-image-octavian-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build OctavianOS live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install current stable Rust toolchain for source-built terminals
        uses: dtolnay/rust-toolchain@stable


      - name: Install host ISO and graphical smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools imagemagick python3 python3-gi gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 openbox x11-utils xdotool xvfb dbus-x11 \
            debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools imagemagick python3 python3-gi gir1.2-gtk-3.0 \
            gcc-14-i686-linux-gnu gcc-14-arm-linux-gnueabi gcc-14-aarch64-linux-gnu gcc-14-arm-linux-gnueabihf gcc-14-riscv64-linux-gnu gcc-14-powerpc64le-linux-gnu gcc-14-s390x-linux-gnu binutils qemu-user-static \
            git g++ cargo rustc cmake ninja-build pkg-config python3-venv python3-pip nodejs \
            autoconf automake libtool meson golang-go libncurses-dev libreadline-dev \
            libvte-2.91-dev libvte-2.91-gtk4-dev blueprint-compiler libpcre2-dev libpixman-1-dev libfcft-dev libtllist-dev libutf8proc-dev \
            libgtk-4-dev libadwaita-1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libvulkan-dev qt6-base-dev qt6-declarative-dev \
            libdbus-1-dev libssl-dev libasound2-dev libpulse-dev libxrandr-dev \
            libxi-dev libxinerama-dev libxcursor-dev libxext-dev libxrender-dev \
            libxfixes-dev libxdamage-dev libxcomposite-dev \
            gir1.2-webkit2-4.1 openbox x11-utils xdotool xvfb dbus-x11 curl minisign

      - name: Validate desktop source and application catalogs
        run: |
          set -euo pipefail
          python3 -m py_compile live-image/lib/aurora-kiosk.py live-image/lib/patch_html.py live-image/lib/export-aurora-icons.py live-image/lib/export-app-icon-theme.py
          bash -n live-image/lib/stage-command-isa-catalogs.sh live-image/build.sh live-image/lib/build-terminal-shell-sources.sh
          python3 -m json.tool desktop/optional_apps_catalog.json >/dev/null
          if [[ "octavian" == "chimera" ]]; then
            python3 -m json.tool applications/catalog.json >/dev/null
            python3 -m json.tool appcenter/catalog/apps.json >/dev/null
          else
            python3 -m json.tool apps/desktop-application-catalog.json >/dev/null
            python3 -m json.tool vendor/chimera-ii-os/source/desktop/optional_apps_catalog.json >/dev/null
          fi

      - name: Verify kiosk fullscreen at 1280x720
        run: |
          chmod +x tests/live-image/test-aurora-fullscreen.sh
          xvfb-run -a -s "-screen 0 1280x720x24" \
            tests/live-image/test-aurora-fullscreen.sh "file://${GITHUB_WORKSPACE}/desktop/aurora-wayland-glass/index.html"

      - name: Verify kiosk fullscreen at 1920x1080
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            tests/live-image/test-aurora-fullscreen.sh "file://${GITHUB_WORKSPACE}/desktop/aurora-wayland-glass/index.html"

      - name: Build the complete live ISO from this repository revision
        env:
          BUILD_ROOT: ${{ runner.temp }}/aurora-live-build
          OUT_DIR: ${{ runner.temp }}/aurora-live-output
        run: |
          set -euo pipefail
          sudo env "PATH=$PATH" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" bash live-image/build.sh octavian
          # The builder runs as root to configure the chroot; restore runner
          # ownership so the validation and artifact-upload steps can read it.
          sudo chown -R "$(id -u):$(id -g)" "$OUT_DIR"
          test -s "$OUT_DIR/octavian-os-live-amd64.iso"

      - name: Validate ISO checksum, firmware boot entries and embedded application bundle
        env:
          OUT_DIR: ${{ runner.temp }}/aurora-live-output
          ISO_NAME: octavian-os-live-amd64.iso
        run: |
          set -euo pipefail
          iso="$OUT_DIR/$ISO_NAME"
          (cd "$OUT_DIR" && sha256sum --check "$ISO_NAME.sha256")
          xorriso -indev "$iso" -report_el_torito plain -report_system_area plain -print '' | tee "$OUT_DIR/ISO-BOOT-REPORT.txt"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs "$tmp/filesystem.squashfs" >/dev/null
          # Extract as root so security.capability and other privileged xattrs are restored;
          # do not weaken the image by disabling xattr preservation in the validator.
          sudo unsquashfs -d "$tmp/root" "$tmp/filesystem.squashfs" >/dev/null
          root="$tmp/root"
          test -x "$root/usr/bin/openbox"
          test -x "$root/usr/bin/xprop"
          test -x "$root/usr/local/bin/aurora-session"
          test -s "$root/opt/aurora/application-bundle.json"
          test -d "$root/opt/aurora/app-catalogs"
          test -s "$root/opt/aurora/terminal-shell-provider-verification.json"
          python3 - "$root/opt/aurora/terminal-shell-provider-verification.json" <<'PY'
          import json, pathlib, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert manifest["schema"] == "octavian-terminal-shell-provider-verification/v1"
          assert manifest["required"] == 28 == manifest["verified"], manifest
          assert len(manifest["providers"]) == 28
          print("Verified all 28 terminal/shell provider files and target ELF/script architecture contracts.")
          PY
          test -s "$root/opt/aurora/catalog-provenance/command-isa-manifest.json"
          test -s "$root/opt/aurora/catalog-provenance/command-isa.SHA256SUMS"
          test -s "$root/opt/aurora/ISA.csv"
          test -d "$root/opt/aurora/system/commands"
          test -d "$root/opt/aurora/isa"
          python3 - "$root/opt/aurora" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "catalog-provenance/command-isa-manifest.json").read_text())
          assert manifest["schema"] == "octavian-command-isa-catalogues/v1"
          assert manifest["command_catalogue_revision"] == "9331eb2bc8722630e6a3d7f9c010bf01b95ed4fa"
          assert manifest["binary_status"].startswith("catalogue-data-only")
          assert manifest["json_catalogue_count"] > 0
          for rel in manifest["catalogue_roots"]:
              assert (root / rel).is_dir(), f"missing staged catalogue root: {rel}"
          print("Verified staged command/ISA catalogues:", manifest["json_catalogue_count"])
          PY
          test -d "$root/opt/aurora/apps/native/aurora"
          test -s "$root/usr/share/icons/chimera-aurora/manifest.json"
          test -d "$root/opt/aurora/desktop/aurora-shell/assets/icons/generated"
          python3 - "$root/usr/share/icons/chimera-aurora" "$root/opt/aurora/desktop/aurora-shell/assets/icons/generated" <<'PY'
          import json, pathlib, sys
          theme, desktop = map(pathlib.Path, sys.argv[1:])
          manifest = json.loads((theme / "manifest.json").read_text())
          assert manifest["schema"] == "CHIMERA-AURORA-ICON-EXPORT-1"
          assert manifest["count"] > 0, "empty Aurora icon theme"
          for icon in manifest["icons"]:
              path = theme / icon["file"]
              assert path.is_file(), f"missing theme icon: {path}"
              assert (desktop / path.name).is_file(), f"missing desktop icon asset: {path.name}"
          print(f"Verified {manifest['count']} generated Aurora SVG icons in GTK and desktop assets.")
          PY
          test -s "$root/opt/aurora/desktop/app-icons/catalog.svg"
          test -s "$root/opt/aurora/desktop/app-icons/manifest.json"
          python3 - "$root/usr/share/icons/hicolor/scalable/apps" "$root/opt/aurora/desktop/app-icons" <<'PY'
          import json, pathlib, sys
          theme, desktop = map(pathlib.Path, sys.argv[1:])
          source = json.loads((desktop / "manifest.json").read_text())
          exported = json.loads((desktop / "export-manifest.json").read_text())
          assert source["count"] == 133 == len(source["apps"]), "source app-icon manifest count mismatch"
          assert exported["count"] == source["count"], "not all original app icons were exported"
          assert len(exported["icons"]) == len(source["apps"])
          for icon in exported["icons"]:
              assert (theme / icon["file"]).is_file(), f"missing hicolor icon: {icon['file']}"
              assert (desktop / "icons" / icon["file"]).is_file(), f"missing desktop icon: {icon['file']}"
          print(f"Verified all {exported['count']} original Aurora app artwork symbols.")
          PY
          grep -Fq 'Openbox window manager ready' "$root/usr/local/bin/aurora-session"
          python3 - "$root/opt/aurora" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "application-bundle.json").read_text())
          assert manifest["schema"] == "aurora-offline-application-bundle-v1"
          for relative in manifest["catalog_files"]:
              path = root / "app-catalogs" / relative
              assert path.is_file(), f"missing catalog: {relative}"
              if path.suffix == ".json":
                  json.loads(path.read_text())
          assert (root / "repo").is_dir(), "full source snapshot missing"
          print(f"Embedded {len(manifest['catalog_files'])} offline application catalogs.")
          PY
          cp "$iso" "$OUT_DIR/octavian-os-live-desktop-fixed.iso"
          cp "$iso.sha256" "$OUT_DIR/octavian-os-live-desktop-fixed.iso.sha256"

      - name: Upload verified live ISO candidate
        uses: actions/upload-artifact@v4
        with:
          name: octavian-os-live-desktop-fixed
          path: |
            ${{ runner.temp }}/aurora-live-output/octavian-os-live-amd64.iso
            ${{ runner.temp }}/aurora-live-output/octavian-os-live-amd64.iso.sha256
            ${{ runner.temp }}/aurora-live-output/ISO-BOOT-REPORT.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified OctavianOS live ISO
    needs: [build]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: octavian-os-live-desktop-fixed
          path: release-assets
      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso="$(find release-assets -maxdepth 1 -type f -name '*.iso' ! -name '*.sha256' -print -quit)"
          checksum="$(find release-assets -maxdepth 1 -type f -name '*.iso.sha256' -print -quit)"
          report="$(find release-assets -maxdepth 1 -type f -name 'ISO-BOOT-REPORT.txt' -print -quit)"
          test -s "$iso" && test -s "$checksum" && test -s "$report"
          version="$(date -u +%Y.%m.%d)"
          short="${GITHUB_SHA:0:12}"
          tag="octavian-os-live-${version}-desktop-${short}"
          gh release create "$tag" "$iso" "$checksum" "$report" \
            --repo "$GITHUB_REPOSITORY" \
            --title "OctavianOS ${version} — fullscreen desktop fix" \
            --notes "Rebuilt from commit ${GITHUB_SHA}. Aurora desktop fullscreen is verified under Openbox at 1280x720 and 1920x1080. The ISO includes the repository source snapshot, offline application catalogs, and first-party app source. Third-party catalog entries are not represented as installed or compatibility-certified applications. This live ISO uses the Linux kernel; it is not a native Koronos production release."
