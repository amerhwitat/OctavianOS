name: OctavianOS release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0-preview.1
        required: true
        type: string
      publish:
        description: Publish GitHub Release after all OS payload gates pass
        required: true
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  container:
    name: Build desktop companion container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test web companion container
        run: |
          set -euo pipefail
          docker build --pull -t octavianos-desktop-preview:ci .
          cid="$(docker run -d -p 127.0.0.1:8080:80 octavianos-desktop-preview:ci)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do if curl --fail --silent http://127.0.0.1:8080/ -o /tmp/container-index.html; then break; fi; sleep 1; done
          grep -q 'OctavianOS' /tmp/container-index.html
          docker save octavianos-desktop-preview:ci | gzip -1 > octavianos-desktop-preview-docker.tar.gz
          sha256sum octavianos-desktop-preview-docker.tar.gz > octavianos-desktop-preview-docker.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: octavianos-desktop-preview-container
          path: |
            octavianos-desktop-preview-docker.tar.gz
            octavianos-desktop-preview-docker.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  iso:
    name: Build and validate actual OS ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require imported kernel and userspace payloads
        shell: bash
        run: |
          set -euo pipefail
          required=(build/iso-root/boot/koronos/koronos.elf build/iso-root/boot/live/chimera-live-initramfs.img build/iso-root/boot/live/live-manifest.json build/iso-root/boot/live/desktop-sessions.json build/iso-root/install/installer/installation.img build/iso-root/install/installer/installation-manifest.json build/iso-root/install/installer/installer-contract.json build/iso-root/install/installer/installation_phases.json build/iso-root/install/installer/installer_profiles.json build/iso-root/boot/recovery/chimera-recovery-initramfs.img build/iso-root/boot/recovery/recovery-manifest.json)
          missing=0
          for f in "${required[@]}"; do if [[ ! -s "$f" ]]; then echo "::error::Missing real release payload: $f"; missing=1; fi; done
          if (( missing )); then echo 'No ISO will be fabricated from placeholders. Import and port the real kernel and userspace, then rerun.'; exit 2; fi
      - name: Validate staged payloads
        run: |
          python3 tools/boot/validate_iso_payloads.py --root build/iso-root
          python3 tools/release/validate_release_inputs.py --root build/iso-root
      - name: Stage accessible installer wizard and policy into ISO
        shell: bash
        run: |
          set -euo pipefail
          DEST=build/iso-root/install/installer
          mkdir -p "$DEST/gui"
          install -m 0644 installer/cross-distro-workflow.json "$DEST/cross-distro-workflow.json"
          install -m 0644 installer/gui/aurora-installer.html "$DEST/gui/aurora-installer.html"
          install -m 0644 installer/gui/aurora-installer.css "$DEST/gui/aurora-installer.css"
          install -m 0644 installer/gui/aurora-installer.js "$DEST/gui/aurora-installer.js"
          install -m 0644 installer/gui/aurora-installer-ui.json "$DEST/gui/aurora-installer-ui.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("build/iso-root/install/installer/gui/installer-ui-manifest.json")
          p.write_text(json.dumps({
              "schema": "OCTAVIANOS-INSTALLER-UI-1",
              "entrypoint": "aurora-installer.html",
              "assets": ["aurora-installer.css", "aurora-installer.js", "aurora-installer-ui.json"],
              "execution": "review-only",
              "native_transaction_backend": "not-integrated",
              "installation_success_claimed": False
          }, indent=2) + "\n", encoding="utf-8")
          PY
          test -s "$DEST/gui/aurora-installer.html"
          test -s "$DEST/gui/aurora-installer.js"
          sha256sum "$DEST/cross-distro-workflow.json" "$DEST/gui/aurora-installer.html" "$DEST/gui/aurora-installer.css" "$DEST/gui/aurora-installer.js" "$DEST/gui/aurora-installer-ui.json" > "$DEST/gui/SHA256SUMS"
      - name: Build bootable ISO
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools
          mkdir -p build/iso-root/boot/grub
          cp boot/iso/grub.cfg build/iso-root/boot/grub/grub.cfg
          grub-mkrescue -o octavianos-release.iso build/iso-root
          test -s octavianos-release.iso
          sha256sum octavianos-release.iso > octavianos-iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: octavianos-release-iso
          path: |
            octavianos-release.iso
            octavianos-iso.sha256
          if-no-files-found: error
          retention-days: 30

  production-acceptance:
    name: Require exact-ISO DAPS production evidence
    needs: [iso]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: octavianos-release-iso
          path: release-assets
      - name: Fail closed unless all six production traces and genuine SMP evidence match the release ISO
        run: |
          set -euo pipefail
          python3 scripts/daps/production_acceptance_gate.py \
            --iso release-assets/octavianos-release.iso \
            --evidence-dir production-evidence

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [container, iso, production-acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: octavianos-*
          path: release-assets
          merge-multiple: true
      - name: Publish ISO and Docker image tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then tag="$INPUT_VERSION"; fi
          test -n "$tag"
          compgen -G "release-assets/octavianos-release.iso" >/dev/null
          compgen -G "release-assets/octavianos-desktop-preview-docker.tar.gz" >/dev/null
          gh release create "$tag" release-assets/octavianos-release.iso release-assets/octavianos-iso.sha256 release-assets/octavianos-desktop-preview-docker.tar.gz release-assets/octavianos-desktop-preview-docker.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --title "OctavianOS $tag" --notes "ISO publication is gated on real native kernel, Live, installer and recovery payloads. Docker image is the web desktop companion preview, not a virtual machine or replacement for the native OS."