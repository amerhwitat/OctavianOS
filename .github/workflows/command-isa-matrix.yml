name: Native command cross-build and Linux ABI smoke matrix

on:
  push:
    paths:
      - 'runtime/commands/src/chimera-cmd.c'
      - 'runtime/catalogues/commands/chimera-command-list.json'
      - 'runtime/catalogues/commands/compatibility-binary-policy.json'
      - 'runtime/catalogues/commands/coverage.json'
      - 'tools/commands/build_linux_abi_command_matrix.py'
      - 'tests/commands/**'
      - '.github/workflows/command-isa-matrix.yml'
  pull_request:
    paths:
      - 'runtime/commands/src/chimera-cmd.c'
      - 'runtime/catalogues/commands/chimera-command-list.json'
      - 'runtime/catalogues/commands/compatibility-binary-policy.json'
      - 'runtime/catalogues/commands/coverage.json'
      - 'tools/commands/build_linux_abi_command_matrix.py'
      - 'tests/commands/**'
      - '.github/workflows/command-isa-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install eight Linux ABI cross compilers and QEMU user emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-14-i686-linux-gnu gcc-14-arm-linux-gnueabi gcc-14-aarch64-linux-gnu \
            gcc-14-arm-linux-gnueabihf gcc-14-riscv64-linux-gnu \
            gcc-14-powerpc64le-linux-gnu gcc-14-s390x-linux-gnu \
            binutils qemu-user-static
      - name: Validate mirrored command catalogue and native policy
        run: python3 tests/commands/test_native_catalogue_alignment.py
      - name: Cross-build real native multicall source for eight Linux ABIs
        run: |
          python3 tools/commands/build_linux_abi_command_matrix.py \
            --source runtime/commands/src/chimera-cmd.c \
            --policy runtime/catalogues/commands/compatibility-binary-policy.json \
            --output build/native-command-isa \
            --require-all
      - name: Execute command behavior smoke tests natively and under QEMU user mode
        run: bash tests/commands/test-native-command-matrix.sh build/native-command-isa
      - name: Upload ELF binaries, hashes and runtime-scope manifest
        uses: actions/upload-artifact@v4
        with:
          name: octavian-native-command-linux-abi-x86_64-i686-armel-aarch64-armv7-riscv64-ppc64le-s390x
          path: build/native-command-isa/
          if-no-files-found: error
          retention-days: 30
