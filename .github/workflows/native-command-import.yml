name: Native command import and RNN candidate routing
on:
  push:
    paths:
      - "runtime/commands/**"
      - "runtime/isa/**"
      - "tools/runtime/**"
      - "tests/runtime/**"
      - "vendor/chimera-ii-os/source/tools/cognition/**"
      - "vendor/chimera-ii-os/source/tools/isa/isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/rv32-machine-tested-subset.json"
      - "vendor/chimera-ii-os/source/tools/isa/validate_rv32_machine_tested_subset.py"
      - "vendor/chimera-ii-os/source/tools/isa/test_isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/import_riscv_opcodes.py"
      - "vendor/chimera-ii-os/source/tools/isa/build_universal_catalog.py"
      - "vendor/chimera-ii-os/source/tools/commands/import_command_candidates.py"
      - "vendor/chimera-ii-os/source/tools/commands/command_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/commands/test_import_command_candidates.py"
      - "vendor/chimera-ii-os/source/system/commands/**"
      - "tests/runtime/**"
      - ".github/workflows/native-command-import.yml"
  pull_request:
    paths:
      - "runtime/commands/**"
      - "runtime/isa/**"
      - "tools/runtime/**"
      - "tests/runtime/**"
      - "vendor/chimera-ii-os/source/tools/isa/isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/test_isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/import_riscv_opcodes.py"
      - "vendor/chimera-ii-os/source/tools/isa/build_universal_catalog.py"
      - "vendor/chimera-ii-os/source/tools/commands/import_command_candidates.py"
      - "vendor/chimera-ii-os/source/tools/commands/command_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/commands/test_import_command_candidates.py"
      - "vendor/chimera-ii-os/source/system/commands/**"
      - "tests/runtime/**"
      - ".github/workflows/native-command-import.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Import all vendored command candidates into Octavian native registry
        run: python3 runtime/commands/import_candidates.py
      - name: Import source-backed ISA records for Octavian
        run: |
          python3 vendor/chimera-ii-os/source/tools/isa/import_riscv_opcodes.py --output runtime/isa/riscv-opcodes.json --max-files 500
          python3 vendor/chimera-ii-os/source/tools/isa/build_universal_catalog.py --database vendor/chimera-ii-os/source/isa/isa_database.json --input runtime/isa/riscv-opcodes.json --output runtime/isa/universal-instruction-catalog.json
      - name: Validate command safety and RNN fallback
        env:
          PYTHONPATH: vendor/chimera-ii-os/source
        run: |
          python3 -m py_compile runtime/commands/import_candidates.py runtime/commands/command_candidate_router.py vendor/chimera-ii-os/source/tools/commands/import_command_candidates.py vendor/chimera-ii-os/source/tools/commands/command_candidate_router.py
          python3 -m py_compile vendor/chimera-ii-os/source/tools/cognition/local_llm.py vendor/chimera-ii-os/source/tools/cognition/test_local_llm.py vendor/chimera-ii-os/source/tools/cognition/trainable_rnn_lm.py vendor/chimera-ii-os/source/tools/isa/isa_candidate_router.py
          (cd vendor/chimera-ii-os/source && python3 -m unittest tools.cognition.test_trainable_rnn_lm -v)
          (cd vendor/chimera-ii-os/source && python3 -m unittest tools.cognition.test_local_llm -v)
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tools/commands -p test_import_command_candidates.py -v
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tools/commands -p test_command_candidate_router.py -v
          python3 -m unittest discover -s tests/runtime -p test_command_candidates.py -v
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tools/isa -p test_isa_candidate_router.py -v
          python3 vendor/chimera-ii-os/source/tools/isa/validate_rv32_machine_tested_subset.py
          python3 runtime/isa/isa_candidate_router.py "riscv add" --limit 10
          python3 tools/runtime/train_runtime_rnn.py --epochs 2 --hidden 8 --output runtime/cognition/trained-command-isa-rnn.json
          python3 -m py_compile tools/runtime/stage_native_command_runtime.py tests/runtime/test_stage_native_command_runtime.py
          python3 -m unittest discover -s tests/runtime -p test_stage_native_command_runtime.py -v
          python3 tools/runtime/stage_native_command_runtime.py
          OCTAVIAN_ROOT_PREFIX="$PWD/vendor/chimera-ii-os/source/rootfs" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-command "list files" --limit 5 --queue /tmp/octavian-command-pending.jsonl > /tmp/octavian-command-rnn.json
          grep -q '"mode": "trained-character-rnn"' /tmp/octavian-command-rnn.json
          OCTAVIAN_ROOT_PREFIX="$PWD/vendor/chimera-ii-os/source/rootfs" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-isa "riscv add" --limit 5 --queue /tmp/octavian-isa-pending.jsonl > /tmp/octavian-isa-rnn.json
          grep -q '"mode": "trained-character-rnn"' /tmp/octavian-isa-rnn.json
          python3 runtime/commands/command_candidate_router.py "list files" --limit 10
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/commands/native-command-candidates.json").read_text(encoding="utf-8"))
          assert d["counts"]["total"] == len(d["commands"])
          assert d["counts"]["native_implemented"] == 15
          assert d["counts"]["candidate_only"] > 1000
          assert all(not x["execution_allowed"] for x in d["commands"] if x["status"] == "candidate-only")
          print("Octavian native/candidate registry:", d["counts"])
          PY
      - name: Persist generated Octavian command registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/commands/native-command-candidates.json runtime/isa/riscv-opcodes.json runtime/isa/universal-instruction-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(runtime): persist imported command candidates [catalog-bot]"
            git push
          else
            echo "Octavian command registry is already current."
          fi
      - name: Upload Octavian native command registry
        uses: actions/upload-artifact@v4
        with:
          name: Octavian-Native-Command-Candidates-${{ github.sha }}
          path: |
            runtime/commands/native-command-candidates.json
            runtime/isa/riscv-opcodes.json
            runtime/isa/universal-instruction-catalog.json
            runtime/cognition/trained-command-isa-rnn.json
          if-no-files-found: error
          retention-days: 30
