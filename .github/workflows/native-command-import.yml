name: Native command import and RNN candidate routing
on:
  push:
    paths:
      - "runtime/commands/**"
      - "runtime/isa/**"
      - "tools/runtime/**"
      - "tests/runtime/**"
      - "vendor/chimera-ii-os/source/tools/cognition/**"
      - "vendor/chimera-ii-os/source/tools/isa/isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/rv32-machine-tested-subset.json"
      - "vendor/chimera-ii-os/source/tools/isa/validate_rv32_machine_tested_subset.py"
      - "vendor/chimera-ii-os/source/tools/isa/test_isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/import_riscv_opcodes.py"
      - "vendor/chimera-ii-os/source/tests/isa/test_import_riscv_opcodes.py"
      - "vendor/chimera-ii-os/source/tools/isa/build_universal_catalog.py"
      - "vendor/chimera-ii-os/source/tools/commands/import_command_candidates.py"
      - "vendor/chimera-ii-os/source/tools/commands/command_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/commands/test_import_command_candidates.py"
      - "vendor/chimera-ii-os/source/system/commands/**"
      - "vendor/chimera-ii-os/source/isa/**"
      - "tests/runtime/**"
      - ".github/workflows/native-command-import.yml"
  pull_request:
    paths:
      - "runtime/commands/**"
      - "runtime/isa/**"
      - "tools/runtime/**"
      - "tests/runtime/**"
      - "vendor/chimera-ii-os/source/tools/isa/isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/test_isa_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/isa/import_riscv_opcodes.py"
      - "vendor/chimera-ii-os/source/tests/isa/test_import_riscv_opcodes.py"
      - "vendor/chimera-ii-os/source/tools/isa/build_universal_catalog.py"
      - "vendor/chimera-ii-os/source/tools/commands/import_command_candidates.py"
      - "vendor/chimera-ii-os/source/tools/commands/command_candidate_router.py"
      - "vendor/chimera-ii-os/source/tools/commands/test_import_command_candidates.py"
      - "vendor/chimera-ii-os/source/system/commands/**"
      - "vendor/chimera-ii-os/source/isa/**"
      - "tests/runtime/**"
      - ".github/workflows/native-command-import.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Import all vendored command candidates into Octavian native registry
        run: python3 runtime/commands/import_candidates.py
      - name: Import source-backed ISA records for Octavian
        run: |
          python3 vendor/chimera-ii-os/source/tools/isa/import_riscv_opcodes.py --output runtime/isa/riscv-opcodes.json --max-files 500 --allow-cached
          python3 vendor/chimera-ii-os/source/tools/isa/build_universal_catalog.py --database vendor/chimera-ii-os/source/isa/isa_database.json --input runtime/isa/riscv-opcodes.json --output runtime/isa/universal-instruction-catalog.json
          mkdir -p vendor/chimera-ii-os/source/system/commands vendor/chimera-ii-os/source/isa/sources/imports vendor/chimera-ii-os/source/isa/generated
          cp runtime/commands/native-command-candidates.json vendor/chimera-ii-os/source/system/commands/native-command-candidates.json
          cp runtime/isa/riscv-opcodes.json vendor/chimera-ii-os/source/isa/sources/imports/riscv-opcodes.json
          cp runtime/isa/universal-instruction-catalog.json vendor/chimera-ii-os/source/isa/generated/universal-instruction-catalog.json
          cmp runtime/commands/native-command-candidates.json vendor/chimera-ii-os/source/system/commands/native-command-candidates.json
          cmp runtime/isa/riscv-opcodes.json vendor/chimera-ii-os/source/isa/sources/imports/riscv-opcodes.json
          cmp runtime/isa/universal-instruction-catalog.json vendor/chimera-ii-os/source/isa/generated/universal-instruction-catalog.json
          python3 - <<'PY_CATALOG_COUNTS'
          import json
          from pathlib import Path
          commands = json.loads(Path("runtime/commands/native-command-candidates.json").read_text())
          isa = json.loads(Path("runtime/isa/universal-instruction-catalog.json").read_text())
          riscv = json.loads(Path("runtime/isa/riscv-opcodes.json").read_text())
          assert commands["counts"]["total"] == len(commands["commands"]) == 3349
          assert commands["counts"]["native_implemented"] == 37
          assert commands["counts"]["catalogue_unique"] == 855
          assert commands["counts"]["catalogue_native_implemented"] == 37
          assert commands["counts"]["catalogue_candidate_only"] == 818
          assert commands["counts"]["candidate_only"] == 3312
          assert isa["record_count"] == len(isa["instructions"]) == 1613
          assert len(isa["unique_architectures"]) == 15
          assert riscv["record_count"] == len(riscv["instructions"]) == 1459
          assert riscv["failed_files"] == 0
          print("Validated 3,349 imported command records (37 implemented; 818 core-catalogue candidates) and 1,613 ISA forms across 15 architectures.")
          PY_CATALOG_COUNTS
      - name: Validate command safety and RNN fallback
        env:
          PYTHONPATH: vendor/chimera-ii-os/source
        run: |
          python3 -m py_compile runtime/commands/import_candidates.py runtime/commands/command_candidate_router.py vendor/chimera-ii-os/source/tools/commands/import_command_candidates.py vendor/chimera-ii-os/source/tools/commands/command_candidate_router.py
          python3 -m py_compile vendor/chimera-ii-os/source/tools/cognition/local_llm.py vendor/chimera-ii-os/source/tools/cognition/test_local_llm.py vendor/chimera-ii-os/source/tools/cognition/trainable_rnn_lm.py vendor/chimera-ii-os/source/tools/isa/isa_candidate_router.py
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tests/isa -p test_import_riscv_opcodes.py -v
          (cd vendor/chimera-ii-os/source && python3 -m unittest tools.cognition.test_trainable_rnn_lm -v)
          (cd vendor/chimera-ii-os/source && python3 -m unittest tools.cognition.test_local_llm -v)
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tools/commands -p test_import_command_candidates.py -v
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tools/commands -p test_command_candidate_router.py -v
          python3 -m unittest discover -s tests/runtime -p test_command_candidates.py -v
          python3 -m unittest discover -s vendor/chimera-ii-os/source/tools/isa -p test_isa_candidate_router.py -v
          python3 vendor/chimera-ii-os/source/tools/isa/validate_rv32_machine_tested_subset.py
          python3 runtime/isa/isa_candidate_router.py "riscv add" --limit 10
          python3 tools/runtime/train_runtime_rnn.py --epochs 2 --hidden 8 --output runtime/cognition/trained-command-isa-rnn.json
          python3 -m py_compile tools/runtime/stage_native_command_runtime.py tools/runtime/mark_runtime_smoke_tested.py tests/runtime/test_stage_native_command_runtime.py tests/runtime/test_mark_runtime_smoke_tested.py
          python3 -m unittest discover -s tests/runtime -p test_stage_native_command_runtime.py -v
          python3 -m unittest discover -s tests/runtime -p test_mark_runtime_smoke_tested.py -v
          python3 tools/runtime/stage_native_command_runtime.py
          OCTAVIAN_ROOT_PREFIX="$PWD/vendor/chimera-ii-os/source/rootfs" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-command "list files" --limit 5 --queue /tmp/octavian-command-pending.jsonl > /tmp/octavian-command-rnn.json
          grep -q '"mode": "trained-character-rnn"' /tmp/octavian-command-rnn.json
          OCTAVIAN_ROOT_PREFIX="$PWD/vendor/chimera-ii-os/source/rootfs" vendor/chimera-ii-os/source/rootfs/usr/bin/octavian-learn-isa "riscv add" --limit 5 --queue /tmp/octavian-isa-pending.jsonl > /tmp/octavian-isa-rnn.json
          grep -q '"mode": "trained-character-rnn"' /tmp/octavian-isa-rnn.json
          python3 tools/runtime/mark_runtime_smoke_tested.py runtime/cognition/runtime-capabilities.json
          python3 tools/runtime/stage_native_command_runtime.py
          python3 runtime/commands/command_candidate_router.py "list files" --limit 10
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/commands/native-command-candidates.json").read_text(encoding="utf-8"))
          assert d["counts"]["total"] == len(d["commands"])
          assert d["counts"]["native_implemented"] == 37
          assert d["counts"]["candidate_only"] > 1000
          assert all(not x["execution_allowed"] for x in d["commands"] if x["status"] == "candidate-only")
          print("Octavian 37-native/candidate registry:", d["counts"])
          PY
      - name: Persist generated Octavian command and ISA registries
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/commands/native-command-candidates.json runtime/isa/riscv-opcodes.json runtime/isa/universal-instruction-catalog.json vendor/chimera-ii-os/source/system/commands/native-command-candidates.json vendor/chimera-ii-os/source/isa/sources/imports/riscv-opcodes.json vendor/chimera-ii-os/source/isa/generated/universal-instruction-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(runtime): persist imported command candidates [catalog-bot]"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          else
            echo "Octavian command registry is already current."
          fi
      - name: Upload Octavian native command registry
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Octavian-Native-Command-Candidates-${{ github.sha }}
          path: |
            runtime/commands/native-command-candidates.json
            runtime/isa/riscv-opcodes.json
            runtime/isa/universal-instruction-catalog.json
            vendor/chimera-ii-os/source/system/commands/native-command-candidates.json
            vendor/chimera-ii-os/source/isa/sources/imports/riscv-opcodes.json
            vendor/chimera-ii-os/source/isa/generated/universal-instruction-catalog.json
            runtime/cognition/trained-command-isa-rnn.json
            runtime/cognition/runtime-capabilities.json
          if-no-files-found: error
          retention-days: 30
