name: Octavian Native Graphics, IDE and Retro Media
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/retro-media/**"
      - "tools/ides/**"
      - "tests/retro_media/**"
      - "vendor/chimera-ii-os/source/desktop/native/**"
      - "vendor/chimera-ii-os/source/tools/runtime/chimera-local-bridge.py"
      - "vendor/chimera-ii-os/source/web/chimera-hub.js"
      - ".github/workflows/native-devtools-ci.yml"
  push:
    branches: [main]
    paths:
      - "tools/retro-media/**"
      - "tools/ides/**"
      - "tests/retro_media/**"
      - "vendor/chimera-ii-os/source/desktop/native/**"
      - "vendor/chimera-ii-os/source/tools/runtime/chimera-local-bridge.py"
      - "vendor/chimera-ii-os/source/web/chimera-hub.js"
      - ".github/workflows/native-devtools-ci.yml"
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics, emulator and image filesystem dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y vice python3-venv cmake ninja-build g++ libgl1-mesa-dev libglfw3-dev libopencv-dev xvfb mesa-utils pkg-config nodejs
          command -v c1541
      - name: Build and verify Amiga and Commodore disk images
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check amitools
          python tools/retro-media/build_retro_media.py --output build/retro-media
          CHIMERA_RETRO_MEDIA_DIR="$PWD/build/retro-media" python -m unittest discover -s tests/retro_media -v
      - name: Build OpenGL and OpenCV native utilities from vendored OS source
        run: |
          cd vendor/chimera-ii-os/source
          cmake -S . -B /tmp/octavian-native-graphics -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/octavian-native-graphics --target chm-opengl-smoke chm-image-inspect -j2
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a /tmp/octavian-native-graphics/desktop/native/chm-opengl-smoke --self-test
          /tmp/octavian-native-graphics/desktop/native/chm-image-inspect --self-test
          /tmp/octavian-native-graphics/desktop/native/chm-image-inspect --help
      - name: Validate IDE manager and emulator UI/runtime source
        run: |
          bash -n tools/ides/ide-manager.sh
          bash tools/ides/ide-manager.sh list
          bash tools/ides/ide-manager.sh --help
          node --check vendor/chimera-ii-os/source/web/chimera-hub.js
          python3 -m py_compile tools/retro-media/build_retro_media.py vendor/chimera-ii-os/source/tools/runtime/chimera-local-bridge.py
