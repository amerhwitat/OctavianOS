name: ISA Catalog Refresh Contract
on:
  pull_request:
    paths:
      - 'tools/isa/refresh_isa_catalog.py'
      - 'vendor/chimera-ii-os/source/tools/isa/refresh_isa_catalog.py'
      - 'vendor/chimera-ii-os/source/tools/isa/test_refresh_isa_catalog.py'
      - 'vendor/chimera-ii-os/source/tools/isa/ONLINE-ISA-REFRESH.md'
      - 'vendor/chimera-ii-os/source/build-chimera-iso.sh'
      - '.github/workflows/isa-catalog-refresh.yml'
  push:
    paths:
      - 'tools/isa/refresh_isa_catalog.py'
      - 'vendor/chimera-ii-os/source/tools/isa/refresh_isa_catalog.py'
      - 'vendor/chimera-ii-os/source/tools/isa/test_refresh_isa_catalog.py'
      - 'vendor/chimera-ii-os/source/tools/isa/ONLINE-ISA-REFRESH.md'
      - 'vendor/chimera-ii-os/source/build-chimera-iso.sh'
      - '.github/workflows/isa-catalog-refresh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check Python syntax and shell build script
        run: |
          python3 -m py_compile tools/isa/refresh_isa_catalog.py vendor/chimera-ii-os/source/tools/isa/refresh_isa_catalog.py vendor/chimera-ii-os/source/tools/isa/test_refresh_isa_catalog.py
          bash -n vendor/chimera-ii-os/source/build-chimera-iso.sh
      - name: Test ISA refresh schema without network
        run: |
          python3 tools/isa/refresh_isa_catalog.py --self-test
          python3 vendor/chimera-ii-os/source/tools/isa/test_refresh_isa_catalog.py -v
