name: Import ChimeraIIOS source history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-chimera-history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-history-import
  cancel-in-progress: false

jobs:
  import-history:
    name: Preserve upstream branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout OctavianOS bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch full ChimeraIIOS history
        env:
          SOURCE_URL: https://github.com/amerhwitat/ChimeraIIOS.git
        run: |
          set -euo pipefail
          git init --bare source-mirror.git
          git -C source-mirror.git remote add source "$SOURCE_URL"
          git -C source-mirror.git fetch --prune source \
            '+refs/heads/*:refs/heads/source/*' \
            '+refs/tags/*:refs/tags/source/*'
          git -C source-mirror.git fsck --connectivity-only

      - name: Push source refs without overwriting OctavianOS main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd source-mirror.git
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            name="${ref#refs/heads/source/}"
            git push target "$ref:refs/heads/chimera-import/$name"
          done < <(git for-each-ref --format='%(refname)' refs/heads/source/)

          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            name="${ref#refs/tags/source/}"
            git push target "$ref:refs/tags/chimera-import/$name"
          done < <(git for-each-ref --format='%(refname)' refs/tags/source/)

          {
            echo "### Source history import"
            echo "Fetched and integrity-checked source refs from amerhwitat/ChimeraIIOS."
            echo "Branches were published as `chimera-import/<branch>`; tags as `chimera-import/<tag>`."
            echo "The OctavianOS bootstrap `main` branch was not overwritten."
            echo "Next step: build the OctavianOS working tree from the imported history and run the boot/installer acceptance gates."
            echo
            echo "Imported branches:"
            git for-each-ref --format='- %(refname:strip=3)' refs/heads/source/
            echo
            echo "Imported tags:"
            git for-each-ref --format='- %(refname:strip=3)' refs/tags/source/
          } >> "$GITHUB_STEP_SUMMARY"
