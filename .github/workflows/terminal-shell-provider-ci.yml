name: Open-source terminal and shell provider build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/chimera-ii-os/source/aurora/terminals/**"
      - "vendor/chimera-ii-os/source/aurora/shells/**"
      - "vendor/chimera-ii-os/source/scripts/chimera-iso-terminal-shell-hook.sh"
      - "vendor/chimera-ii-os/source/scripts/import-aurora-terminal-suite.sh"
      - "vendor/chimera-ii-os/source/scripts/import-aurora-shell-suite.sh"
      - "vendor/chimera-ii-os/source/tools/terminals/**"
      - "vendor/chimera-ii-os/source/live-image/verify-terminal-shell-suite.sh"
      - ".github/workflows/terminal-shell-provider-ci.yml"
  push:
    branches: [main]
    paths:
      - "vendor/chimera-ii-os/source/aurora/terminals/**"
      - "vendor/chimera-ii-os/source/aurora/shells/**"
      - "vendor/chimera-ii-os/source/scripts/chimera-iso-terminal-shell-hook.sh"
      - "vendor/chimera-ii-os/source/scripts/import-aurora-terminal-suite.sh"
      - "vendor/chimera-ii-os/source/scripts/import-aurora-shell-suite.sh"
      - "vendor/chimera-ii-os/source/tools/terminals/**"
      - "vendor/chimera-ii-os/source/live-image/verify-terminal-shell-suite.sh"
      - ".github/workflows/terminal-shell-provider-ci.yml"

permissions:
  contents: read

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install source build toolchains and libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential autoconf automake bison flex gettext git curl pkg-config cmake ninja-build meson cargo rustc golang-go libncurses-dev libreadline-dev libpcre2-dev libssl-dev libicu-dev libx11-dev libxext-dev libxrender-dev libxft-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfreetype6-dev libfontconfig1-dev libgtk-3-dev libvte-2.91-dev libvte-2.91-gtk4-dev libgtk-4-dev libadwaita-1-dev python3-venv libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev qt6-base-dev qt6-declarative-dev libqt6svg6-dev libqt6shadertools6-dev libyaml-cpp-dev libutf8proc-dev
      - name: Compile open-source shells and terminal emulators, then stage signed package fallbacks
        working-directory: vendor/chimera-ii-os/source
        env:
          CHIMERA_ROOTFS_DIR: ${{ runner.temp }}/terminal-shell-rootfs
          CHIMERA_BUILD_DIR: ${{ runner.temp }}/terminal-shell-build
          CHIMERA_TERMINAL_MODE: source-first
          CHIMERA_SHELL_MODE: source-first
          CHIMERA_TERMINAL_REQUIRE_ALL: "1"
          CHIMERA_TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          bash -n scripts/chimera-iso-terminal-shell-hook.sh
          bash -n scripts/import-aurora-terminal-suite.sh
          bash -n scripts/import-aurora-shell-suite.sh
          bash -n tools/terminals/stage-open-source-terminal-shells.sh
          bash scripts/chimera-iso-terminal-shell-hook.sh
          bash live-image/verify-terminal-shell-suite.sh "$CHIMERA_ROOTFS_DIR" x86_64
          python3 - "$CHIMERA_ROOTFS_DIR/usr/share/chimera/aurora/terminal-shell-staging.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["schema"] == "AURORA-TERMINAL-SHELL-STAGING-2"
          assert len(d["entries"]) == 28
          verified=sum(x["status"] in ("verified-elf-provider", "verified-script-provider") for x in d["entries"])
          assert verified == 28, [x for x in d["entries"] if x["status"] not in ("verified-elf-provider", "verified-script-provider")]
          assert all(x["runtime_status"] in ("shell-command-smoke-pass", "version-smoke-pass") for x in d["entries"])
          print("Verified and smoke-tested ELF/script providers:", verified, "/ 28")
          for x in d["entries"]:
              print(x["id"], x["status"], x["runtime_status"], x.get("elf_machine",""))
          PY
      - name: Upload real terminal and shell provider bundle and build report
        uses: actions/upload-artifact@v4
        with:
          name: aurora-terminal-shell-providers-x86_64
          path: |
            ${{ runner.temp }}/terminal-shell-rootfs/usr/bin/
            ${{ runner.temp }}/terminal-shell-rootfs/usr/share/chimera/aurora/terminal-shell-staging.json
            ${{ runner.temp }}/terminal-shell-rootfs/usr/share/applications/
          if-no-files-found: warn
          retention-days: 30
